z en la retina"],"La respuesta inmediata de alerta ante el estrés","L3Q12"],["Una paciente presenta una obstrucción en una trompa uterina. ¿Qué función se ve más directamente dificultada?",["El transporte del óvulo y el encuentro habitual entre óvulo y espermatozoide","La implantación del embrión en el útero","La producción de leche en las glándulas mamarias","La salida de la orina desde la vejiga"],"El transporte del óvulo y el encuentro habitual entre óvulo y espermatozoide","L3Q13"],["Un agrandamiento de la próstata comprime la uretra que atraviesa esa glándula. ¿Qué dificultad puede causar?",["Dificultad para expulsar la orina","Dificultad para tragar alimentos","Pérdida de audición","Disminución del intercambio gaseoso en los pulmones"],"Dificultad para expulsar la orina","L3Q14"],["Una opacidad en el cristalino impide que la luz se enfoque correctamente sobre la retina. ¿Qué capacidad se afecta de forma directa?",["La visión nítida","La detección del equilibrio","La percepción de sabores","La producción de lágrimas"],"La visión nítida","L3Q15"],["Una lesión de la cóclea daña las células que transforman vibraciones en señales nerviosas. ¿Qué sentido se altera principalmente?",["La audición","El olfato","El gusto","La visión"],"La audición","L3Q16"],["Una enfermedad destruye selectivamente muchos bastones de la retina. ¿Qué dificultad es más probable?",["Ver con poca luz","Distinguir sonidos agudos","Percibir olores intensos","Mantener el equilibrio al girar"],"Ver con poca luz","L3Q17"],["Una persona pierde parte de la función de su bazo. ¿Qué consecuencia puede aumentar debido al papel inmunitario de este órgano?",["Mayor vulnerabilidad a algunas infecciones","Imposibilidad de producir insulina","Interrupción de la formación de bilis","Pérdida de la capacidad de filtrar aire"],"Mayor vulnerabilidad a algunas infecciones","L3Q18"],["La pared de la aorta pierde parte de su elasticidad. ¿Qué función se vería comprometida de manera más directa?",["Amortiguar las variaciones de presión cuando el corazón expulsa sangre","Impedir que los alimentos entren en la tráquea","Producir células inmunitarias en la sangre","Almacenar nutrientes absorbidos en el intestino"],"Amortiguar las variaciones de presión cuando el corazón expulsa sangre","L3Q19"],["Una hernia de disco intervertebral comprime una raíz nerviosa cercana. ¿Qué estructura normal está dañada o desplazada?",["El disco de fibrocartílago situado entre vértebras","El cartílago elástico de la oreja","La membrana que rodea el corazón","El tendón que une la rodilla con la pierna"],"El disco de fibrocartílago situado entre vértebras","L3Q20"],["En un corte histológico de piel se observa que la epidermis no contiene vasos sanguíneos propios. ¿Cómo recibe principalmente nutrientes esa capa?",["Por difusión desde los vasos de la dermis subyacente","Por bombeo directo de sangre dentro de la epidermis","Mediante conductos que la conectan con los huesos","Por absorción desde el aire exterior"],"Por difusión desde los vasos de la dermis subyacente","L3Q21"],["Una herida en el tórax permite que entre aire en el espacio pleural y el pulmón se colapse parcialmente. ¿Qué mecanismo explica el colapso?",["Se pierde la presión negativa que ayuda a mantener expandido el pulmón","Se bloquea la producción de glóbulos rojos en la médula ósea","Aumenta la presión del líquido dentro del cráneo","Se interrumpe la contracción del músculo liso intestinal"],"Se pierde la presión negativa que ayuda a mantener expandido el pulmón","L3Q22"],["¿Cuántas vértebras cervicales tiene normalmente la columna vertebral humana?",["7","5","12","24"],"7","L3Q23"],["Una imagen muestra una estructura situada en el cuadrante superior izquierdo del abdomen y relacionada con la eliminación de glóbulos rojos envejecidos. ¿Qué órgano es?",["El bazo","El apéndice","La vejiga urinaria","El páncreas"],"El bazo","L3Q24"],["Un análisis detecta niveles bajos de hormonas tiroideas y aumento de TSH. ¿Qué glándula es el objetivo directo de la TSH?",["La tiroides","La hipófisis","La suprarrenal","El timo"],"La tiroides","L3Q25"],["Una persona tiene baja densidad mineral ósea, aunque sus huesos mantienen su forma general. ¿Qué propiedad está reducida principalmente?",["La cantidad de mineral por volumen de hueso","El número de cavidades del cuerpo","La capacidad de los nervios para conducir impulsos","La cantidad de cartílago en el pabellón auricular"],"La cantidad de mineral por volumen de hueso","L3Q26"],["Tras una luxación del hombro, una persona no puede elevar el brazo con normalidad. ¿Qué tipo de articulación permite normalmente gran amplitud de movimiento en esa región?",["Articulación sinovial esferoidea","Articulación fibrosa inmóvil","Articulación cartilaginosa sin cavidad","Sutura craneal"],"Articulación sinovial esferoidea","L3Q27"],["Un problema en la placenta reduce el intercambio de gases entre la sangre materna y la fetal. ¿Qué consecuencia directa corre más riesgo de ocurrir en el feto?",["Menor aporte de oxígeno","Menor producción de bilis","Pérdida de la capacidad para formar cartílago","Interrupción de la digestión en el estómago"],"Menor aporte de oxígeno","L3Q28"],["Un cálculo queda atascado en un uréter. ¿Qué efecto inmediato puede producir aguas arriba de la obstrucción?",["Dificultar el paso de la orina desde el riñón hacia la vejiga","Impedir el paso de la bilis hacia el intestino","Bloquear el movimiento del alimento por el esófago","Reducir el flujo de aire desde la faringe"],"Dificultar el paso de la orina desde el riñón hacia la vejiga","L3Q29"],["Un niño presenta una alteración del timo que afecta la maduración de ciertos linfocitos. ¿Qué tipo de células se ve afectado principalmente?",["Linfocitos T","Glóbulos rojos","Plaquetas","Células musculares cardíacas"],"Linfocitos T","L3Q30"]]];
const KEY='biology_anatomia_progress_v5';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
