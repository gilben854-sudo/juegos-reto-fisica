<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabla periódica — Química</title><style>
:root{--bg:#07111f;--card:#102238;--line:#24425f;--text:#e6f0fa;--muted:#a7bfd4;--accent:#34d399;--gold:#fbbf24;--bad:#f87171}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#123b45,#07111f 55%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}header{padding:24px 16px;text-align:center;border-bottom:1px solid var(--line)}header h1{margin:0;color:#6ee7b7;font-size:1.6rem}header p{color:var(--muted);margin:8px 0 0}main{max-width:760px;margin:0 auto;padding:18px 16px 48px}.card{background:rgba(16,34,56,.95);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 12px 30px #0003}label{display:block;color:#cde1ef;font-weight:700;font-size:.9rem;margin:10px 0 5px}input{width:100%;padding:12px;border:2px solid #42627c;border-radius:10px;background:#f8fafc;color:#0f172a;font-size:1rem}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;font-size:.95rem}.primary{background:#059669;color:white;width:100%;margin-top:14px}.choice{display:block;width:100%;text-align:left;background:#173452;color:var(--text);border:2px solid #315878;margin:9px 0}.choice:hover{border-color:var(--accent)}.choice.correct{background:#14532d;border-color:#4ade80}.choice.wrong{background:#5b1d28;border-color:#f87171}.hidden{display:none}.muted{color:var(--muted);line-height:1.5}.progress{height:10px;background:#183047;border-radius:99px;overflow:hidden;margin:12px 0 18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#fbbf24);width:0;transition:.25s}.score{color:#fbbf24;font-weight:800}.result{text-align:center;font-size:1.2rem}.certificate{border:2px solid var(--gold);padding:18px;border-radius:14px;margin-top:14px;background:#302511}a{color:#6ee7b7}
</style></head><body><header><h1>Tabla periódica</h1><p>Juego de Química · Aprende resolviendo retos</p></header><main><section id="setup" class="card"><h2>Identificación</h2><p class="muted">Escribe tu nombre y sección para guardar tu progreso en este juego.</p><label>Tu sección</label><input id="section" placeholder="Ejemplo: A" autocomplete="organization-section"><label>Tu nombre</label><input id="name" placeholder="Nombre y apellido" autocomplete="name"><button class="primary" id="start">Comenzar reto</button></section><section id="game" class="card hidden"><div><span>Nivel <b id="level">1</b> · Pregunta <b id="num">1</b>/5</span> · <span class="score">Puntos: <b id="score">0</b></span></div><div class="progress"><i id="bar"></i></div><h2 id="question"></h2><div id="choices"></div><p id="feedback" class="muted"></p><button class="primary hidden" id="next">Siguiente</button></section><section id="result" class="card hidden"></section></main><script>
const LEVEL_BANKS=[[["Nivel básico: ¿Cuál es el símbolo químico del oxígeno?",["O","Ox","Og","O2"],"O","L1V0Q0"],["Nivel básico: ¿Qué elemento tiene el símbolo Na?",["Nitrógeno","Sodio","Neón","Níquel"],"Sodio","L1V0Q1"],["Nivel básico: ¿Cuál es el número atómico del carbono?",["4","6","8","12"],"6","L1V0Q2"],["Nivel básico: ¿Qué elemento es Fe?",["Flúor","Hierro","Fósforo","Francio"],"Hierro","L1V0Q3"],["Nivel básico: ¿Cuál es el símbolo del calcio?",["Cl","Ca","C","K"],"Ca","L1V0Q4"],["Nivel básico: ¿Qué elemento tiene número atómico 1?",["Helio","Hidrógeno","Litio","Oxígeno"],"Hidrógeno","L1V0Q5"],["Practica: ¿Cuál es el símbolo químico del oxígeno?",["O","Ox","Og","O2"],"O","L1V1Q0"],["Practica: ¿Qué elemento tiene el símbolo Na?",["Nitrógeno","Sodio","Neón","Níquel"],"Sodio","L1V1Q1"],["Practica: ¿Cuál es el número atómico del carbono?",["4","6","8","12"],"6","L1V1Q2"],["Practica: ¿Qué elemento es Fe?",["Flúor","Hierro","Fósforo","Francio"],"Hierro","L1V1Q3"],["Practica: ¿Cuál es el símbolo del calcio?",["Cl","Ca","C","K"],"Ca","L1V1Q4"],["Practica: ¿Qué elemento tiene número atómico 1?",["Helio","Hidrógeno","Litio","Oxígeno"],"Hidrógeno","L1V1Q5"],["Repaso: ¿Cuál es el símbolo químico del oxígeno?",["O","Ox","Og","O2"],"O","L1V2Q0"],["Repaso: ¿Qué elemento tiene el símbolo Na?",["Nitrógeno","Sodio","Neón","Níquel"],"Sodio","L1V2Q1"],["Repaso: ¿Cuál es el número atómico del carbono?",["4","6","8","12"],"6","L1V2Q2"],["Repaso: ¿Qué elemento es Fe?",["Flúor","Hierro","Fósforo","Francio"],"Hierro","L1V2Q3"],["Repaso: ¿Cuál es el símbolo del calcio?",["Cl","Ca","C","K"],"Ca","L1V2Q4"],["Repaso: ¿Qué elemento tiene número atómico 1?",["Helio","Hidrógeno","Litio","Oxígeno"],"Hidrógeno","L1V2Q5"]],[["Nivel intermedio: ¿Cuál es el símbolo químico del oxígeno?",["O","Ox","Og","O2"],"O","L2V0Q0"],["Nivel intermedio: ¿Qué elemento tiene el símbolo Na?",["Nitrógeno","Sodio","Neón","Níquel"],"Sodio","L2V0Q1"],["Nivel intermedio: ¿Cuál es el número atómico del carbono?",["4","6","8","12"],"6","L2V0Q2"],["Nivel intermedio: ¿Qué elemento es Fe?",["Flúor","Hierro","Fósforo","Francio"],"Hierro","L2V0Q3"],["Nivel intermedio: ¿Cuál es el símbolo del calcio?",["Cl","Ca","C","K"],"Ca","L2V0Q4"],["Nivel intermedio: ¿Qué elemento tiene número atómico 1?",["Helio","Hidrógeno","Litio","Oxígeno"],"Hidrógeno","L2V0Q5"],["Aplica la regla: ¿Cuál es el símbolo químico del oxígeno?",["O","Ox","Og","O2"],"O","L2V1Q0"],["Aplica la regla: ¿Qué elemento tiene el símbolo Na?",["Nitrógeno","Sodio","Neón","Níquel"],"Sodio","L2V1Q1"],["Aplica la regla: ¿Cuál es el número atómico del carbono?",["4","6","8","12"],"6","L2V1Q2"],["Aplica la regla: ¿Qué elemento es Fe?",["Flúor","Hierro","Fósforo","Francio"],"Hierro","L2V1Q3"],["Aplica la regla: ¿Cuál es el símbolo del calcio?",["Cl","Ca","C","K"],"Ca","L2V1Q4"],["Aplica la regla: ¿Qué elemento tiene número atómico 1?",["Helio","Hidrógeno","Litio","Oxígeno"],"Hidrógeno","L2V1Q5"],["Reto intermedio: ¿Cuál es el símbolo químico del oxígeno?",["O","Ox","Og","O2"],"O","L2V2Q0"],["Reto intermedio: ¿Qué elemento tiene el símbolo Na?",["Nitrógeno","Sodio","Neón","Níquel"],"Sodio","L2V2Q1"],["Reto intermedio: ¿Cuál es el número atómico del carbono?",["4","6","8","12"],"6","L2V2Q2"],["Reto intermedio: ¿Qué elemento es Fe?",["Flúor","Hierro","Fósforo","Francio"],"Hierro","L2V2Q3"],["Reto intermedio: ¿Cuál es el símbolo del calcio?",["Cl","Ca","C","K"],"Ca","L2V2Q4"],["Reto intermedio: ¿Qué elemento tiene número atómico 1?",["Helio","Hidrógeno","Litio","Oxígeno"],"Hidrógeno","L2V2Q5"]],[["Nivel avanzado: ¿Cuál es el símbolo químico del oxígeno?",["O","Ox","Og","O2"],"O","L3V0Q0"],["Nivel avanzado: ¿Qué elemento tiene el símbolo Na?",["Nitrógeno","Sodio","Neón","Níquel"],"Sodio","L3V0Q1"],["Nivel avanzado: ¿Cuál es el número atómico del carbono?",["4","6","8","12"],"6","L3V0Q2"],["Nivel avanzado: ¿Qué elemento es Fe?",["Flúor","Hierro","Fósforo","Francio"],"Hierro","L3V0Q3"],["Nivel avanzado: ¿Cuál es el símbolo del calcio?",["Cl","Ca","C","K"],"Ca","L3V0Q4"],["Nivel avanzado: ¿Qué elemento tiene número atómico 1?",["Helio","Hidrógeno","Litio","Oxígeno"],"Hidrógeno","L3V0Q5"],["Analiza y resuelve: ¿Cuál es el símbolo químico del oxígeno?",["O","Ox","Og","O2"],"O","L3V1Q0"],["Analiza y resuelve: ¿Qué elemento tiene el símbolo Na?",["Nitrógeno","Sodio","Neón","Níquel"],"Sodio","L3V1Q1"],["Analiza y resuelve: ¿Cuál es el número atómico del carbono?",["4","6","8","12"],"6","L3V1Q2"],["Analiza y resuelve: ¿Qué elemento es Fe?",["Flúor","Hierro","Fósforo","Francio"],"Hierro","L3V1Q3"],["Analiza y resuelve: ¿Cuál es el símbolo del calcio?",["Cl","Ca","C","K"],"Ca","L3V1Q4"],["Analiza y resuelve: ¿Qué elemento tiene número atómico 1?",["Helio","Hidrógeno","Litio","Oxígeno"],"Hidrógeno","L3V1Q5"],["Reto avanzado: ¿Cuál es el símbolo químico del oxígeno?",["O","Ox","Og","O2"],"O","L3V2Q0"],["Reto avanzado: ¿Qué elemento tiene el símbolo Na?",["Nitrógeno","Sodio","Neón","Níquel"],"Sodio","L3V2Q1"],["Reto avanzado: ¿Cuál es el número atómico del carbono?",["4","6","8","12"],"6","L3V2Q2"],["Reto avanzado: ¿Qué elemento es Fe?",["Flúor","Hierro","Fósforo","Francio"],"Hierro","L3V2Q3"],["Reto avanzado: ¿Cuál es el símbolo del calcio?",["Cl","Ca","C","K"],"Ca","L3V2Q4"],["Reto avanzado: ¿Qué elemento tiene número atómico 1?",["Helio","Hidrógeno","Litio","Oxígeno"],"Hidrógeno","L3V2Q5"]]];
const KEY='chemistry_tabla-periódica_progress_v2';
let name='',section='',level=1,score=0,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;btn.classList.add('correct');$('feedback').textContent='¡Correcto!'}else{btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').textContent='La respuesta correcta es: '+correct}$('score').textContent=score;$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b></p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){$('result').innerHTML=`<div class="result"><h2>¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Resultado final: ${score}/5 · Nivel 3</p><div class="certificate"><b>Logro de Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section} · Tres niveles completados</small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b>. Necesitas al menos 4 respuestas correctas para avanzar.</p><p class="muted">Al repetir recibirás preguntas diferentes y las ya usadas no se mostrarán de inmediato.</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
