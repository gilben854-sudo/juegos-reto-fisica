(async function(){
  const code=(localStorage.getItem('saas_classCode')||'').trim().toUpperCase();
  const name=(localStorage.getItem('saas_studentName')||'').trim();
  const fail=function(){ ['saas_access_ok','saas_classCode','saas_studentName','saas_subjects','saas_student_token'].forEach(k=>localStorage.removeItem(k)); location.replace('/catalogo.html?access=expired'); };
  if(!code||!name) return fail();
  try{
    const r=await fetch('/api/access/check?classCode='+encodeURIComponent(code),{cache:'no-store',headers:{Authorization:'Bearer '+(localStorage.getItem('saas_student_token')||'')}});
    const d=await r.json();
    if(!d.allowed || (Array.isArray(d.subjects)&&d.subjects.length&&!d.subjects.includes('fisica'))) return fail();
    localStorage.setItem('saas_access_ok','1');
    localStorage.setItem('saas_student_token',d.accessToken||localStorage.getItem('saas_student_token')||'');
    localStorage.setItem('saas_subjects',JSON.stringify(d.subjects||[]));
  }catch(e){ return fail(); }
})();

)",["127 g","63,5 g","159 g","254 g"],"127 g","L3Q14"],["Al calentar 16,8 g de NaHCO₃ según 2NaHCO₃ → Na₂CO₃ + CO₂ + H₂O, ¿qué masa de CO₂ se produce? (M(NaHCO₃) = 84; M(CO₂) = 44 g/mol)",["4,4 g","8,8 g","2,2 g","16,8 g"],"4,4 g","L3Q15"],["En Zn + 2HCl → ZnCl₂ + H₂ se combinan 13 g de Zn y 0,3 mol de HCl. ¿Cuántos moles de H₂ se forman? (M(Zn) = 65 g/mol)",["0,15 mol","0,20 mol","0,30 mol","0,10 mol"],"0,15 mol","L3Q16"],["En 2AgNO₃ + CaCl₂ → 2AgCl + Ca(NO₃)₂ se mezclan 0,4 mol de AgNO₃ y 0,3 mol de CaCl₂. ¿Cuántos moles de AgCl precipitan?",["0,4 mol","0,6 mol","0,2 mol","0,3 mol"],"0,4 mol","L3Q17"],["En BaCl₂ + Na₂SO₄ → BaSO₄ + 2NaCl se mezclan 0,25 mol de BaCl₂ y 0,20 mol de Na₂SO₄. ¿Cuántos moles de BaSO₄ se forman?",["0,20 mol","0,25 mol","0,45 mol","0,10 mol"],"0,20 mol","L3Q18"],["En 2Al + Fe₂O₃ → Al₂O₃ + 2Fe, ¿qué masa de hierro se obtiene de 0,5 mol de Fe₂O₃ con Al en exceso? (M(Fe) = 55,8 g/mol)",["55,8 g","27,9 g","111,6 g","83,7 g"],"55,8 g","L3Q19"],["En la descomposición de CaCO₃, la masa teórica de CO₂ era 22 g y se obtuvieron 19,8 g. ¿Cuál fue el porcentaje de rendimiento?",["90 %","10 %","110 %","80 %"],"90 %","L3Q20"],["Una muestra impura de Na₂CO₃ tiene una masa de 20 g y es 80 % Na₂CO₃ en masa. Según Na₂CO₃ + 2HCl → 2NaCl + H₂O + CO₂, ¿qué masa de CO₂ puede producir? (M(Na₂CO₃) = 106; M(CO₂) = 44 g/mol)",["6,64 g aproximadamente","8,30 g aproximadamente","3,32 g aproximadamente","13,28 g aproximadamente"],"6,64 g aproximadamente","L3Q21"],["A condiciones estándar, 1 mol de gas ocupa 22,4 L. ¿Qué volumen ocupan 0,25 mol de SF₆?",["5,6 L","22,4 L","89,6 L","2,24 L"],"5,6 L","L3Q22"],["¿Cuántos átomos en total hay en 0,5 mol de unidades fórmula de Al₂(SO₄)₃?",["5,1187 × 10²⁴ átomos aproximadamente","8,5 × 10²³ átomos","1,5055 × 10²⁴ átomos","3,011 × 10²⁴ átomos"],"5,1187 × 10²⁴ átomos aproximadamente","L3Q23"],["Se mezclan 0,2 mol de H₂ y 0,1 mol de O₂ según 2H₂ + O₂ → 2H₂O. ¿Cuántos moles de agua se forman si la reacción es completa?",["0,2 mol","0,1 mol","0,3 mol","0,4 mol"],"0,2 mol","L3Q24"],["¿Qué masa de agua de cristalización hay en 0,1 mol de CuSO₄·5H₂O? (H = 1; O = 16 g/mol)",["9 g","18 g","90 g","5 g"],"9 g","L3Q25"],["¿Qué masa tienen 0,2 mol de Ca₃(PO₄)₂? (Ca = 40; P = 31; O = 16 g/mol)",["62 g","31 g","155 g","310 g"],"62 g","L3Q26"],["¿Qué masa corresponde a 3,011 × 10²³ moléculas de NO₂? (M(NO₂) = 46 g/mol)",["23 g","46 g","11,5 g","92 g"],"23 g","L3Q27"],["Si 0,10 mol de NH₄NO₃ se disocia completamente como NH₄NO₃ → NH₄⁺ + NO₃⁻, ¿cuántos iones se forman en total?",["1,2044 × 10²³ iones","6,022 × 10²² iones","6,022 × 10²³ iones","1,2044 × 10²⁴ iones"],"1,2044 × 10²³ iones","L3Q28"],["En la combustión C₃H₈ + 5O₂ → 3CO₂ + 4H₂O, ¿cuántos moles de O₂ se necesitan para quemar por completo 2 mol de propano?",["10 mol","5 mol","6 mol","8 mol"],"10 mol","L3Q29"],["En H₂SO₄ + 2KOH → K₂SO₄ + 2H₂O se mezclan 0,3 mol de H₂SO₄ y 0,5 mol de KOH. ¿Cuántos moles de K₂SO₄ pueden formarse?",["0,25 mol","0,30 mol","0,50 mol","0,15 mol"],"0,25 mol","L3Q30"]]];
const KEY='chemistry_mol_masa_molar_progress_v5';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Mol y masa molar<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
