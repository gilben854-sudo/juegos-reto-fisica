ue el ventrículo derecho bombee eficazmente. ¿Qué circuito se afectará primero de forma directa?",["El flujo de sangre hacia los pulmones","El flujo de orina hacia la vejiga","El movimiento del alimento por el esófago","La conducción de impulsos desde la retina"],"El flujo de sangre hacia los pulmones","L3Q10"],["Un trazador se inyecta en una vena del brazo y se sigue hasta que llega a los pulmones. ¿Qué secuencia describe mejor su recorrido?",["Venas cavas, aurícula derecha, ventrículo derecho y arterias pulmonares","Aorta, aurícula izquierda, ventrículo izquierdo y venas pulmonares","Vena porta, ventrículo izquierdo, tráquea y alvéolos","Arterias pulmonares, aurícula izquierda, uréteres y pulmones"],"Venas cavas, aurícula derecha, ventrículo derecho y arterias pulmonares","L3Q11"],["El pulso de una persona es de 72 latidos por minuto. ¿Cuántos latidos da aproximadamente en 5 minutos si el ritmo se mantiene?",["360","144","72","420"],"360","L3Q12"],["Una lesión interrumpe la comunicación entre el encéfalo y las piernas a nivel de la médula espinal. ¿Qué capacidad puede verse afectada por debajo de la lesión?",["La sensibilidad y el control voluntario de movimientos","La producción de bilis y saliva","La entrada de aire a la nariz exclusivamente","La filtración inicial en los riñones"],"La sensibilidad y el control voluntario de movimientos","L3Q13"],["Una persona distingue un objeto, pero no logra nombrarlo ni decidir cómo responder. ¿Qué capacidad cerebral podría estar alterada?",["La interpretación e integración de la información sensorial","La filtración de desechos nitrogenados","La contracción del diafragma únicamente","La coagulación de la sangre"],"La interpretación e integración de la información sensorial","L3Q14"],["En una prueba, una persona retira el pie de un objeto punzante antes de identificar conscientemente el dolor. ¿Qué orden de eventos explica mejor el reflejo?",["Receptor sensorial, neurona sensitiva, médula espinal, neurona motora y músculo","Músculo, vejiga, neurona sensitiva, pulmón y receptor","Cerebelo, riñón, neurona motora, intestino y piel","Receptor, arteria, estómago, neurona motora y corazón"],"Receptor sensorial, neurona sensitiva, médula espinal, neurona motora y músculo","L3Q15"],["Un fármaco bloquea los receptores de un neurotransmisor en una sinapsis. ¿Qué efecto se espera en la neurona que recibe la señal?",["Puede disminuir o impedirse la respuesta al neurotransmisor","Aumenta automáticamente la filtración renal","Se produce hemoglobina en el citoplasma","El impulso se convierte en bilis"],"Puede disminuir o impedirse la respuesta al neurotransmisor","L3Q16"],["Una persona produce 1,5 L de orina en 24 horas. Si bebió 2,5 L de agua y perdió 0,7 L por la piel y la respiración, ¿qué volumen queda como diferencia aproximada entre entradas y esas salidas?",["0,3 L","1,2 L","2,0 L","4,7 L"],"0,3 L","L3Q17"],["Un análisis muestra una tasa de filtración glomerular muy reducida y acumulación de urea en la sangre. ¿Qué relación explica el resultado?",["Los riñones filtran menos plasma y eliminan menos urea","El estómago absorbe demasiada urea hacia el aire","Los pulmones convierten urea en oxígeno","La vejiga deja de producir sangre"],"Los riñones filtran menos plasma y eliminan menos urea","L3Q18"],["En un experimento, se comparan dos muestras de orina: una contiene mucha más agua y menos solutos por volumen que la otra. ¿Cómo se describe la primera?",["Más diluida","Más concentrada","Más oxigenada","Más rica en hemoglobina"],"Más diluida","L3Q19"],["Una persona pierde sudor abundante sin beber y disminuye su volumen sanguíneo. ¿Qué respuesta ayuda a mantener la presión y conservar agua?",["Aumenta la retención renal de agua y se reduce el volumen de orina","Aumenta la pérdida de agua en la orina","Se detiene la circulación hacia el corazón","El intestino expulsa todo el plasma"],"Aumenta la retención renal de agua y se reduce el volumen de orina","L3Q20"],["Un riñón filtra 180 L de líquido al día, pero normalmente se excretan cerca de 1,5 L como orina. ¿Qué conclusión es correcta?",["La mayor parte del agua filtrada se reabsorbe","Toda el agua filtrada se convierte en orina","Los riñones producen 180 L de sangre al día","La vejiga reabsorbe la mayor parte del filtrado"],"La mayor parte del agua filtrada se reabsorbe","L3Q21"],["Un paciente tiene una obstrucción en ambos uréteres. Si no se resuelve, ¿qué problema serio puede desarrollarse?",["Acumulación de orina y aumento de presión hacia los riñones","Entrada de alimento a los pulmones por la tráquea","Falta de producción de hemoglobina en el corazón","Interrupción de la absorción de luz en la retina"],"Acumulación de orina y aumento de presión hacia los riñones","L3Q22"],["Una persona presenta exceso de ácido en la sangre porque no puede eliminar suficiente dióxido de carbono al respirar. ¿Qué sistema, además del respiratorio, transporta ese gas desde los tejidos?",["Sistema circulatorio","Sistema digestivo","Sistema urinario únicamente","Sistema esquelético"],"Sistema circulatorio","L3Q23"],["Al analizar la sangre que entra y sale de los pulmones, ¿qué cambio se espera normalmente?",["Aumenta el oxígeno y disminuye el dióxido de carbono","Disminuye el oxígeno y aumenta la urea","Aumentan simultáneamente la glucosa y las plaquetas","Desaparecen todos los glóbulos rojos"],"Aumenta el oxígeno y disminuye el dióxido de carbono","L3Q24"],["Una persona con una obstrucción intestinal no puede absorber suficiente agua y nutrientes. ¿Qué combinación de efectos es más probable?",["Heces más líquidas y riesgo de deshidratación o malnutrición","Menor ventilación y acumulación de aire en la vejiga","Exceso de hemoglobina y mejor absorción de grasas","Aumento inmediato de la producción de neuronas"],"Heces más líquidas y riesgo de deshidratación o malnutrición","L3Q25"],["Una persona ingiere una sustancia tóxica que se absorbe en el intestino y llega a la sangre. ¿Qué combinación de órganos participa más directamente en procesarla y eliminar muchos de sus desechos?",["Hígado y riñones","Pulmones y esófago","Cerebelo y vejiga","Corazón e intestino grueso únicamente"],"Hígado y riñones","L3Q26"],["Un tumor comprime un nervio motor que activa el diafragma. ¿Qué efecto puede producir si la compresión es grave?",["Dificultad para generar movimientos respiratorios eficaces","Interrupción de la digestión de almidón en la boca","Incapacidad de coagular por falta de plaquetas","Imposibilidad de filtrar sangre en los capilares intestinales"],"Dificultad para generar movimientos respiratorios eficaces","L3Q27"],["Un estudiante afirma: «La sangre oxigenada siempre circula por arterias». ¿Cuál es la corrección más precisa?",["La arteria pulmonar lleva sangre con poco oxígeno hacia los pulmones","Todas las arterias llevan sangre con poco oxígeno","Las venas pulmonares llevan sangre con poco oxígeno al corazón","La sangre no cambia su contenido de oxígeno"],"La arteria pulmonar lleva sangre con poco oxígeno hacia los pulmones","L3Q28"],["Una persona tiene daño en el esfínter que controla la salida de la vejiga. ¿Qué función puede alterarse directamente?",["La continencia y el control de la micción","La absorción de aminoácidos","La producción de impulsos sensitivos en la retina","El intercambio de gases en los capilares pulmonares"],"La continencia y el control de la micción","L3Q29"],["Durante un ejercicio prolongado, un músculo consume 250 mL de oxígeno por minuto. ¿Cuánto oxígeno consume en 8 minutos si la tasa permanece constante?",["2000 mL","1250 mL","258 mL","32 mL"],"2000 mL","L3Q30"]]];
const KEY='biology_sistemas_cuerpo_progress_v5';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
