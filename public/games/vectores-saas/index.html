<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vectores — Matemáticas</title><style>
:root{--bg:#07111f;--card:#102238;--line:#24425f;--text:#e6f0fa;--muted:#a7bfd4;--accent:#34d399;--gold:#fbbf24;--bad:#f87171}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#123b45,#07111f 55%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}header{padding:24px 16px;text-align:center;border-bottom:1px solid var(--line)}header h1{margin:0;color:#6ee7b7;font-size:1.6rem}header p{color:var(--muted);margin:8px 0 0}main{max-width:760px;margin:0 auto;padding:18px 16px 48px}.card{background:rgba(16,34,56,.95);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 12px 30px #0003}label{display:block;color:#cde1ef;font-weight:700;font-size:.9rem;margin:10px 0 5px}input{width:100%;padding:12px;border:2px solid #42627c;border-radius:10px;background:#f8fafc;color:#0f172a;font-size:1rem}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;font-size:.95rem}.primary{background:#059669;color:white;width:100%;margin-top:14px}.choice{display:block;width:100%;text-align:left;background:#173452;color:var(--text);border:2px solid #315878;margin:9px 0}.choice:hover{border-color:var(--accent)}.choice.correct{background:#14532d;border-color:#4ade80}.choice.wrong{background:#5b1d28;border-color:#f87171}.hidden{display:none}.muted{color:var(--muted);line-height:1.5}.progress{height:10px;background:#183047;border-radius:99px;overflow:hidden;margin:12px 0 18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#fbbf24);width:0;transition:.25s}.score{color:#fbbf24;font-weight:800}.feedback-good{color:#86efac;font-weight:800;font-size:1.05rem;line-height:1.6}.feedback-encourage{color:#fcd34d;font-weight:700;font-size:1.02rem;line-height:1.6}.result{text-align:center;font-size:1.2rem}.certificate{border:2px solid var(--gold);padding:18px;border-radius:14px;margin-top:14px;background:#302511}a{color:#6ee7b7}
</style></head><body><header><h1>Vectores</h1><p>Juego de Química · Aprende resolviendo retos</p></header><main><section id="setup" class="card"><h2>Identificación</h2><p class="muted">Escribe tu nombre y sección para guardar tu progreso en este juego.</p><label>Tu sección</label><input id="section" placeholder="Ejemplo: A" autocomplete="organization-section"><label>Tu nombre</label><input id="name" placeholder="Nombre y apellido" autocomplete="name"><button class="primary" id="start">Comenzar reto</button></section><section id="game" class="card hidden"><div><span>Nivel <b id="level">1</b> · Pregunta <b id="num">1</b>/5</span> · <span class="score">Aciertos: <b id="score">0</b> · Puntos: <b id="points">0</b> · Vidas: <b id="lives">3</b></span></div><div class="progress"><i id="bar"></i></div><h2 id="question"></h2><div id="choices"></div><p id="feedback" class="muted"></p><button class="primary hidden" id="next">Siguiente</button></section><section id="result" class="card hidden"></section></main><script>
const LEVEL_BANKS=[[["¿Cuál es el módulo del vector (3, 4)?",["5","7","1","25"],"5","L1Q01"],["¿Cuál es la componente x del vector (-2, 7)?",["-2","7","2","-7"],"-2","L1Q02"],["Un vector tiene módulo 10 y dirección 0° desde el eje x positivo. ¿Cuáles son sus componentes?",["(10, 0)","(0, 10)","(-10, 0)","(10, 10)"],"(10, 0)","L1Q03"],["¿Cuál es la dirección del vector (0, -5), medida en sentido antihorario desde el eje x positivo?",["270°","90°","180°","0°"],"270°","L1Q04"],["¿Cuál es el vector unitario en la dirección de (6, 8)?",["(3/5, 4/5)","(6/5, 8/5)","(4/5, 3/5)","(3/4, 1)"],"(3/5, 4/5)","L1Q05"],["Si a > 0 y el vector (a, 0) tiene módulo 7, ¿cuánto vale a?",["7","-7","49","0"],"7","L1Q06"],["Calcula (2, 1) + (3, -4).",["(5, -3)","(1, 5)","(5, 3)","(-1, -3)"],"(5, -3)","L1Q07"],["Calcula (5, 2) - (1, 7).",["(4, -5)","(6, 9)","(4, 5)","(-4, 5)"],"(4, -5)","L1Q08"],["¿Cuánto es 3(1, -2)?",["(3, -6)","(3, -2)","(1, -6)","(-3, 6)"],"(3, -6)","L1Q09"],["Calcula el producto escalar (2, 3) · (4, -1).",["5","11","-5","8"],"5","L1Q10"],["¿Cuál de estos pares de vectores es perpendicular?",["(1, 2) y (2, -1)","(1, 2) y (2, 1)","(3, 1) y (1, 3)","(2, 2) y (1, 1)"],"(1, 2) y (2, -1)","L1Q11"],["¿Qué ángulo forman los vectores (1, 0) y (0, 1)?",["90°","0°","45°","180°"],"90°","L1Q12"],["¿Cuál es el vector desplazamiento desde A = (2, -1) hasta B = (7, 3)?",["(5, 4)","(9, 2)","(-5, -4)","(5, -4)"],"(5, 4)","L1Q13"],["Un vector tiene módulo 8 y dirección 90°. ¿Cuáles son sus componentes?",["(0, 8)","(8, 0)","(0, -8)","(-8, 0)"],"(0, 8)","L1Q14"],["¿Cuál es el vector opuesto a (-3, 5)?",["(3, -5)","(-3, -5)","(3, 5)","(5, -3)"],"(3, -5)","L1Q15"],["¿Cuál es el módulo de (-5, 12)?",["13","17","7","169"],"13","L1Q16"],["¿Qué valor tiene el producto escalar (4, -3) · (1, 0)?",["4","-3","1","7"],"4","L1Q17"],["¿Qué relación existe entre (3, 4) y (4, -3)?",["Son perpendiculares","Son paralelos en el mismo sentido","Son paralelos en sentidos opuestos","Forman un ángulo de 45°"],"Son perpendiculares","L1Q18"],["¿Cuál es la componente y del vector (2, -3)?",["-3","2","3","-2"],"-3","L1Q19"],["¿Cuál es el módulo del vector (0, -6)?",["6","-6","0","36"],"6","L1Q20"],["Calcula (-1, 4) + (3, 2).",["(2, 6)","(2, 2)","(-4, 6)","(4, 2)"],"(2, 6)","L1Q21"],["Calcula (2, -3) - (-4, 1).",["(6, -4)","(-2, -2)","(6, -2)","(-6, 4)"],"(6, -4)","L1Q22"],["Calcula el producto escalar (1, -2) · (5, 3).",["-1","11","1","-11"],"-1","L1Q23"],["Dos vectores colineales son (4, 0) y (6, 0). ¿Cuál es el módulo de su suma?",["10","2","24","0"],"10","L1Q24"],["¿Cuál es la dirección del vector (-4, 0), medida desde el eje x positivo en sentido antihorario?",["180°","0°","90°","270°"],"180°","L1Q25"],["¿Cuáles son las componentes del vector unitario e_y?",["(0, 1)","(1, 0)","(0, -1)","(1, 1)"],"(0, 1)","L1Q26"],["¿Qué par de componentes corresponde al vector 2e_x - 3e_y?",["(2, -3)","(-3, 2)","(2, 3)","(-2, 3)"],"(2, -3)","L1Q27"],["¿Qué vector se obtiene al multiplicar (3, -2) por -1?",["(-3, 2)","(3, 2)","(-3, -2)","(2, -3)"],"(-3, 2)","L1Q28"],["Si dos vectores no nulos tienen producto escalar igual a cero, ¿qué se puede concluir en el plano?",["Son perpendiculares","Tienen el mismo sentido","Tienen el mismo módulo","Son necesariamente opuestos"],"Son perpendiculares","L1Q29"],["Si el vector v tiene módulo 4, ¿cuál es el módulo de 3v?",["12","7","4","64"],"12","L1Q30"]],[["Una excursionista camina 6 km hacia el este y 8 km hacia el norte. ¿Cuál es el módulo de su desplazamiento resultante?",["10 km","14 km","2 km","48 km"],"10 km","L2Q01"],["Una lancha tiene velocidad respecto al agua (4, 1) m/s y la corriente aporta (−1, 2) m/s. ¿Cuál es su velocidad respecto a la orilla?",["(3, 3) m/s","(5, -1) m/s","(-5, 1) m/s","(3, -3) m/s"],"(3, 3) m/s","L2Q02"],["Un dron se desplaza desde P = (−2, 5) hasta Q = (4, 1), en metros. ¿Cuál es su vector desplazamiento?",["(6, -4) m","(2, 6) m","(-6, 4) m","(6, 4) m"],"(6, -4) m","L2Q03"],["Una fuerza constante F = (12, 5) N desplaza una caja según d = (3, 4) m. ¿Qué trabajo realiza la fuerza?",["56 J","47 J","20 J","60 J"],"56 J","L2Q04"],["Una fuerza de 15 N actúa perpendicularmente al desplazamiento de un objeto. ¿Qué trabajo realiza esa fuerza?",["0 J","15 J","−15 J","225 J"],"0 J","L2Q05"],["Dos cuerdas ejercen sobre un objeto las fuerzas (7, 2) N y (−3, 5) N. ¿Cuál es la fuerza resultante?",["(4, 7) N","(10, -3) N","(-10, 3) N","(4, -7) N"],"(4, 7) N","L2Q06"],["Un avión vuela a 120 km/h hacia el este y 50 km/h hacia el norte. ¿Cuál es el módulo de su velocidad resultante?",["130 km/h","170 km/h","70 km/h","100 km/h"],"130 km/h","L2Q07"],["Una persona recorre 3 km al este, 4 km al sur y 1 km al oeste. ¿Cuál es su desplazamiento neto?",["(2, -4) km","(4, -2) km","(2, 4) km","(8, 0) km"],"(2, -4) km","L2Q08"],["Una fuerza de (8, 0) N desplaza una caja 5 m en la dirección (1, 0). ¿Qué trabajo realiza?",["40 J","13 J","8 J","0 J"],"40 J","L2Q09"],["En un mapa, 1 cm representa 2 km. Un desplazamiento dibujado mide 3 cm hacia el oeste. ¿Cuál es el vector desplazamiento real si el este es el sentido x positivo?",["(-6, 0) km","(6, 0) km","(0, -6) km","(-3, 0) km"],"(-6, 0) km","L2Q10"],["Dos personas tiran de un trineo con fuerzas (10, 0) N y (0, 6) N. ¿Cuál es el módulo de la fuerza resultante?",["√136 N","16 N","4 N","60 N"],"√136 N","L2Q11"],["Una corriente lleva un barco con velocidad (2, 3) m/s durante 4 s. ¿Qué desplazamiento produce?",["(8, 12) m","(6, 7) m","(2, 12) m","(8, 3) m"],"(8, 12) m","L2Q12"],["Una caja se mueve 9 m hacia la derecha mientras una fuerza de 4 N actúa hacia la izquierda. ¿Cuál es el trabajo de esa fuerza?",["−36 J","36 J","13 J","−5 J"],"−36 J","L2Q13"],["Un robot avanza 5 m al norte y luego 12 m al este. ¿Qué distancia en línea recta hay entre su punto inicial y final?",["13 m","17 m","7 m","60 m"],"13 m","L2Q14"],["Una señal de navegación indica que un vehículo debe avanzar 4 unidades al este y 3 al norte. ¿Qué vector unitario apunta en la dirección indicada?",["(4/5, 3/5)","(3/5, 4/5)","(4, 3)","(−4/5, 3/5)"],"(4/5, 3/5)","L2Q15"],["Un ascensor recibe dos fuerzas verticales: 500 N hacia arriba y 350 N hacia abajo. Si hacia arriba es positivo, ¿cuál es la fuerza neta?",["150 N","850 N","−150 N","0 N"],"150 N","L2Q16"],["Una persona empuja una carretilla con fuerza (6, 8) N. ¿Cuál es el módulo de esa fuerza?",["10 N","14 N","2 N","100 N"],"10 N","L2Q17"],["El viento sopla hacia el norte con velocidad (0, 5) m/s. Un ciclista avanza hacia el este a (12, 0) m/s. ¿Cuál es el módulo de su velocidad respecto al suelo si ambas velocidades se suman?",["13 m/s","17 m/s","7 m/s","60 m/s"],"13 m/s","L2Q18"],["Un objeto parte de A = (1, 2) m. Su desplazamiento es (−3, 4) m. ¿En qué punto termina?",["(-2, 6) m","(4, -2) m","(-3, 8) m","(2, 6) m"],"(-2, 6) m","L2Q19"],["Una fuerza de (3, 4) N realiza un trabajo de 30 J. Si el desplazamiento es (x, 0) m con x > 0, ¿cuánto vale x?",["10 m","6 m","7,5 m","30 m"],"10 m","L2Q20"],["Un barco mantiene una velocidad de (−2, 1) km/h durante 3 h. ¿Cuál es su desplazamiento?",["(-6, 3) km","(-2, 3) km","(6, -3) km","(-6, 1) km"],"(-6, 3) km","L2Q21"],["Dos fuerzas horizontales actúan sobre una puerta: 18 N hacia la derecha y 11 N hacia la izquierda. ¿Cuál es la magnitud y el sentido de la resultante?",["7 N hacia la derecha","29 N hacia la derecha","7 N hacia la izquierda","29 N hacia la izquierda"],"7 N hacia la derecha","L2Q22"],["Una escalera se representa por el vector (5, 12) m desde su base hasta la parte superior. ¿Qué altura alcanza la parte superior?",["12 m","5 m","13 m","17 m"],"12 m","L2Q23"],["Una persona aplica una fuerza de 20 N en la dirección del desplazamiento de 3 m. ¿Qué trabajo realiza?",["60 J","23 J","17 J","6,7 J"],"60 J","L2Q24"],["En un plano, un mensajero se desplaza desde (−1, 2) hasta (−1, −5). ¿Cuántas unidades y en qué sentido se desplazó?",["7 unidades hacia abajo","7 unidades hacia arriba","3 unidades hacia abajo","5 unidades hacia la izquierda"],"7 unidades hacia abajo","L2Q25"],["Un globo se mueve con velocidad (−3, 4) m/s. ¿Qué distancia recorre en línea recta en 2 s si mantiene esa velocidad?",["10 m","5 m","14 m","25 m"],"10 m","L2Q26"],["Una fuerza (2, 5) N actúa mientras un objeto se desplaza (4, −1) m. ¿Cuál es el trabajo realizado?",["3 J","13 J","−3 J","8 J"],"3 J","L2Q27"],["Un nadador apunta en la dirección (3, 4) y su rapidez es 10 m/s. ¿Cuál es su vector velocidad?",["(6, 8) m/s","(3, 4) m/s","(30, 40) m/s","(8, 6) m/s"],"(6, 8) m/s","L2Q28"],["Un dron recibe una orden de desplazamiento (−4, 0) m seguida de (0, 3) m. ¿Cuál es la distancia directa entre la posición inicial y la final?",["5 m","7 m","1 m","12 m"],"5 m","L2Q29"],["Una fuerza de módulo 10 N forma un ángulo de 60° con un desplazamiento de 4 m. ¿Qué trabajo realiza?",["20 J","40 J","10 J","0 J"],"20 J","L2Q30"]],[["Los vectores u = (a, 2) y v = (3, −1) son perpendiculares. ¿Cuánto vale a?",["2/3","−2/3","3/2","−3/2"],"2/3","L3Q01"],["Un vector no nulo v satisface v · (2, 1) = 0. ¿Cuál podría ser v?",["(1, -2)","(2, 1)","(-2, -1)","(1, 2)"],"(1, -2)","L3Q02"],["Se sabe que |u| = 5, |v| = 3 y u · v = 0. ¿Cuál es |u + v|?",["√34","8","2","34"],"√34","L3Q03"],["Para los vectores u = (2, 1) y v = (1, 3), ¿cuál es el valor de |u + v|² − |u|² − |v|²?",["14","7","0","28"],"14","L3Q04"],["Un vector tiene módulo 10 y componente x igual a 6. Si su componente y es positiva, ¿cuál es el vector?",["(6, 8)","(6, -8)","(6, 4)","(10, 6)"],"(6, 8)","L3Q05"],["¿Qué relación entre dos vectores no nulos garantiza que el módulo de su suma sea igual a la suma de sus módulos?",["Tienen la misma dirección y el mismo sentido","Son perpendiculares","Tienen sentidos opuestos","Tienen el mismo módulo y direcciones perpendiculares"],"Tienen la misma dirección y el mismo sentido","L3Q06"],["Si u + v = (5, 2) y u = (1, −3), ¿cuál es v?",["(4, 5)","(6, -1)","(4, -5)","(-4, 5)"],"(4, 5)","L3Q07"],["Si 2u − v = (1, 4), u = (3, 2) y v = (a, b), ¿qué vector es v?",["(5, 0)","(5, 8)","(7, 0)","(-5, 0)"],"(5, 0)","L3Q08"],["Dos vectores no nulos tienen el mismo módulo y su suma es el vector cero. ¿Qué afirmación es necesariamente cierta?",["Son opuestos","Son perpendiculares","Tienen igual dirección y sentido","Su producto escalar es cero"],"Son opuestos","L3Q09"],["Un vector u tiene módulo 5 y u · (3, 4) = 25. ¿Cuál es u?",["(3, 4)","(4, 3)","(-3, -4)","(0, 5)"],"(3, 4)","L3Q10"],["Si |u| = 4, |v| = 5 y u · v = 20, ¿qué se deduce sobre el ángulo entre u y v?",["Es 0°","Es 90°","Es 180°","Es 60°"],"Es 0°","L3Q11"],["Si u = (2, −1) y v = (k, 4) son perpendiculares, ¿cuánto vale k?",["2","−2","8","−8"],"2","L3Q12"],["Un vector w tiene módulo 13 y componente x igual a −5. Si su componente y es positiva, ¿cuáles son sus componentes?",["(-5, 12)","(-5, -12)","(5, 12)","(-5, 8)"],"(-5, 12)","L3Q13"],["Si u + v = (0, 0), u no es nulo y |u| = 7, ¿cuál es |v|?",["7","0","14","−7"],"7","L3Q14"],["El vector a = (x, 2) tiene módulo √13. ¿Qué valores puede tomar x?",["3 o −3","3 solamente","2 o −2","13 o −13"],"3 o −3","L3Q15"],["Sean u = (1, 2) y v = (3, −1). ¿Cuál es el ángulo entre ellos, redondeado al grado más cercano?",["81°","9°","45°","90°"],"81°","L3Q16"],["Si u y v son vectores no nulos paralelos y u · v < 0, ¿cómo se orientan?",["En sentidos opuestos","En el mismo sentido","Forman 90°","No tienen una relación de dirección definida"],"En sentidos opuestos","L3Q17"],["La suma de dos vectores es (4, 1). Uno de ellos es (−2, 3). ¿Cuál es el otro?",["(6, -2)","(2, 4)","(-6, 2)","(6, 4)"],"(6, -2)","L3Q18"],["Un vector v tiene módulo 5 y dirección 30° desde el eje x positivo. ¿Cuáles son sus componentes exactas?",["(5√3/2, 5/2)","(5/2, 5√3/2)","(5√3/2, -5/2)","(5, 5)"],"(5√3/2, 5/2)","L3Q19"],["Si u · v = −12, |u| = 4 y |v| = 6, ¿cuál es el coseno del ángulo entre ellos?",["−1/2","1/2","−2","1"],"−1/2","L3Q20"],["Un objeto recibe desplazamientos u = (3, 4) y v, y termina en su punto de partida. ¿Qué debe ser v?",["(-3, -4)","(3, -4)","(-3, 4)","(4, 3)"],"(-3, -4)","L3Q21"],["Los vectores a = (2, k) y b = (4, 6) son paralelos. ¿Cuál es k?",["3","−3","12","6"],"3","L3Q22"],["Una fuerza F = (a, 2) N es perpendicular a un desplazamiento d = (3, −6) m. ¿Qué valor debe tener a?",["4","−4","9","−9"],"4","L3Q23"],["Si |u + v| = |u − v|, ¿qué condición cumple necesariamente el producto escalar?",["u · v = 0","u · v = |u||v|","u = v","|u| = |v|"],"u · v = 0","L3Q24"],["Un vector v forma 150° con el eje x positivo y tiene módulo 4. ¿Cuál es su componente x?",["−2√3","2√3","−2","2"],"−2√3","L3Q25"],["Si u = (2, 3), ¿para qué valor de k se cumple |ku| = 10?",["2","−2","5","−5"],"2","L3Q26"],["Dos vectores u y v tienen módulos 3 y 4, y el módulo de su suma es 5. ¿Cuál es el ángulo entre ellos?",["90°","0°","60°","180°"],"90°","L3Q27"],["Si a = (1, 2) y b = (3, 1), ¿cuál es el vector proyección de a sobre b?",["(9/10, 3/10)","(3/10, 9/10)","(1, 1)","(9/5, 3/5)"],"(9/10, 3/10)","L3Q28"],["Dos vectores u y v tienen módulos iguales y son perpendiculares. ¿Cuál es el ángulo entre u + v y u − v?",["90°","0°","45°","180°"],"90°","L3Q29"],["Un vector u = (x, 4) tiene módulo 5. Si su dirección está en el primer cuadrante, ¿cuál es su dirección aproximada desde el eje x positivo?",["53°","37°","127°","233°"],"53°","L3Q30"]]];
const KEY='math_vectores_progress_v1';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
