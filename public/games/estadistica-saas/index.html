(async function(){
  const code=(localStorage.getItem('saas_classCode')||'').trim().toUpperCase();
  const name=(localStorage.getItem('saas_studentName')||'').trim();
  const fail=function(){ ['saas_access_ok','saas_classCode','saas_studentName','saas_subjects','saas_student_token'].forEach(k=>localStorage.removeItem(k)); location.replace('/catalogo.html?access=expired'); };
  if(!code||!name) return fail();
  try{
    const r=await fetch('/api/access/check?classCode='+encodeURIComponent(code),{cache:'no-store',headers:{Authorization:'Bearer '+(localStorage.getItem('saas_student_token')||'')}});
    const d=await r.json();
    if(!d.allowed || (Array.isArray(d.subjects)&&d.subjects.length&&!d.subjects.includes('matematicas'))) return fail();
    localStorage.setItem('saas_access_ok','1');
    localStorage.setItem('saas_student_token',d.accessToken||localStorage.getItem('saas_student_token')||'');
    localStorage.setItem('saas_subjects',JSON.stringify(d.subjects||[]));
  }catch(e){ return fail(); }
})();

nco datos tienen mediana 12. Cuatro de ellos son 5, 9, 15 y 20. ¿Qué valor podría ser el quinto dato para que la mediana sea 12?",["8","11","14","18"],"11","L3Q02"],["En una lista ordenada de nueve datos, la mediana es 24. Se agrega un décimo dato, menor que todos los anteriores. ¿Qué posición de la lista nueva determina la mediana?",["El quinto dato","El promedio del quinto y sexto dato","El sexto dato","El promedio del cuarto y quinto dato"],"El promedio del quinto y sexto dato","L3Q03"],["Un grupo de seis puntuaciones tiene media 10. Al añadir una séptima puntuación, la media pasa a 11. ¿Cuál fue la puntuación añadida?",["11","15","17","21"],"17","L3Q04"],["En un conjunto de cinco valores, la moda única es 7. ¿Cuál conjunto cumple esa condición?",["2, 4, 7, 7, 9","2, 4, 7, 9, 9","2, 4, 6, 8, 10","3, 3, 5, 5, 8"],"2, 4, 7, 7, 9","L3Q05"],["El conjunto A es 4, 5, 6, 7, 8 y el conjunto B es 2, 5, 6, 7, 10. ¿Qué afirmación compara correctamente sus rangos y medias?",["A tiene mayor rango y mayor media","B tiene mayor rango y ambos tienen la misma media","A y B tienen el mismo rango, pero distinta media","B tiene menor rango y la misma media"],"B tiene mayor rango y ambos tienen la misma media","L3Q06"],["Un gráfico de barras muestra la cantidad de lluvia en tres meses: abril 40 mm, mayo 70 mm y junio 50 mm. ¿Qué porcentaje del total de estos tres meses corresponde a mayo?",["35 %","40 %","43,75 %","50 %"],"43,75 %","L3Q07"],["En una encuesta, 120 de 200 personas prefieren el producto A. Si la misma proporción se mantiene en una población de 1 500 personas, ¿cuántas preferirían A aproximadamente?",["720","800","900","1 200"],"900","L3Q08"],["Una urna contiene 3 bolas rojas, 2 verdes y 1 azul. Se extraen dos bolas sin reemplazo. ¿Cuál es la probabilidad de que la primera sea roja y la segunda verde?",["1/6","1/5","2/15","1/3"],"2/15","L3Q09"],["Se lanzan dos dados comunes. ¿Cuál es la probabilidad de que la suma sea 7?",["1/12","1/6","5/18","1/2"],"1/6","L3Q10"],["Una ruleta tiene sectores iguales numerados del 1 al 8. Se gana si sale un número primo. ¿Cuál es la probabilidad de ganar?",["1/4","3/8","1/2","5/8"],"1/2","L3Q11"],["La media de cuatro números es 9 y tres de ellos son 7, 8 y 12. ¿Cuál es el cuarto número?",["7","8","9","11"],"9","L3Q12"],["Las medias de dos grupos de igual tamaño son 72 y 84. Si se combinan ambos grupos, ¿cuál es la media general?",["72","78","80","84"],"78","L3Q13"],["El equipo A tiene valores 10, 10, 10, 10, 30 y el equipo B tiene 14, 14, 14, 14, 14. ¿Qué comparación es correcta?",["A tiene mayor media y menor rango que B","Ambos tienen media 14, pero A presenta mayor dispersión","Ambos tienen media 14 y el mismo rango","B tiene mayor media y mayor dispersión"],"Ambos tienen media 14, pero A presenta mayor dispersión","L3Q14"],["Un gráfico de líneas muestra las ventas: lunes 20, martes 25, miércoles 22 y jueves 31. ¿Entre qué días ocurrió el mayor aumento?",["De lunes a martes","De martes a miércoles","De miércoles a jueves","De lunes a jueves"],"De miércoles a jueves","L3Q15"],["En un gráfico circular de 240 respuestas, el sector de una categoría mide 90°. ¿Cuántas respuestas corresponden a esa categoría?",["45","60","75","90"],"60","L3Q16"],["Una bolsa tiene 4 fichas blancas y 6 negras. Se extrae una ficha al azar y se sabe que no es blanca. ¿Cuál es la probabilidad de que sea negra?",["2/5","3/5","4/6","1"],"1","L3Q17"],["Una familia elige al azar una de 3 películas y luego al azar uno de 4 postres. Si todas las combinaciones son igualmente posibles, ¿cuántos pares película-postre hay?",["7","12","16","24"],"12","L3Q18"],["Un gráfico de barras compara cuatro clases con cantidades 18, 24, 30 y 36. ¿Qué fracción de la cantidad total corresponde a la clase con 24?",["1/4","2/9","1/3","4/9"],"2/9","L3Q19"],["La media de seis valores es 15. Se descubre que un valor se registró como 8 cuando debía ser 20. ¿Cuál es la media corregida?",["16","17","18","20"],"17","L3Q20"],["En una bolsa hay fichas numeradas del 1 al 10. Se saca una ficha al azar. ¿Cuál es la probabilidad de que el número sea divisible por 2 o por 3?",["1/2","3/5","7/10","4/5"],"7/10","L3Q21"],["Una prueba consta de dos preguntas de verdadero o falso. Si se responde al azar, ¿cuál es la probabilidad de acertar las dos?",["1/2","1/3","1/4","3/4"],"1/4","L3Q22"],["En un conjunto de datos, la media es 20. Se suma 5 a cada dato. ¿Cuál es la nueva media?",["20","22,5","25","100"],"25","L3Q23"],["Se multiplica cada dato de un conjunto por 3. Si la mediana original era 8, ¿cuál será la nueva mediana?",["8","11","24","27"],"24","L3Q24"],["En un registro de 40 días, llovió 14 días. Si esta frecuencia se usa para estimar la probabilidad de lluvia en un día futuro, ¿cuál es la estimación?",["7/20","13/20","14/26","2/5"],"7/20","L3Q25"],["Una tabla de frecuencias registra tiempos de viaje: 10 min (3 personas), 20 min (5 personas), 30 min (4 personas). ¿Cuál es el tiempo medio de viaje?",["20 min","21 min y 2/3 min","22 min","25 min"],"21 min y 2/3 min","L3Q26"],["En un histograma, las frecuencias de cuatro intervalos consecutivos son 5, 11, 8 y 6. ¿Qué intervalo contiene la mediana de los datos?",["El primer intervalo","El segundo intervalo","El tercer intervalo","El cuarto intervalo"],"El segundo intervalo","L3Q27"],["Una ruleta tiene 12 sectores iguales, de los cuales 5 son rojos y el resto azules. ¿Cuántos sectores azules habría que añadir para que la probabilidad de azul fuera 3/4?",["4","6","8","12"],"6","L3Q28"],["Un conjunto de cinco enteros positivos tiene media 6 y mediana 6. Cuatro valores son 2, 5, 7 y 9. ¿Cuál es el quinto valor?",["5","6","7","8"],"7","L3Q29"],["Se lanza un dado común dos veces. ¿Cuál es la probabilidad de obtener al menos un 6?",["1/6","11/36","1/3","5/12"],"11/36","L3Q30"]]];
const KEY='math_estadistica_progress_v1';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
