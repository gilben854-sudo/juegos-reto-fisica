<script id="SAAS_ACCESS_GUARD_V1">
/* El código del profesor es obligatorio y se revalida contra la licencia en cada apertura. */
(async function(){
  const code=(localStorage.getItem('saas_classCode')||'').trim().toUpperCase();
  const name=(localStorage.getItem('saas_studentName')||'').trim();
  const fail=function(){ ['saas_access_ok','saas_classCode','saas_studentName','saas_subjects','saas_student_token'].forEach(k=>localStorage.removeItem(k)); location.replace('/catalogo.html?access=expired'); };
  if(!code||!name) return fail();
  try{
    const r=await fetch('/api/access/check?classCode='+encodeURIComponent(code),{cache:'no-store',headers:{Authorization:'Bearer '+(localStorage.getItem('saas_student_token')||'')}});
    const d=await r.json();
    if(!d.allowed || (Array.isArray(d.subjects)&&d.subjects.length&&!d.subjects.includes('matematicas'))) return fail();
    localStorage.setItem('saas_access_ok','1');
    localStorage.setItem('saas_student_token',d.accessToken||localStorage.getItem('saas_student_token')||'');
    localStorage.setItem('saas_subjects',JSON.stringify(d.subjects||[]));
  }catch(e){ return fail(); }
})();

","2/7","5/21","11/21"],"10/21","L3Q04"],["Una biblioteca tiene 240 libros. 3/8 son novelas y 1/5 de los libros restantes son biografías. ¿Cuántos libros no son ni novelas ni biografías?",["108","120","132","150"],"132","L3Q05"],["Una cuerda de 8 1/2 m se corta en dos piezas; una mide 3 3/4 m. La pieza restante se divide en tramos de 1/4 m. ¿Cuántos tramos se obtienen?",["17","18","19","20"],"19","L3Q06"],["Una receta para 6 personas requiere 3/4 kg de arroz. ¿Cuánto arroz se necesita para 10 personas?",["1 kg","1 1/8 kg","1 1/4 kg","1 1/2 kg"],"1 1/4 kg","L3Q07"],["En una carrera, Elena completó 5/8 de la distancia y Marcos 7/12. ¿Qué fracción de la distancia recorrió Elena más que Marcos?",["1/24","1/12","1/8","1/6"],"1/24","L3Q08"],["Un recipiente contiene 4 1/2 litros. Se sirve 2/3 del contenido y luego se devuelve 1/4 de litro. ¿Cuánto líquido queda?",["1 1/4 litros","1 3/4 litros","2 litros","2 1/4 litros"],"1 3/4 litros","L3Q09"],["Un estudiante resolvió 2/5 de una prueba por la mañana y 1/3 de lo que quedaba por la tarde. ¿Qué fracción de la prueba le falta resolver?",["2/5","3/5","1/3","4/15"],"2/5","L3Q10"],["Un campo rectangular tiene 3/4 km de largo y 2/5 km de ancho. ¿Cuál es su área?",["3/10 km²","5/9 km²","6/9 km²","1/2 km²"],"3/10 km²","L3Q11"],["Un saco de 5 1/4 kg de harina se reparte en partes iguales entre 7 panaderías. ¿Cuántos kilogramos recibe cada una?",["3/4 kg","7/8 kg","1 kg","1 1/4 kg"],"3/4 kg","L3Q12"],["Una persona gastó 2/5 de su dinero en comida y 1/4 del total en transporte. Si le quedan 42 dólares, ¿cuánto dinero tenía al principio?",["100 dólares","110 dólares","120 dólares","140 dólares"],"120 dólares","L3Q13"],["Una cisterna se llena hasta 2/3 de su capacidad. Se extrae 1/4 de lo que contiene y luego se agregan 1/6 de la capacidad total. ¿Qué fracción queda llena?",["2/3","1/2","5/6","3/4"],"2/3","L3Q14"],["Una pieza de tela mide 6 m. Se usa 1/3 para una cortina y 3/8 de lo que queda para una funda. ¿Cuántos metros quedan sin usar?",["2 1/4 m","2 1/2 m","2 3/4 m","3 m"],"2 1/2 m","L3Q15"],["En una encuesta, 2/5 de 150 personas prefieren té y 1/3 prefieren café. Las demás prefieren agua. ¿Cuántas prefieren agua?",["35","40","45","50"],"40","L3Q16"],["Un autobús cubre 3/10 de una ruta antes de una parada y 2/7 de la ruta total después. ¿Qué fracción de la ruta le falta por recorrer?",["19/70","21/70","29/70","41/70"],"29/70","L3Q17"],["Para llenar un recipiente se necesitan 5 jarras de 3/4 litro cada una. Si ya contiene 1 1/2 litros, ¿cuánto falta para llenarlo?",["2 1/4 litros","2 1/2 litros","3 1/4 litros","3 3/4 litros"],"2 1/4 litros","L3Q18"],["Una caja contiene canicas. 3/8 son azules; de las restantes, 2/5 son verdes. Si hay 30 canicas verdes, ¿cuántas canicas contiene la caja?",["64","72","80","96"],"80","L3Q19"],["Dos ciclistas parten del mismo punto en direcciones opuestas. Uno recorre 3 2/5 km y el otro 2 3/4 km. ¿Qué distancia los separa?",["6 3/20 km","6 1/20 km","5 3/20 km","6 1/4 km"],"6 3/20 km","L3Q20"],["Se tienen 2 1/4 litros de pintura. Cada pared necesita 3/8 de litro. ¿Cuántas paredes completas se pueden pintar y cuánta pintura sobra?",["5 paredes y 3/8 litro","6 paredes y nada","6 paredes y 1/8 litro","5 paredes y 1/4 litro"],"6 paredes y nada","L3Q21"],["Un agricultor cosechó 3/5 de una parcela el lunes. El martes cosechó 1/4 de lo que aún quedaba. ¿Qué fracción de la parcela falta cosechar?",["3/10","1/4","2/5","7/20"],"3/10","L3Q22"],["Un tanque contiene 7/8 de su capacidad. Tras extraer 3/10 de la capacidad total, el líquido restante se reparte por igual entre 5 recipientes. ¿Qué fracción de la capacidad del tanque recibe cada recipiente?",["23/200","1/10","3/20","7/40"],"23/200","L3Q23"],["Una caminata consta de tres tramos. El primero mide 2 1/3 km y el segundo 1 5/6 km. Si el recorrido total es 6 km, ¿cuánto mide el tercer tramo?",["1 5/6 km","2 km","2 1/6 km","2 1/3 km"],"1 5/6 km","L3Q24"],["En una clase, 1/6 de los estudiantes faltó. De los presentes, 2/5 participaron en una actividad. Si participaron 20 estudiantes, ¿cuántos estudiantes hay en la clase?",["30","36","40","45"],"36","L3Q25"],["Un recipiente tiene 3/4 de litro de agua. Se añade una cantidad igual a 2/3 de lo que ya tenía y luego se usa 1/2 litro. ¿Cuánto agua queda?",["3/4 litro","1/2 litro","1 litro","1 1/4 litros"],"3/4 litro","L3Q26"],["Un rectángulo tiene un área de 5/6 m² y un lado de 2/3 m. ¿Cuánto mide el otro lado?",["5/9 m","1 1/4 m","1 1/2 m","2 m"],"1 1/4 m","L3Q27"],["Una tienda recibió 120 kg de manzanas. Vendió 2/5 por la mañana y 1/3 de lo que quedaba por la tarde. ¿Cuántos kilogramos quedan?",["40 kg","44 kg","48 kg","56 kg"],"48 kg","L3Q28"],["Un pastel se comparte por igual entre 8 personas. Cada persona recibe 3/16 de pastel. ¿Cuántos pasteles enteros se repartieron?",["1","1 1/2","2","2 1/2"],"1 1/2","L3Q29"],["Un depósito está lleno hasta 5/6. Se vacía 1/3 de la cantidad que contiene. Después se agregan 1/4 de la capacidad total. ¿Qué fracción de la capacidad tiene al final?",["7/9","13/18","3/4","5/6"],"7/9","L3Q30"]]];
const KEY='math_fracciones_progress_v1';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
