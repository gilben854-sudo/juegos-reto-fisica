<!doctype html><html lang="es"><head>
<script id="SAAS_ACCESS_GUARD_V1">
/* El código del profesor es obligatorio y se revalida contra la licencia en cada apertura. */
(async function(){
  const code=(localStorage.getItem('saas_classCode')||'').trim().toUpperCase();
  const name=(localStorage.getItem('saas_studentName')||'').trim();
  const fail=function(){ ['saas_access_ok','saas_classCode','saas_studentName','saas_subjects'].forEach(k=>localStorage.removeItem(k)); location.replace('/catalogo.html?access=expired'); };
  if(!code||!name) return fail();
  try{
    const r=await fetch('/api/access/check?classCode='+encodeURIComponent(code),{cache:'no-store'});
    const d=await r.json();
    if(!d.allowed || (Array.isArray(d.subjects)&&d.subjects.length&&!d.subjects.includes('matematicas'))) return fail();
    localStorage.setItem('saas_access_ok','1');
    localStorage.setItem('saas_subjects',JSON.stringify(d.subjects||[]));
  }catch(e){ return fail(); }
})();
</script>

:root{--bg:#07111f;--card:#102238;--line:#24425f;--text:#e6f0fa;--muted:#a7bfd4;--accent:#34d399;--gold:#fbbf24;--bad:#f87171}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#123b45,#07111f 55%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}header{padding:24px 16px;text-align:center;border-bottom:1px solid var(--line)}header h1{margin:0;color:#6ee7b7;font-size:1.6rem}header p{color:var(--muted);margin:8px 0 0}main{max-width:760px;margin:0 auto;padding:18px 16px 48px}.card{background:rgba(16,34,56,.95);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 12px 30px #0003}label{display:block;color:#cde1ef;font-weight:700;font-size:.9rem;margin:10px 0 5px}input{width:100%;padding:12px;border:2px solid #42627c;border-radius:10px;background:#f8fafc;color:#0f172a;font-size:1rem}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;font-size:.95rem}.primary{background:#059669;color:white;width:100%;margin-top:14px}.choice{display:block;width:100%;text-align:left;background:#173452;color:var(--text);border:2px solid #315878;margin:9px 0}.choice:hover{border-color:var(--accent)}.choice.correct{background:#14532d;border-color:#4ade80}.choice.wrong{background:#5b1d28;border-color:#f87171}.hidden{display:none}.muted{color:var(--muted);line-height:1.5}.progress{height:10px;background:#183047;border-radius:99px;overflow:hidden;margin:12px 0 18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#fbbf24);width:0;transition:.25s}.score{color:#fbbf24;font-weight:800}.feedback-good{color:#86efac;font-weight:800;font-size:1.05rem;line-height:1.6}.feedback-encourage{color:#fcd34d;font-weight:700;font-size:1.02rem;line-height:1.6}.result{text-align:center;font-size:1.2rem}.certificate{border:2px solid var(--gold);padding:18px;border-radius:14px;margin-top:14px;background:#302511}a{color:#6ee7b7}
</style></head><body><header><h1>Ecuaciones</h1><p>Juego de Química · Aprende resolviendo retos</p></header><main><section id="setup" class="card"><h2>Identificación</h2><p class="muted">Escribe tu nombre y sección para guardar tu progreso en este juego.</p><label>Tu sección</label><input id="section" placeholder="Ejemplo: A" autocomplete="organization-section"><label>Tu nombre</label><input id="name" placeholder="Nombre y apellido" autocomplete="name"><button class="primary" id="start">Comenzar reto</button></section><section id="game" class="card hidden"><div><span>Nivel <b id="level">1</b> · Pregunta <b id="num">1</b>/5</span> · <span class="score">Aciertos: <b id="score">0</b> · Puntos: <b id="points">0</b> · Vidas: <b id="lives">3</b></span></div><div class="progress"><i id="bar"></i></div><h2 id="question"></h2><div id="choices"></div><p id="feedback" class="muted"></p><button class="primary hidden" id="next">Siguiente</button></section><section id="result" class="card hidden"></section></main><script>
const LEVEL_BANKS=[[["Resuelve la ecuación x + 7 = 19.",["10","11","12","13"],"12","L1Q01"],["Resuelve la ecuación x - 9 = 4.",["12","13","14","15"],"13","L1Q02"],["Resuelve la ecuación 5x = 35.",["5","6","7","8"],"7","L1Q03"],["Resuelve la ecuación x ÷ 4 = 6.",["20","22","24","28"],"24","L1Q04"],["Resuelve la ecuación 3x + 2 = 20.",["4","5","6","7"],"6","L1Q05"],["Resuelve la ecuación 4x - 7 = 61.",["16","17","18","19"],"17","L1Q06"],["Resuelve la ecuación 2x + 9 = x + 23.",["12","13","14","15"],"14","L1Q07"],["Resuelve la ecuación 5x - 3 = 2x + 12.",["4","5","6","7"],"5","L1Q08"],["Resuelve la ecuación 7 - 2x = -9.",["6","7","8","9"],"8","L1Q09"],["Resuelve la ecuación 3(x + 4) = 45.",["9","10","11","12"],"11","L1Q10"],["Resuelve la ecuación 2(x - 5) = 28.",["17","18","19","20"],"19","L1Q11"],["Resuelve la ecuación x ÷ 3 + 5 = 10.",["12","15","18","21"],"15","L1Q12"],["Resuelve la ecuación (x + 2) ÷ 5 = 4.",["16","17","18","19"],"18","L1Q13"],["Resuelve la ecuación 6 - x ÷ 2 = 1.",["8","9","10","11"],"10","L1Q14"],["Resuelve la ecuación 4x + 3 = 2x + 35.",["14","15","16","17"],"16","L1Q15"],["Resuelve la ecuación 9x = 3x + 120.",["18","19","20","21"],"20","L1Q16"],["Resuelve la ecuación 2x + 5 = 5x - 58.",["19","20","21","22"],"21","L1Q17"],["Resuelve la ecuación 5(x - 2) = 3x + 8.",["7","8","9","10"],"9","L1Q18"],["Resuelve la ecuación 4(x + 1) - 3 = 17.",["2","3","4","5"],"4","L1Q19"],["Resuelve la ecuación 3(2x - 1) = 4x + 41.",["20","21","22","23"],"22","L1Q20"],["Resuelve la ecuación 2(x + 3) + x = 75.",["21","22","23","24"],"23","L1Q21"],["Resuelve la ecuación 5x + 2 = 3x + 52.",["23","24","25","26"],"25","L1Q22"],["Resuelve la ecuación 8 - 3(x - 1) = 2.",["1","2","3","4"],"3","L1Q23"],["Resuelve la ecuación x ÷ 2 = 13.",["24","25","26","27"],"26","L1Q24"],["Resuelve la ecuación x ÷ 3 + x ÷ 6 = 13,5.",["24","25","27","30"],"27","L1Q25"],["Resuelve la ecuación 0,5x + 4 = 5.",["1","2","3","4"],"2","L1Q26"],["Resuelve la ecuación 1,2x = 1,2.",["0","1","2","3"],"1","L1Q27"],["¿Cuántas soluciones tiene la ecuación 2(x + 1) = 2x + 2?",["Ninguna solución","Una solución","Dos soluciones","Infinitas soluciones"],"Infinitas soluciones","L1Q28"],["¿Cuántas soluciones tiene la ecuación 3x + 4 = 3x - 2?",["Ninguna solución","Una solución","Dos soluciones","Infinitas soluciones"],"Ninguna solución","L1Q29"],["¿Cuál ecuación es equivalente a 3x + 6 = 18?",["x + 2 = 6","x + 6 = 18","3x + 2 = 6","3x = 24"],"x + 2 = 6","L1Q30"]],[["Cada cuaderno cuesta 3 euros. Si se gastan 24 euros en cuadernos iguales, ¿cuántos se compraron?",["6","7","8","9"],"8","L2Q01"],["Un plan telefónico cobra 12 euros fijos y 3 euros por cada gigabyte utilizado. Si la factura es de 30 euros, ¿cuántos gigabytes se usaron?",["5","6","7","8"],"6","L2Q02"],["Un rectángulo tiene un lado 5 cm más largo que el otro y su perímetro es 34 cm. ¿Cuánto mide el lado más corto?",["5 cm","6 cm","7 cm","8 cm"],"6 cm","L2Q03"],["Lucía tiene 15 euros ahorrados y guarda 8 euros cada semana. ¿Cuántas semanas necesita para tener 87 euros?",["7","8","9","10"],"9","L2Q04"],["Las entradas para un espectáculo cuestan 9 euros cada una. Si la recaudación por esas entradas es de 72 euros, ¿cuántas entradas se vendieron?",["6","7","8","9"],"8","L2Q05"],["El doble de un número disminuido en 6 es igual a 20. ¿Cuál es el número?",["11","12","13","14"],"13","L2Q06"],["Una madre tiene el triple de la edad de su hijo. Entre los dos suman 48 años. ¿Qué edad tiene el hijo?",["10 años","11 años","12 años","13 años"],"12 años","L2Q07"],["Después de aplicar un descuento del 20 %, una mochila cuesta 56 euros. ¿Cuál era su precio original?",["65 euros","68 euros","70 euros","72 euros"],"70 euros","L2Q08"],["A una temperatura inicial se le suman 7 grados y el termómetro marca 18 °C. ¿Cuál era la temperatura inicial?",["9 °C","10 °C","11 °C","12 °C"],"11 °C","L2Q09"],["El perímetro de una parcela cuadrada es 52 m. ¿Cuánto mide cada lado?",["11 m","12 m","13 m","14 m"],"13 m","L2Q10"],["Tres bolsas iguales pesan juntas 2 kg más que una caja de 26 kg. ¿Cuánto pesa cada bolsa?",["6 kg","7 kg","8 kg","9 kg"],"8 kg","L2Q11"],["De una cinta de 31 cm se cortan cuatro trozos iguales y sobran 3 cm. ¿Cuánto mide cada trozo?",["6 cm","7 cm","8 cm","9 cm"],"7 cm","L2Q12"],["En un autobús había cierta cantidad de pasajeros. Bajaron 12 y subieron 9; al final quedaron 31. ¿Cuántos pasajeros había al principio?",["32","33","34","35"],"34","L2Q13"],["Un depósito contiene inicialmente 10 litros de agua y se llena a razón de 5 litros por minuto. ¿Cuántos minutos tarda en llegar a 55 litros?",["8","9","10","11"],"9","L2Q14"],["El número de páginas de un libro es 6 más que el doble de las páginas que ya leyó Elena. Si el libro tiene 30 páginas, ¿cuántas páginas leyó?",["10","11","12","13"],"12","L2Q15"],["Dos números enteros consecutivos suman 41. ¿Cuál es el menor?",["19","20","21","22"],"20","L2Q16"],["Una receta requiere 0,4 tazas de harina por porción. ¿Cuántas porciones se pueden preparar con 2 tazas?",["4","5","6","8"],"5","L2Q17"],["Un trabajador cobra 14 euros por hora y recibe además una bonificación fija de 20 euros. Si cobró 104 euros en total, ¿cuántas horas trabajó?",["5","6","7","8"],"6","L2Q18"],["Un estacionamiento cobra 5 euros de tarifa fija y 1,5 euros por hora. Si una estancia costó 14 euros, ¿cuántas horas se estacionó el vehículo?",["5","6","7","8"],"6","L2Q19"],["Un triángulo isósceles tiene dos lados iguales y un tercer lado de 8 cm. Si el perímetro es 26 cm, ¿cuánto mide cada lado igual?",["8 cm","9 cm","10 cm","11 cm"],"9 cm","L2Q20"],["Una factura de electricidad incluye un cargo fijo de 8 euros y 0,20 euros por cada kilovatio-hora. Si el total es 38 euros, ¿cuántos kilovatios-hora se consumieron?",["140","150","160","170"],"150","L2Q21"],["Un sendero mide 42 km. Ya se recorrieron 6 km y luego se avanzan 3 km por cada vuelta completa. ¿Cuántas vueltas completas faltan?",["10","11","12","13"],"12","L2Q22"],["Tras un descuento del 15 %, un artículo cuesta 68 euros. ¿Cuál era su precio antes del descuento?",["76 euros","78 euros","80 euros","82 euros"],"80 euros","L2Q23"],["Una escuela compra 5 kits del mismo precio y paga además 10 euros de envío. Si el total es 85 euros, ¿cuánto cuesta cada kit?",["13 euros","14 euros","15 euros","16 euros"],"15 euros","L2Q24"],["Un tren viaja a una velocidad constante de 60 km por hora. ¿Cuánto tiempo necesita para recorrer 210 km?",["3 horas","3,5 horas","4 horas","4,5 horas"],"3,5 horas","L2Q25"],["La mitad de un número, más 9, es igual a 25. ¿Cuál es el número?",["28","30","32","34"],"32","L2Q26"],["Dos recipientes iguales contienen la misma cantidad de mililitros. Al añadir 250 ml al contenido conjunto, se obtienen 1.250 ml. ¿Cuántos mililitros había en cada recipiente?",["450 ml","500 ml","550 ml","600 ml"],"500 ml","L2Q27"],["En una clase hay 4 alumnas más que alumnos y hay 28 estudiantes en total. ¿Cuántos alumnos hay?",["10","11","12","13"],"12","L2Q28"],["Una batería empieza con 96 % de carga y pierde 8 puntos porcentuales por hora. ¿Cuántas horas pasan hasta que queda en 32 %?",["6 horas","7 horas","8 horas","9 horas"],"8 horas","L2Q29"],["Marta tiene el triple de estampillas que Luis y entre ambos tienen 84. ¿Cuántas estampillas más tiene Marta que Luis?",["36","40","42","48"],"42","L2Q30"]],[["Dos números impares consecutivos suman 84. ¿Cuál es el mayor?",["39","41","43","45"],"43","L3Q01"],["Tres números enteros consecutivos suman 96. ¿Cuál es el número del medio?",["30","31","32","33"],"32","L3Q02"],["Un rectángulo tiene un largo que mide 3 cm más que el doble de su ancho. Su perímetro es 54 cm. ¿Cuánto mide el ancho?",["7 cm","8 cm","9 cm","10 cm"],"8 cm","L3Q03"],["Una hija tiene actualmente x años y su padre tiene el triple. Dentro de 12 años, el padre tendrá el doble de la edad de la hija. ¿Qué edad tiene ahora la hija?",["10 años","11 años","12 años","13 años"],"12 años","L3Q04"],["Se agregan x litros de agua a 10 litros de una solución de concentración al 30 %. Si la mezcla resultante tiene una concentración del 20 %, ¿cuántos litros de agua se agregaron?",["4 litros","5 litros","6 litros","7 litros"],"5 litros","L3Q05"],["Tres números pares consecutivos suman 114. ¿Cuál es el mayor?",["36","38","40","42"],"40","L3Q06"],["Dos planes cobran, respectivamente, 20 euros más 2 euros por uso y 8 euros más 3,5 euros por uso. ¿Con cuántos usos cuestan lo mismo?",["6","7","8","9"],"8","L3Q07"],["El 40 % de un número, aumentado en 12, es igual a 32. ¿Cuál es el número?",["40","45","50","55"],"50","L3Q08"],["En una caja hay 18 monedas de 1 y 2 euros, con un valor total de 27 euros. ¿Cuántas monedas de 1 euro hay?",["7","8","9","10"],"9","L3Q09"],["Se reparten 360 euros entre tres personas: la segunda recibe el doble que la primera y la tercera recibe 30 euros más que la segunda. ¿Cuánto recibe la primera?",["60 euros","66 euros","72 euros","78 euros"],"66 euros","L3Q10"],["Un jardín rectangular está junto a un muro, por lo que solo se cercan tres lados. El largo mide el doble del ancho y se usan 40 m de cerca. ¿Cuánto mide el ancho?",["8 m","9 m","10 m","12 m"],"10 m","L3Q11"],["En un evento se vendieron 20 entradas de adulto a 12 euros y de niño a 7 euros. La recaudación fue de 190 euros. ¿Cuántas entradas de adulto se vendieron?",["8","9","10","11"],"10","L3Q12"],["Una lectora ya leyó 120 páginas y lee 18 páginas al día. ¿Cuántos días necesita para llegar a 300 páginas leídas?",["8","9","10","11"],"10","L3Q13"],["Un abuelo tiene ahora el triple de la edad de su nieto. Hace cinco años, tenía siete veces la edad que tenía entonces el nieto. ¿Qué edad tiene ahora el abuelo?",["18 años","21 años","24 años","27 años"],"21 años","L3Q14"],["La media de cuatro calificaciones es 82. Tres de ellas son 78, 84 y 80. ¿Cuál es la cuarta calificación?",["84","85","86","87"],"86","L3Q15"],["Una persona tiene 45 euros ahorrados y guarda 15 euros por semana. ¿Cuántas semanas necesita para alcanzar 180 euros?",["8","9","10","11"],"9","L3Q16"],["Una impresora ya produjo 120 páginas y continúa imprimiendo 24 páginas por minuto. ¿Cuántos minutos necesita para completar 600 páginas en total?",["18","19","20","21"],"20","L3Q17"],["Una embarcación navega a 12 km/h contra la corriente y a 18 km/h a favor de la corriente. Suponiendo que las velocidades se mantienen, ¿cuál es la velocidad de la corriente?",["2 km/h","3 km/h","4 km/h","5 km/h"],"3 km/h","L3Q18"],["Una máquina A produce 4 unidades más que el doble de lo que produce una máquina B. Juntas producen 40 unidades. ¿Cuántas produce la máquina B?",["10","11","12","13"],"12","L3Q19"],["Después de aplicar primero un descuento del 10 % y luego un cupón de 12 euros, un artículo cuesta 60 euros. ¿Cuál era su precio original?",["76 euros","78 euros","80 euros","82 euros"],"80 euros","L3Q20"],["Se agrupan los objetos en 5 grupos iguales de 9 objetos y quedan 7 objetos sueltos. ¿Cuántos objetos había en total?",["45","50","52","54"],"52","L3Q21"],["Cuatro hermanos se reparten 146 euros. El mayor recibe 8 euros más que cada uno de los otros tres, que reciben lo mismo entre sí. ¿Cuánto recibe cada hermano menor?",["32 euros","33 euros","34 euros","35 euros"],"34 euros","L3Q22"],["Una panadería vende por la mañana dos quintos de sus pasteles, vende otros 18 por la tarde y le quedan 12. ¿Cuántos pasteles tenía al principio?",["45","50","55","60"],"50","L3Q23"],["Dos ciclistas parten al mismo tiempo desde lugares separados por 90 km y avanzan uno hacia el otro a 12 km/h y 18 km/h. ¿Cuántas horas tardan en encontrarse?",["2 horas","2,5 horas","3 horas","3,5 horas"],"3 horas","L3Q24"],["Un tren sale de una estación a 60 km/h. Una hora después, otro tren sale de la misma estación en la misma dirección a 80 km/h. ¿Cuántas horas después de la salida del segundo tren alcanza al primero?",["2 horas","3 horas","4 horas","5 horas"],"3 horas","L3Q25"],["Un trapecio tiene lados de longitudes x, x + 2, 2x y 12 cm. Si su perímetro es 50 cm, ¿cuánto vale x?",["6,8 cm","7,2 cm","7,6 cm","8 cm"],"7,2 cm","L3Q26"],["Una biblioteca cobra 1,50 euros de cargo fijo más 0,25 euros por cada día de retraso. Si la multa es de 4,50 euros, ¿cuántos días hubo de retraso?",["10","11","12","13"],"12","L3Q27"],["La suma de dos números es 42 y el mayor es 3 menos que el doble del menor. ¿Cuál es el mayor?",["24","25","26","27"],"27","L3Q28"],["Un tanque pierde 7 litros por minuto. Después de 9 minutos contiene 23 litros. ¿Cuántos litros tenía al principio?",["79 litros","82 litros","86 litros","89 litros"],"86 litros","L3Q29"],["La ecuación 4(x - 2) = 4x + 3 representa una condición para un número. ¿Cuántos números la cumplen?",["Ninguno","Uno","Dos","Infinitos"],"Ninguno","L3Q30"]]];
const KEY='math_ecuaciones_progress_v1';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
