(async function(){

  const fail=function(){ ['saas_access_ok','saas_classCode','saas_studentName','saas_subjects','saas_student_token'].forEach(k=>localStorage.removeItem(k)); location.replace('/catalogo.html?access=expired'); };
  if(!code||!name) return fail();

    const r=await fetch('/api/access/check?classCode='+encodeURIComponent(code),{cache:'no-store',headers:{Authorization:'Bearer '+(localStorage.getItem('saas_student_token')||'')}});

    if(!d.allowed || (Array.isArray(d.subjects)&&d.subjects.length&&!d.subjects.includes('biologia'))) return fail();

  }catch(e){ return fail(); }
})();

iberación de energía a partir de la luz"],"El movimiento neto de agua a través de una membrana selectivamente permeable","L1Q30"]],[["Una célula animal se coloca en una solución más concentrada en solutos que su interior. ¿Qué cambio es más probable?",["Pierde agua y se encoge","Gana agua y se hincha","No intercambia agua en ninguna dirección","Produce una pared celular"],"Pierde agua y se encoge","L2Q01"],["Una célula vegetal se coloca en agua muy diluida respecto de su interior. ¿Qué resultado es más probable?",["Entra agua y aumenta la turgencia","Sale agua y la célula se plasmoliza","Se disuelve la pared celular","Se detiene toda difusión a través de la membrana"],"Entra agua y aumenta la turgencia","L2Q02"],["Una célula animal está en un medio isotónico. ¿Qué ocurre con el movimiento de agua a través de su membrana?",["Entra y sale agua a velocidades similares, sin flujo neto","Solo entra agua hasta que la célula estalla","Solo sale agua hasta que la célula se encoge","El agua deja de atravesar la membrana"],"Entra y sale agua a velocidades similares, sin flujo neto","L2Q03"],["Una molécula pequeña y no polar pasa directamente a través de la bicapa lipídica desde una zona de mayor concentración a otra de menor concentración. ¿Qué mecanismo la transporta?",["Difusión simple","Transporte activo","Endocitosis","Exocitosis"],"Difusión simple","L2Q04"],["La glucosa cruza una membrana a favor de su gradiente con ayuda de una proteína transportadora y sin gasto directo de ATP. ¿Qué proceso ocurre?",["Difusión facilitada","Transporte activo primario","Fagocitosis","Exocitosis"],"Difusión facilitada","L2Q05"],["Una célula incorpora iones minerales en contra de su gradiente de concentración. ¿Qué necesita para hacerlo?",["Energía y proteínas de transporte","Solo una bicapa lipídica","Una vesícula con clorofila","La ausencia de membrana"],"Energía y proteínas de transporte","L2Q06"],["Un glóbulo blanco rodea y engloba una bacteria grande. ¿Qué mecanismo celular está usando?",["Fagocitosis","Difusión simple","Ósmosis","Exocitosis"],"Fagocitosis","L2Q07"],["Una célula libera al exterior una sustancia empaquetada en vesículas que se fusionan con su membrana. ¿Qué proceso realiza?",["Exocitosis","Endocitosis","Difusión facilitada","Plasmólisis"],"Exocitosis","L2Q08"],["Una proteína que será secretada se sintetiza y luego se transporta hacia el aparato de Golgi. ¿Cuál es la ruta celular más probable?",["Ribosoma unido al retículo rugoso, vesícula y aparato de Golgi","Lisosoma, núcleo y cloroplasto","Retículo liso, mitocondria y nucléolo","Centrosoma, vacuola y pared celular"],"Ribosoma unido al retículo rugoso, vesícula y aparato de Golgi","L2Q09"],["Una célula del páncreas fabrica y secreta grandes cantidades de proteínas. ¿Qué característica esperarías encontrar en ella?",["Abundante retículo endoplasmático rugoso","Ausencia de ribosomas","Gran cantidad de pared celular","Ausencia de membrana plasmática"],"Abundante retículo endoplasmático rugoso","L2Q10"],["Una célula produce muchas hormonas esteroideas, que son lípidos. ¿Qué orgánulo probablemente está especialmente desarrollado?",["El retículo endoplasmático liso","El nucléolo","El lisosoma","El cloroplasto"],"El retículo endoplasmático liso","L2Q11"],["Una célula realiza trabajo mecánico intenso y requiere mucha energía. ¿Qué rasgo es razonable esperar?",["Numerosas mitocondrias","Ausencia de membrana plasmática","Un solo ribosoma","Pared celular de celulosa"],"Numerosas mitocondrias","L2Q12"],["Una célula de una hoja recibe luz y dispone de agua y dióxido de carbono. ¿Qué proceso puede realizar gracias a sus cloroplastos?",["Fotosíntesis","Fagocitosis","Fermentación láctica obligatoria","Síntesis de peptidoglucano"],"Fotosíntesis","L2Q13"],["Las células de una raíz subterránea normalmente no son verdes. ¿Cuál es la explicación más probable?",["Por lo general no desarrollan cloroplastos fotosintéticos como los de las hojas","Carecen de membrana plasmática","No contienen ADN","Son células procariotas"],"Por lo general no desarrollan cloroplastos fotosintéticos como los de las hojas","L2Q14"],["Una planta pierde agua y sus hojas se marchitan. ¿Qué cambio celular contribuye directamente a la pérdida de firmeza?",["Disminuye la presión de turgencia de las células","Aumenta la cantidad de celulosa en cada membrana","Los ribosomas se convierten en cloroplastos","El núcleo expulsa toda la pared celular"],"Disminuye la presión de turgencia de las células","L2Q15"],["Una célula vegetal se coloca en una solución muy concentrada y su membrana se separa parcialmente de la pared. ¿Cómo se llama este fenómeno?",["Plasmólisis","Turgencia","Citocinesis","Fecundación"],"Plasmólisis","L2Q16"],["Al observar una bacteria, ¿qué hallazgo permitiría reconocer su pared celular característica?",["La presencia de peptidoglucano","La presencia de celulosa","La presencia de quitina en todas las bacterias","La presencia de una envoltura nuclear"],"La presencia de peptidoglucano","L2Q17"],["Una célula debe introducir potasio aunque haya más potasio en su interior que fuera. ¿Por qué no basta la difusión simple?",["El movimiento ocurre contra el gradiente y requiere transporte activo","El potasio atraviesa siempre la membrana sin ayuda","La difusión simple solo transporta agua","El transporte activo solo ocurre en células vegetales"],"El movimiento ocurre contra el gradiente y requiere transporte activo","L2Q18"],["Una célula presenta canales de membrana que permiten el paso selectivo de ciertos iones. ¿Qué propiedad de la membrana ilustran?",["Permeabilidad selectiva","Producción de celulosa","Almacenamiento de ADN","Digestión intracelular"],"Permeabilidad selectiva","L2Q19"],["Se coloca una gota de colorante en un extremo de un recipiente con agua. Al cabo de un tiempo, el color se distribuye por todo el líquido. ¿Qué proceso explica principalmente el resultado?",["Difusión de las partículas de colorante","Transporte activo del agua","Fagocitosis del colorante","Síntesis de nuevas moléculas de colorante"],"Difusión de las partículas de colorante","L2Q20"],["Dos células con la misma forma cúbica tienen lados de 1 μm y 3 μm. ¿Cuál tiene una relación superficie-volumen mayor?",["La de 1 μm","La de 3 μm","Ambas tienen la misma relación","No se puede comparar sin conocer el tipo de tejido"],"La de 1 μm","L2Q21"],["En una imagen microscópica, una célula mide 40 mm y su tamaño real es 0,02 mm. ¿Cuál es el aumento?",["2×","200×","2 000×","20 000×"],"2 000×","L2Q22"],["Se observa una célula con núcleo y varios orgánulos rodeados por membrana. ¿A qué grupo pertenece?",["Eucariota","Procariota","Virus","Prion"],"Eucariota","L2Q23"],["Una célula tiene pared celular, cloroplastos y una gran vacuola central. ¿Cuál es la identificación más probable?",["Célula vegetal","Célula animal","Célula bacteriana","Partícula viral"],"Célula vegetal","L2Q24"],["Durante la división, una célula animal forma un surco que se profundiza entre las dos células hijas. ¿Qué proceso representa?",["La citocinesis por estrangulamiento de la membrana","La formación de una pared de celulosa","La replicación del ADN","La síntesis de clorofila"],"La citocinesis por estrangulamiento de la membrana","L2Q25"],["Si una célula pierde muchas de las fibras que sirven de vías para mover vesículas en su interior, ¿qué componente podría estar dañado?",["Los microtúbulos del citoesqueleto","La celulosa de la pared","La clorofila de los cloroplastos","El ADN de los ribosomas"],"Los microtúbulos del citoesqueleto","L2Q26"],["Una célula acumula restos de estructuras viejas porque no puede digerirlos eficazmente. ¿Qué orgánulo podría tener una función alterada?",["El lisosoma","El nucléolo","El cloroplasto","El centrosoma"],"El lisosoma","L2Q27"],["Una célula sigue sintetizando proteínas, pero las moléculas no se clasifican ni se empaquetan bien para su destino. ¿Qué orgánulo probablemente funciona mal?",["El aparato de Golgi","El peroxisoma","El nucléolo","La membrana nuclear"],"El aparato de Golgi","L2Q28"],["Los glóbulos rojos maduros de los mamíferos no tienen mitocondrias. ¿Cómo obtienen principalmente ATP?",["Mediante glucólisis en el citoplasma","Mediante fotosíntesis","Mediante respiración en cloroplastos","Mediante digestión en lisosomas"],"Mediante glucólisis en el citoplasma","L2Q29"],["Al comparar una célula animal con una vegetal, ¿qué estructura permite reconocer que la vegetal tiene una capa rígida externa adicional a la membrana?",["La pared celular","El retículo endoplasmático","El citoplasma","El núcleo"],"La pared celular","L2Q30"]],[["Una imagen de microscopio mide 36 mm y el aumento empleado es 600×. ¿Cuál es el tamaño real de la estructura observada?",["0,06 mm","0,6 mm","6 mm","21 600 mm"],"0,06 mm","L3Q01"],["En un campo de visión de 1,2 mm caben alineadas aproximadamente 12 células del mismo tamaño. ¿Cuál es el largo aproximado de cada célula?",["0,1 mm","1 mm","10 mm","14,4 mm"],"0,1 mm","L3Q02"],["Una célula vegetal tiene una masa de 100 mg. Tras estar en una solución, su masa sube a 110 mg. ¿Cuál fue el cambio porcentual de masa?",["Aumentó un 10 %","Aumentó un 1 %","Disminuyó un 10 %","Aumentó un 110 %"],"Aumentó un 10 %","L3Q03"],["Una sustancia que bloquea una enzima de la cadena respiratoria mitocondrial reduce mucho la producción de ATP. ¿En qué zona se encuentra esa cadena?",["En la membrana interna de la mitocondria","En la pared celular","En el nucléolo","En la membrana del aparato de Golgi"],"En la membrana interna de la mitocondria","L3Q04"],["Se mantiene una hoja en oscuridad durante suficiente tiempo para que consuma sus reservas de almidón. Luego se ilumina solo una parte de la hoja y se detecta almidón en esa región. ¿Qué conclusión está mejor respaldada?",["La luz permitió producir azúcares que se almacenaron como almidón","La oscuridad produjo almidón en la zona iluminada","El almidón se fabrica únicamente en las mitocondrias","La luz hizo que la pared celular se transformara en almidón"],"La luz permitió producir azúcares que se almacenaron como almidón","L3Q05"],["Se marca un aminoácido radiactivo y se sigue una proteína que será secretada. ¿En qué secuencia aparecerá normalmente la marca?",["Retículo rugoso, vesículas de transporte, aparato de Golgi y vesículas secretoras","Núcleo, cloroplasto, lisosoma y pared celular","Peroxisoma, nucléolo, mitocondria y centrosoma","Membrana plasmática, nucléolo, retículo liso y ribosoma"],"Retículo rugoso, vesículas de transporte, aparato de Golgi y vesículas secretoras","L3Q06"],["Una mutación inactiva una bomba de sodio-potasio de la membrana de una célula animal. ¿Qué consecuencia directa es más probable?",["Se altera el mantenimiento de los gradientes de sodio y potasio","Se impide la formación de celulosa en la pared","Se detiene la producción de clorofila","Se destruye inmediatamente el ADN nuclear"],"Se altera el mantenimiento de los gradientes de sodio y potasio","L3Q07"],["Una célula vegetal pierde agua en un medio salino y el contenido celular se retrae, pero la pared mantiene su forma. ¿Qué explica mejor esta observación?",["El agua salió por ósmosis y la pared resistió el cambio de forma externa","La sal entró al núcleo y convirtió la pared en membrana","El cloroplasto expulsó agua mediante fotosíntesis","La célula aumentó su turgencia al perder agua"],"El agua salió por ósmosis y la pared resistió el cambio de forma externa","L3Q08"],["Una célula acumula ácidos grasos de cadena muy larga y presenta dificultades para degradarlos. ¿Qué orgánulo podría estar afectado?",["El peroxisoma","El nucléolo","El ribosoma","El centrosoma"],"El peroxisoma","L3Q09"],["Una célula desconocida tiene núcleo, mitocondrias y membrana plasmática, pero no pared celular ni cloroplastos. ¿Cuál es la clasificación más probable?",["Célula animal eucariota","Célula vegetal fotosintética","Bacteria procariota","Virus con orgánulos"],"Célula animal eucariota","L3Q10"],["Una célula produce ARN mensajero, pero una mutación impide que este se una a los ribosomas. ¿Qué resultado se espera?",["Disminuye la síntesis de proteínas codificadas por ese ARN","Aumenta la producción de celulosa","Se acelera la fotosíntesis","Se duplica la membrana plasmática"],"Disminuye la síntesis de proteínas codificadas por ese ARN","L3Q11"],["Dos células del mismo organismo tienen prácticamente el mismo ADN, pero producen proteínas distintas y cumplen funciones diferentes. ¿Qué explicación es más adecuada?",["Expresan conjuntos diferentes de genes","Tienen necesariamente diferente código genético","Una de ellas carece de ADN","Sus membranas convierten unas proteínas en otras"],"Expresan conjuntos diferentes de genes","L3Q12"],["Una célula cúbica aumenta sus lados de 1 μm a 2 μm. ¿Cómo cambia su relación superficie-volumen?",["Disminuye de 6 a 3","Aumenta de 3 a 6","Permanece en 6","Se duplica de 1 a 2"],"Disminuye de 6 a 3","L3Q13"],["Una célula diploide con 12 cromosomas completa la mitosis y la citocinesis sin errores. ¿Cuántos cromosomas tendrá cada célula hija?",["12","6","24","48"],"12","L3Q14"],["Una célula vegetal en división forma una placa en el centro que crece hacia los bordes y separa las células hijas. ¿Qué proceso describe?",["Formación de la placa celular durante la citocinesis","Estrangulamiento de la membrana como en una célula animal","Separación de cromosomas en la meiosis","Digestión de la pared por lisosomas"],"Formación de la placa celular durante la citocinesis","L3Q15"],["Una persona tiene glóbulos rojos maduros sin núcleo. ¿Qué consecuencia funcional se relaciona con esa característica?",["No pueden dividirse ni renovar muchas de sus proteínas mediante transcripción nuclear","Pueden realizar fotosíntesis con más eficacia","Tienen más cromosomas que otras células","No necesitan membrana plasmática"],"No pueden dividirse ni renovar muchas de sus proteínas mediante transcripción nuclear","L3Q16"],["Un fármaco daña los tilacoides de los cloroplastos. ¿Qué etapa de la fotosíntesis se verá afectada de manera más directa?",["Las reacciones dependientes de la luz","La replicación del ADN nuclear","La digestión intracelular","La síntesis de lípidos en el retículo liso"],"Las reacciones dependientes de la luz","L3Q17"],["Una mutación inactiva enzimas del estroma del cloroplasto que incorporan dióxido de carbono a moléculas orgánicas. ¿Qué proceso se afecta directamente?",["El ciclo de Calvin","La glucólisis","La traducción en los ribosomas","La citocinesis"],"El ciclo de Calvin","L3Q18"],["Una enzima digestiva funciona dentro de un orgánulo ácido, pero pierde actividad cuando el interior de ese orgánulo se vuelve menos ácido. ¿Qué ventaja ofrece normalmente ese ambiente?",["Permite que ciertas enzimas del lisosoma funcionen eficazmente","Facilita la captación de luz por la clorofila","Permite que el ADN salga del núcleo","Hace que los ribosomas fabriquen celulosa"],"Permite que ciertas enzimas del lisosoma funcionen eficazmente","L3Q19"],["Una proteína nueva queda retenida en el retículo endoplasmático rugoso porque está mal plegada. ¿Qué interpretación explica mejor esa retención?",["La célula evita enviar una proteína defectuosa a etapas posteriores de la secreción","El retículo rugoso transforma la proteína en ADN","El aparato de Golgi está copiando el núcleo","La proteína debe convertirse en un lípido para salir"],"La célula evita enviar una proteína defectuosa a etapas posteriores de la secreción","L3Q20"],["Una mutación impide que un receptor de membrana se una a su señal específica, aunque la señal esté presente fuera de la célula. ¿Qué efecto es más probable?",["La célula no desencadena adecuadamente la respuesta asociada a esa señal","La señal atraviesa siempre la membrana por ósmosis","La célula comienza a fabricar una pared de celulosa","El núcleo deja de contener cromosomas"],"La célula no desencadena adecuadamente la respuesta asociada a esa señal","L3Q21"],["Se observa que una sustancia atraviesa una membrana desde una región de alta concentración a otra de baja concentración, pero el proceso se detiene al bloquear una proteína canal. ¿Qué mecanismo es más probable?",["Difusión facilitada","Difusión simple a través de lípidos","Transporte activo con gasto de ATP","Exocitosis"],"Difusión facilitada","L3Q22"],["En un experimento, se mantienen iguales la temperatura, el dióxido de carbono y el agua, pero se cambia la intensidad de luz para medir la fotosíntesis. ¿Cuál es la variable independiente?",["La intensidad de luz","La cantidad de agua","La temperatura","La tasa de fotosíntesis medida"],"La intensidad de luz","L3Q23"],["Una sustancia cruza una membrana permeable al agua, pero no a esa sustancia. La diferencia de concentración de la sustancia es mayor en un lado. ¿Hacia dónde habrá flujo neto de agua?",["Hacia el lado con mayor concentración de la sustancia no permeable","Hacia el lado con menor concentración de la sustancia no permeable","No habrá movimiento de agua","El agua se moverá siempre hacia donde haya más oxígeno"],"Hacia el lado con mayor concentración de la sustancia no permeable","L3Q24"],["Una célula madre se diferencia en una célula especializada. ¿Qué cambio molecular permite explicar mejor que adquiera una función nueva sin cambiar necesariamente su ADN?",["Cambios en qué genes están activos y cuáles están inactivos","Sustitución de todos sus cromosomas","Conversión de la membrana en pared celular","Pérdida obligatoria de todos los ribosomas"],"Cambios en qué genes están activos y cuáles están inactivos","L3Q25"],["Un organismo unicelular eucariota vive de manera independiente. ¿Cómo puede realizar funciones como obtener energía y responder al entorno?",["Su única célula lleva a cabo las funciones necesarias para la vida","Necesita que un tejido animal realice todas sus funciones","Sus orgánulos funcionan como organismos independientes","Carece de membrana y usa la pared como núcleo"],"Su única célula lleva a cabo las funciones necesarias para la vida","L3Q26"],["Durante una sequía, las células oclusivas de una hoja pierden turgencia y los poros estomáticos se cierran. ¿Qué efecto ayuda a producir ese cierre?",["Reduce la pérdida de agua por transpiración","Aumenta la salida de agua de la hoja","Permite la entrada ilimitada de sales al núcleo","Incrementa directamente la producción de clorofila"],"Reduce la pérdida de agua por transpiración","L3Q27"],["Una mutación altera la estructura de los cilios que recubren las vías respiratorias. ¿Qué consecuencia es más probable?",["Se dificulta el desplazamiento del moco y de partículas atrapadas","Se bloquea la síntesis de celulosa en los pulmones","Aumenta la producción de glóbulos rojos en los cilios","Se impide la replicación del ADN de todas las células"],"Se dificulta el desplazamiento del moco y de partículas atrapadas","L3Q28"],["Un compuesto impide que los microtúbulos formen el huso mitótico. ¿Qué problema se espera durante la división celular?",["Los cromosomas pueden no separarse correctamente hacia las células hijas","Las vesículas secretoras no pueden realizar ósmosis","La membrana plasmática se convierte en pared celular","Los ribosomas dejan de contener ARN"],"Los cromosomas pueden no separarse correctamente hacia las células hijas","L3Q29"],["Una célula vegetal mantiene intacta su pared, pero pierde selectivamente la membrana plasmática. ¿Qué consecuencia tendría para el intercambio de sustancias?",["Perdería gran parte del control selectivo del intercambio con el entorno","Conservaría el control selectivo porque la pared sustituye a la membrana","Seguiría regulando el intercambio mediante el nucléolo","El intercambio cesaría porque la pared es impermeable a toda sustancia"],"Perdería gran parte del control selectivo del intercambio con el entorno","L3Q30"]]];
const KEY='biology_celula_progress_v5';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
