,"En dos cromosomas sexuales distintos","En dos mitocondrias diferentes","Una en el núcleo y otra en la membrana celular"],"En loci correspondientes de los cromosomas homólogos","L2Q25"],["En una cruza Aa × Aa, se considera cada nacimiento independiente. Si la primera cría es aa, ¿cambia la probabilidad de que la siguiente sea aa?",["No; sigue siendo 1/4","Sí; pasa a ser 1/2","Sí; pasa a ser 0","Sí; pasa a ser 3/4"],"No; sigue siendo 1/4","L2Q26"],["En una molécula de ADN de doble cadena hay 30 adeninas en total. ¿Cuántas timinas hay en esa molécula?",["30","15","60","No se puede saber sin contar las guaninas"],"30","L2Q27"],["Una pareja pregunta si su hijo heredará necesariamente el rasgo más común en la población. ¿Qué respuesta es científicamente más correcta?",["No; la frecuencia poblacional de un alelo no determina por sí sola el resultado de una familia","Sí; el alelo más común siempre domina","Sí; cada hijo recibe los alelos más frecuentes","No; los hijos no heredan alelos de sus progenitores"],"No; la frecuencia poblacional de un alelo no determina por sí sola el resultado de una familia","L2Q28"],["En un rasgo con dominancia completa, una descendencia de prueba incluye individuos recesivos. ¿Qué indica esto sobre el progenitor de fenotipo dominante?",["Que probablemente es heterocigoto","Que necesariamente es homocigoto dominante","Que no produjo gametos","Que el rasgo es necesariamente ligado al sexo"],"Que probablemente es heterocigoto","L2Q29"],["¿Qué diferencia principal hay entre un gen y un cromosoma?",["Un gen es una región de ADN; un cromosoma es una estructura que contiene muchas regiones de ADN, incluidos genes","Un gen contiene muchos cromosomas; un cromosoma es una variante de un gen","Son términos que nombran exactamente la misma estructura","Un gen está formado por células y un cromosoma por alelos"],"Un gen es una región de ADN; un cromosoma es una estructura que contiene muchas regiones de ADN, incluidos genes","L2Q30"]],[["En conejos, B produce pelaje negro y domina completamente sobre b, que produce pelaje blanco. ¿Qué proporción de crías blancas se espera al cruzar Bb × Bb?",["1/4","1/2","3/4","0"],"1/4","L3Q01"],["En una planta, T (alta) domina sobre t (baja). Se cruza una planta Tt con una tt. ¿Qué proporción de la descendencia se espera que sea alta?",["1/2","1/4","3/4","1"],"1/2","L3Q02"],["En una especie, A/a y B/b se heredan independientemente y muestran dominancia completa. En AaBb × AaBb, ¿qué proporción se espera con fenotipo dominante para ambos caracteres?",["9/16","3/16","1/2","1/4"],"9/16","L3Q03"],["Para dos genes independientes con dominancia completa, se cruza AaBb × aabb. ¿Qué proporción de la descendencia se espera que sea aabb?",["1/4","1/2","1/8","1/16"],"1/4","L3Q04"],["En una especie, A domina sobre a y B domina sobre b. Se cruza AABb × aaBb. ¿Qué proporción tendrá fenotipo dominante para ambos caracteres?",["3/4","1/2","1/4","1"],"3/4","L3Q05"],["En una condición recesiva autosómica, dos progenitores Aa tienen descendencia. ¿Cuál es la probabilidad de que tres hijos consecutivos sean todos aa?",["1/64","3/4","1/16","1/4"],"1/64","L3Q06"],["Dos individuos Aa tienen descendencia para un rasgo recesivo. ¿Cuál es la probabilidad de que, entre dos hijos, al menos uno sea aa?",["7/16","1/16","1/2","9/16"],"7/16","L3Q07"],["Una madre portadora de una condición recesiva ligada al X (XᴺXⁿ) tiene hijos con un padre no afectado (XᴺY). ¿Cuál es la probabilidad de que un hijo elegido al azar, sin especificar sexo, sea afectado?",["1/4","1/2","3/4","0"],"1/4","L3Q08"],["Un padre afectado por una condición recesiva ligada al X (XⁿY) tiene hijos con una madre no portadora (XᴺXᴺ). ¿Qué proporción de todos sus hijos se espera que sean portadores?",["1/2","1/4","1","0"],"1/2","L3Q09"],["En el sistema ABO, se cruza una persona Iᴬi con una persona Iᴮi. ¿Qué proporción se espera para cada grupo sanguíneo A, B, AB y O?",["1/4 para cada grupo","1/2 A y 1/2 B","1/2 AB y 1/2 O","3/4 AB y 1/4 O"],"1/4 para cada grupo","L3Q10"],["En una especie de flores, RR es rojo, WW es blanco y RW es rosado por dominancia incompleta. Al cruzar RW × RW, ¿qué proporción se espera de flores rosadas?",["1/2","1/4","3/4","1"],"1/2","L3Q11"],["En un rasgo codominante, los genotipos CᴿCᴿ son rojos, CᵂCᵂ son blancos y CᴿCᵂ muestra ambos colores. ¿Qué proporción con ambos colores resulta de CᴿCᵂ × CᵂCᵂ?",["1/2","1/4","3/4","0"],"1/2","L3Q12"],["Una secuencia de ADN de doble cadena tiene 120 pares de bases. ¿Cuántas bases contiene en total entre ambas cadenas?",["240","120","60","480"],"240","L3Q13"],["Una molécula de ADN de doble cadena tiene 200 nucleótidos en total, de los cuales 60 son guaninas. ¿Cuántas adeninas hay, si se cumple el apareamiento normal de bases?",["40","60","80","100"],"40","L3Q14"],["Una especie tiene 2n = 12 cromosomas en sus células somáticas. Tras la meiosis, ¿cuántos cromosomas tendrá cada gameto normal?",["6","12","24","3"],"6","L3Q15"],["En un organismo con 2n = 16, ¿cuántas cromátidas hay en una célula justo después de la replicación del ADN y antes de separar las cromátidas hermanas?",["32","16","8","64"],"32","L3Q16"],["Una célula humana diploide inicia meiosis con 46 cromosomas. Al terminar la meiosis II, ¿cuántos cromosomas tendrá cada gameto normal?",["23","46","92","12"],"23","L3Q17"],["Una madre es heterocigota (Aa) para un alelo autosómico y el padre es aa. ¿Cuál es la probabilidad de que un hijo herede el alelo a de ambos progenitores?",["1/2","1/4","3/4","1"],"1/2","L3Q18"],["Una pareja Aa × Aa tiene cuatro hijos. ¿Cuál es la probabilidad de que exactamente dos sean aa?",["27/128","3/8","1/4","81/256"],"27/128","L3Q19"],["Una pareja Aa × Aa tiene cuatro hijos. ¿Cuál es la probabilidad de que ninguno sea aa?",["81/256","27/64","1/16","3/4"],"81/256","L3Q20"],["En una familia, ambos progenitores tienen fenotipo normal, pero nace un hijo con una condición recesiva autosómica. ¿Cuál es la probabilidad de que el próximo hijo también presente la condición?",["1/4","1/2","3/4","1/16"],"1/4","L3Q21"],["En una condición recesiva ligada al X, una madre XᴺXⁿ y un padre XᴺY esperan un hijo varón. ¿Qué probabilidad tiene ese hijo de ser portador sin presentar la condición?",["1/2","1/4","0","1"],"1/2","L3Q22"],["Una mujer XᴺXⁿ y un hombre XⁿY tienen descendencia para un rasgo recesivo ligado al X. ¿Qué proporción de sus hijas se espera que tenga la condición?",["1/2","1/4","3/4","0"],"1/2","L3Q23"],["Dos genes independientes se cruzan en AaBb × AaBb. ¿Qué probabilidad tiene la descendencia de ser homocigota recesiva en ambos genes (aabb)?",["1/16","1/8","1/4","9/16"],"1/16","L3Q24"],["En AaBb × AaBb, con genes independientes y dominancia completa, ¿qué proporción tendrá fenotipo dominante para exactamente uno de los dos caracteres?",["3/8","1/2","9/16","1/4"],"3/8","L3Q25"],["Un progenitor de genotipo AaBb forma gametos, y los genes se distribuyen independientemente. ¿Qué probabilidad tiene de producir un gameto AB?",["1/4","1/2","1/8","1"],"1/4","L3Q26"],["Una condición dominante autosómica aparece en todas las generaciones de una familia. Un progenitor afectado heterocigoto (Aa) tiene hijos con una persona no afectada (aa). ¿Qué proporción de hijos se espera afectada?",["1/2","1/4","3/4","1"],"1/2","L3Q27"],["En una planta, los alelos R y W muestran dominancia incompleta: RR es roja, RW rosada y WW blanca. Se cruza una planta roja con una rosada. ¿Qué proporción se espera que sea blanca?",["0","1/4","1/2","3/4"],"0","L3Q28"],["En un rasgo autosómico recesivo, una persona afectada aa tiene hijos con una persona no afectada cuyo padre era aa. ¿Qué probabilidad tiene cada hijo de ser afectado?",["1/2","1/4","3/4","0"],"1/2","L3Q29"],["Una pareja tiene genotipos Aa y Aa. ¿Cuál es la probabilidad de que sus dos próximos hijos tengan genotipos distintos entre sí?",["1/2","3/8","1/4","3/4"],"1/2","L3Q30"]]];
const KEY='biology_genetica_progress_v5';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
