nsación se asocia comúnmente con las bases al tacto, aunque nunca deben probarse ni tocarse para identificarlas?",["Resbaladiza o jabonosa","Áspera como papel de lija","Fría en todos los casos","Pegajosa como miel"],"Resbaladiza o jabonosa","L1Q23"],["¿Qué sabor se asocia tradicionalmente con los ácidos?",["Agrio","Dulce","Salado","Amargo exclusivamente"],"Agrio","L1Q24"],["¿Cómo se clasifica el cloruro de sodio (NaCl) en una descripción escolar básica?",["Como una sal","Como un ácido","Como una base fuerte","Como un indicador"],"Como una sal","L1Q25"],["¿Qué significa que un ácido sea fuerte?",["Que se ioniza prácticamente por completo en agua","Que siempre está muy concentrado","Que es necesariamente corrosivo en cualquier cantidad","Que tiene un pH exactamente igual a cero"],"Que se ioniza prácticamente por completo en agua","L1Q26"],["Al preparar una disolución diluida de ácido concentrado, ¿qué práctica de seguridad es correcta?",["Añadir lentamente el ácido al agua","Añadir rápidamente agua al ácido","Mezclar ambos sin protección","Calentar primero el ácido en un recipiente cerrado"],"Añadir lentamente el ácido al agua","L1Q27"],["¿Por qué muchas disoluciones de ácidos y bases conducen electricidad?",["Porque contienen iones móviles","Porque todas contienen metales sólidos","Porque el agua pura conduce mejor que ellas","Porque sus moléculas no se mueven"],"Porque contienen iones móviles","L1Q28"],["¿Qué color suele mostrar el indicador universal cerca de pH 7?",["Verde","Rojo intenso","Violeta oscuro","Naranja"],"Verde","L1Q29"],["¿Qué ocurre con el papel tornasol rojo al entrar en contacto con una disolución neutra?",["Permanece rojo","Se vuelve azul","Se vuelve rosa","Se vuelve incoloro"],"Permanece rojo","L1Q30"]],[["Una muestra acuosa tiene pH 2. ¿Cómo se clasifica?",["Ácida","Neutra","Básica","No acuosa"],"Ácida","L2Q01"],["Ordena estas muestras de menor a mayor acidez: pH 3, pH 6 y pH 9. ¿Cuál es el orden correcto?",["pH 9, pH 6, pH 3","pH 3, pH 6, pH 9"  ácido débil conduce mejor porque no se ioniza","Ambas son necesariamente aislantes","La conductividad es idéntica porque tienen el mismo pH"],"La solución del ácido fuerte conduce mejor","L3Q19"],["Al diluir una solución de un ácido débil, suele aumentar la fracción de moléculas que se ioniza. ¿Qué puede concluirse sobre su concentración total de H₃O⁺?",["No necesariamente aumenta; la solución queda más diluida","Aumenta siempre en la misma proporción que el volumen","Se vuelve cero de inmediato","Se mantiene necesariamente idéntica"],"No necesariamente aumenta; la solución queda más diluida","L3Q20"],["¿Cuántas veces mayor es [H₃O⁺] en una solución de pH 2 que en otra de pH 5?",["1000 veces","3 veces","100 veces","10 veces"],"1000 veces","L3Q21"],["Se añade una pequeña cantidad de ácido a una solución amortiguadora. ¿Qué ocurre normalmente con el pH, comparado con el cambio en agua sin amortiguador?",["Cambia menos, porque el tampón consume parte del H₃O⁺ añadido","Cambia mucho más, porque el tampón concentra el ácido","Se vuelve exactamente 7 en todo caso","El pH deja de poder medirse"],"Cambia menos, porque el tampón consume parte del H₃O⁺ añadido","L3Q22"],["Una muestra de agua pura está a 25 °C. ¿Qué afirmación sobre sus concentraciones iónicas es correcta?",["[H₃O⁺] = [OH⁻] y el pH es 7","[H₃O⁺] es diez veces [OH⁻]","No contiene ningún ion","[OH⁻] es cero"],"[H₃O⁺] = [OH⁻] y el pH es 7","L3Q23"],["Se disuelve acetato de sodio en agua y se obtiene una solución básica. ¿Qué explicación es más adecuada?",["El ion acetato puede aceptar protones del agua y formar OH⁻","El ion sodio libera H₃O⁺ de manera inmediata","Toda sal produce una solución neutra","El acetato actúa como indicador universal"],"El ion acetato puede aceptar protones del agua y formar OH⁻","L3Q24"],["Se titula un ácido débil con una base fuerte. ¿Qué indicador es generalmente adecuado porque cambia de color en una zona básica?",["Fenolftaleína","Un indicador que vira solo cerca de pH 1","Almidón" const KEY='chemistry_acidos_bases_ph_progress_v5';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Ácidos, bases y pH<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
