/* El código del profesor es obligatorio y se revalida contra la licencia en cada apertura. */
(async function(){
  const code=(localStorage.getItem('saas_classCode')||'').trim().toUpperCase();
  const name=(localStorage.getItem('saas_studentName')||'').trim();
  const fail=function(){ ['saas_access_ok','saas_classCode','saas_studentName','saas_subjects','saas_student_token'].forEach(k=>localStorage.removeItem(k)); location.replace('/catalogo.html?access=expired'); };
  if(!code||!name) return fail();
  try{
    const r=await fetch('/api/access/check?classCode='+encodeURIComponent(code),{cache:'no-store',headers:{Authorization:'Bearer '+(localStorage.getItem('saas_student_token')||'')}});
    const d=await r.json();
    if(!d.allowed || (Array.isArray(d.subjects)&&d.subjects.length&&!d.subjects.includes('fisica'))) return fail();
    localStorage.setItem('saas_access_ok','1');
    localStorage.setItem('saas_student_token',d.accessToken||localStorage.getItem('saas_student_token')||'');
    localStorage.setItem('saas_subjects',JSON.stringify(d.subjects||[]));
  }catch(e){ return fail(); }
})();

<script>
/* ===================== DATA / ESTADO ===================== */
const STORAGE_KEY = "mru_game_progress_v2";
const QUESTIONS_PER_LEVEL = 5;
const PASS_RATIO = 0.6; // 60% para desbloquear el siguiente nivel

const LEVELS = [
  { id:0, title:"Velocidad básica", tag:"Nivel 1 · v = d / t", desc:"Calcula la velocidad conociendo la distancia y el tiempo." },
  { id:1, title:"Distancia o tiempo", tag:"Nivel 2 · despeje", desc:"Despeja la distancia o el tiempo a partir de la velocidad." },
  { id:2, title:"Ecuación del MRU", tag:"Nivel 3 · x = x₀ + v·t", desc:"Incluye posición inicial y dirección del movimiento (signo de v)." },
  { id:3, title:"Conversión de unidades", tag:"Nivel 4 · km/h ↔ m/s", desc:"Resuelve problemas convirtiendo unidades de velocidad." },
  { id:4, title:"Encuentro y alcance", tag:"Nivel 5 · reto final", desc:"Problemas de dos móviles: encuentro o alcance." },
];

const SCORES_KEY = "mru_levelScores_v2";
const MAX_TOTAL_POINTS = 1500;
const STUDENT_ROSTER = {};let studentCode = '';

function onSectionChange() { const input=document.getElementById('studentNameSelect'); if(input) input.disabled=false; }

function getSelectedStudent() { const sec=document.getElementById('studentSectionInput').value; const input=document.getElementById('studentNameSelect'); const name=input && input.value.trim(); if(!sec || !name) return null; return {section:sec,name:name,code:''}; }

let studentName = 'Estudiante';
let studentSection = 'A';
let lastBadge = '';
let lastScore = 0;
let finalGrade20 = 0;
let totalPointsAllLevels = 0;
let levelScores = { 0:0, 1:0, 2:0, 3:0, 4:0 };

function loadLevelScores(){
  try{
    const s = localStorage.getItem(SCORES_KEY);
    if(s) levelScores = { 0:0, 1:0, 2:0, 3:0, 4:0, ...JSON.parse(s) };
  }catch(e){}
}
function saveLevelScores(){
  try{ localStorage.setItem(SCORES_KEY, JSON.stringify(levelScores)); return true; }
  catch(e){ console.warn('No se pudieron guardar puntajes', e); return false; }
}
function computeGrade20(){
  totalPointsAllLevels = [0,1,2,3,4].reduce((s,L)=> s + (levelScores[L]||0), 0);
  let g = Math.round((totalPointsAllLevels / MAX_TOTAL_POINTS) * 20);
  if(g < 1) g = 1; if(g > 20) g = 20;
  finalGrade20 = g; return g;
}
loadLevelScores();

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { unlocked:0, stars:{}, studentName:'', studentSection:'A' };
}
function saveProgress(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); return true; }
  catch(e){ console.warn('No se pudo guardar progreso', e); return false; }
}
let progress = loadProgress();

/* ===================== UTILIDADES ===================== */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function choice(arr){ return arr[randInt(0,arr.length-1)]; }
function fmt(n){
  const r = Math.round(n*100)/100;
  return (Number.isInteger(r)) ? r.toString() : r.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");
}
function closeEnough(a,b,tol){ return Math.abs(a-b) <= tol; }

/* ===================== GENERADORES DE PROBLEMAS ===================== */
function genLevel0(){
  // v = d/t, numeros amigables
  const t = choice([2,3,4,5,6,8,10]);
  const vTarget = choice([2,3,4,5,6,8,10,12]);
  const d = t*vTarget;
  return {
    tag:"¿Cuál es la velocidad?",
    text:`Un ciclista recorre <b>${d} m</b> en línea recta en <b>${t} s</b>, siempre a la misma rapidez. ¿Cuál es su velocidad?`,
    unit:"m/s",
    answer: vTarget,
    tol: 0.05,
    steps:`v = d / t = ${d} m / ${t} s = ${fmt(vTarget)} m/s`
  };
}

function genLevel1(){
  const findWhat = choice(["d","t"]);
  const v = choice([2,3,4,5,6,8,10,12]);
  const t = choice([2,3,4,5,6,7,8]);
  const d = v*t;
  if(findWhat === "d"){
    return {
      tag:"¿Qué distancia recorre?",
      text:`Un auto se mueve con MRU a <b>${v} m/s</b> durante <b>${t} s</b>. ¿Qué distancia recorre?`,
      unit:"m",
      answer:d, tol:0.05,
      steps:`d = v · t = ${v} m/s × ${t} s = ${fmt(d)} m`
    };
  } else {
    return {
      tag:"¿Cuánto tiempo tarda?",
      text:`Un auto viaja con MRU a <b>${v} m/s</b> y recorre <b>${d} m</b>. ¿Cuánto tiempo tarda?`,
      unit:"s",
      answer:t, tol:0.05,
      steps:`t = d / v = ${d} m / ${v} m/s = ${fmt(t)} s`
    };
  }
}

function genLevel2(){
  const x0 = choice([-10,-5,0,0,5,10,15]);
  const v = choice([-6,-4,-3,2,3,4,5,6,7]);
  const t = choice([2,3,4,5,6]);
  const x = x0 + v*t;
  const dirTxt = v>=0 ? "hacia la derecha (dirección positiva)" : "hacia la izquierda (dirección negativa)";
  return {
    tag:"Ecuación del MRU",
    text:`Un móvil parte de la posición <b>x₀ = ${x0} m</b> y se mueve con velocidad constante <b>v = ${v} m/s</b> (${dirTxt}). ¿En qué posición se encuentra luego de <b>${t} s</b>?`,
    unit:"m",
    answer:x, tol:0.05,
    steps:`x = x₀ + v·t = ${x0} + (${v})(${t}) = ${fmt(x)} m`
  };
}

function genLevel3(){
  const kmh_options = [18,36,54,72,90,108];
  const kmh = choice(kmh_options);
  const ms = kmh/3.6;
  const t = choice([5,10,15,20,25,30]);
  const findWhat = choice(["d","kmh_to_ms"]);
  if(findWhat === "d"){
    const d = ms*t;
    return {
      tag:"Convierte y calcula",
      text:`Un vehículo se mueve a <b>${kmh} km/h</b> con velocidad constante. ¿Qué distancia recorre en <b>${t} s</b>? (Recuerda convertir a m/s dividiendo entre 3,6)`,
      unit:"m",
      answer:d, tol: Math.max(0.5, d*0.01),
      steps:`v = ${kmh} km/h ÷ 3,6 = ${fmt(ms)} m/s\nd = v · t = ${fmt(ms)} × ${t} = ${fmt(d)} m`
    };
  } else {
    return {
      tag:"Convierte unidades",
      text:`Expresa <b>${kmh} km/h</b> en metros por segundo (m/s).`,
      unit:"m/s",
      answer:ms, tol:0.1,
      steps:`v = ${kmh} ÷ 3,6 = ${fmt(ms)} m/s`
    };
  }
}

function genLevel4(){
  const type = choice(["encuentro","alcance"]);
  if(type === "encuentro"){
    const v1 = choice([20,25,30,35,40,45]);
    const v2 = choice([15,20,25,30,35]);
    const t = choice([2,3,4,5,6]);
    const D = (v1+v2)*t;
    return {
      tag:"Encuentro de dos móviles",
      text:`Dos pueblos, A y B, están separados por <b>${D} km</b>. Desde A sale un auto hacia B a <b>${v1} km/h</b>, y al mismo tiempo, desde B sale otro auto hacia A a <b>${v2} km/h</b>. Ambos mantienen velocidad constante. ¿Después de cuántas horas se encuentran?`,
      unit:"h",
      answer:t, tol:0.05,
      steps:`Se acercan a una rapidez combinada de v1+v2 = ${v1+v2} km/h.\nt = D / (v1+v2) = ${D} / ${v1+v2} = ${fmt(t)} h`
    };
  } else {
    const v1 = choice([20,25,30]); // el que va adelante, más lento
    let v2 = choice([40,45,50,55,60]); // el que persigue, más rápido
    const t = choice([2,3,4,5,6]);
    const D = (v2-v1)*t;
    return {
      tag:"Alcance de dos móviles",
      text:`Un camión va por una carretera recta a <b>${v1} km/h</b>. Cuando lleva <b>${D} km</b> de ventaja, un auto sale a perseguirlo desde el mismo punto de partida del camión, a <b>${v2} km/h</b> constantes. ¿Cuánto tiempo tarda el auto en alcanzar al camión?`,
      unit:"h",
      answer:t, tol:0.05,
      steps:`Diferencia de rapidez v2−v1 = ${v2-v1} km/h.\nt = D / (v2−v1) = ${D} / ${v2-v1} = ${fmt(t)} h`
    };
  }
}

const GENERATORS = [genLevel0, genLevel1, genLevel2, genLevel3, genLevel4];

/* ===================== ESTADO DE JUEGO ===================== */
let session = null; // {levelId, qIndex, results:[], currentProblem}

function startLevel(levelId){
  session = { levelId, qIndex:0, results:[], currentProblem:null, lives:3 };
  nextQuestion();
  renderQuestion();
}
function nextQuestion(){
  session.currentProblem = GENERATORS[session.levelId]();
}

/* ===================== RENDER: PREGUNTA ===================== */
function renderQuestion(){
  const lv = LEVELS[session.levelId];
  setHeader(lv.title, lv.tag, true);
  const main = document.getElementById("main");

  let dots = "";
  for(let i=0;i<QUESTIONS_PER_LEVEL;i++){
    let cls = "dot";
    if(i < session.qIndex) cls += session.results[i] ? " done-correct" : " done-wrong";
    else if(i === session.qIndex) cls += " current";
    dots += `<div class="${cls}"></div>`;
  }

  const p = session.currentProblem;

  const hearts = '❤️'.repeat(Math.max(session.lives, 0)) || '💀';
  main.innerHTML = `
    <div class="lives-bar">
      <span>Pregunta <b>${session.qIndex+1}</b> / ${QUESTIONS_PER_LEVEL}</span>
      <span class="hearts" id="livesDisplay">${hearts}</span>
      <span>❤️ Vidas: <b>${session.lives}</b></span>
    </div>
    <div class="progress-dots">${dots}</div>
    <div class="question-card">
      <div class="question-tag">${p.tag}</div>
      <div class="question-text">${p.text}</div>
      <div class="answer-row">
        <button type="button" class="btn-sign" id="signBtn" title="Negativo" aria-label="Signo negativo">−</button>
        <input type="text" inputmode="decimal" id="answerInput" placeholder="Solo números" autocomplete="off" enterkeyhint="done">
        <div class="unit-label">${p.unit}</div>
      </div>
      <button type="button" class="btn-negative" id="negBtn">Tocar aquí si el resultado es NEGATIVO (−)</button>
      <p style="font-size:0.78rem;color:#64748b;margin:4px 0 8px;text-align:center;">En iPhone el teclado no tiene el signo menos: usa el botón <b>−</b> o el de abajo.</p>
      <button class="btn btn-primary" id="checkBtn">Verificar respuesta</button>
      <div id="feedbackArea"></div>
    </div>
  `;

  document.getElementById("checkBtn").addEventListener("click", checkAnswer);
  const ansInput = document.getElementById("answerInput");
  const signBtn = document.getElementById("signBtn");
  const negBtn = document.getElementById("negBtn");

  function syncNegUI(){
    const v = (ansInput.value || "").trim();
    const isNeg = v.startsWith("-") || v.startsWith("−");
    ansInput.classList.toggle("is-neg", isNeg);
    if (negBtn) {
      negBtn.classList.toggle("is-neg", isNeg);
      negBtn.textContent = isNeg
        ? "Resultado NEGATIVO activado (tocar para quitar)"
        : "Tocar aquí si el resultado es NEGATIVO (−)";
    }
  }
  function toggleNegative(){
    let v = (ansInput.value || "").trim().replace(/−/g, "-").replace(",", ".");
    if (!v || v === "-") {
      ansInput.value = "-";
    } else if (v.startsWith("-")) {
      ansInput.value = v.slice(1);
    } else {
      ansInput.value = "-" + v.replace(/^\+/, "");
    }
    syncNegUI();
    // No forzar focus en iPhone para no ocultar los botones con el teclado
  }
  if (signBtn) signBtn.addEventListener("click", function(e){ e.preventDefault(); toggleNegative(); });
  if (negBtn) negBtn.addEventListener("click", function(e){ e.preventDefault(); toggleNegative(); });
  ansInput.addEventListener("keydown", (e)=>{
    if(e.key === "Enter") checkAnswer();
  });
  ansInput.addEventListener("input", ()=>{
    let v = ansInput.value;
    v = v.replace(/−/g, "-");
    v = v.replace(/[^0-9.,\-]/g, "");
    v = v.replace(/(?!^)-/g, "");
    ansInput.value = v;
    syncNegUI();
  });
  syncNegUI();
}

function checkAnswer(){
  const input = document.getElementById("answerInput");
  const raw = (input.value || "").trim().replace(/−/g, "-").replace(",", ".");
  const val = parseFloat(raw);
  const p = session.currentProblem;
  const area = document.getElementById("feedbackArea");
  if(raw === "" || raw === "-" || isNaN(val)){
    area.innerHTML = `<div class="feedback bad">Escribe un número antes de verificar. Si es negativo, usa el botón ±.</div>`;
    return;
  }
  const correct = closeEnough(val, p.answer, p.tol);
  session.results[session.qIndex] = correct;

  if (!correct) {
    session.lives = Math.max(0, (session.lives || 0) - 1);
  }
  const heartsNow = '❤️'.repeat(Math.max(session.lives, 0)) || '💀';
  const livesEl = document.getElementById('livesDisplay');
  if (livesEl) livesEl.textContent = heartsNow;

  const noLives = session.lives <= 0;
  const lastQ = session.qIndex >= QUESTIONS_PER_LEVEL - 1;
  let nextLabel = 'Siguiente pregunta';
  if (noLives) nextLabel = 'Ver resultados';
  else if (lastQ) nextLabel = 'Ver resultados';

  area.innerHTML = `<div class="feedback ${correct?'ok':'bad'}">
      ${correct ? "✅ ¡Correcto!" : `❌ No es correcto. La respuesta era ${fmt(p.answer)} ${p.unit}.`}
      ${!correct ? `<div style="margin-top:6px;font-weight:700;">Vidas restantes: ${heartsNow} (${session.lives})</div>` : ''}
      <div class="steps">${p.steps.replace(/\n/g,"<br>")}</div>
    </div>
    <button class="btn btn-secondary" id="nextBtn">${nextLabel}</button>`;

  document.getElementById("checkBtn").remove();
  input.disabled = true;

  document.getElementById("nextBtn").addEventListener("click", ()=>{
    if (session.lives <= 0) {
      finishLevel();
      return;
    }
    session.qIndex++;
    if(session.qIndex >= QUESTIONS_PER_LEVEL){
      finishLevel();
    } else {
      nextQuestion();
      renderQuestion();
    }
  });
}

function finishLevel(){
  // Rellenar preguntas no respondidas (por pérdida de vidas) como incorrectas
  for (let i = 0; i < QUESTIONS_PER_LEVEL; i++) {
    if (session.results[i] === undefined) session.results[i] = false;
  }
  const correctCount = session.results.filter(Boolean).length;
  const ratio = correctCount / QUESTIONS_PER_LEVEL;
  let stars = 0;
  if(ratio >= 0.99) stars = 3;
  else if(ratio >= 0.8) stars = 2;
  else if(ratio >= PASS_RATIO) stars = 1;

  const passed = ratio >= PASS_RATIO;
  // puntos: 20 * (nivel+1) por acierto
  const pts = correctCount * 20 * (session.levelId + 1);
  session.levelPoints = pts;
  lastScore = pts;

  if(passed){
    progress.stars[session.levelId] = Math.max(progress.stars[session.levelId]||0, stars);
    levelScores[session.levelId] = Math.max(levelScores[session.levelId]||0, pts);
    saveLevelScores();
    computeGrade20();
    if(session.levelId === progress.unlocked && progress.unlocked < LEVELS.length-1){
      progress.unlocked++;
    }
    if(session.levelId === LEVELS.length-1) progress.completedAllLevels = true;
    saveProgress(progress);
  }

  if(stars >= 3) lastBadge = '🏆 Excelente';
  else if(stars >= 2) lastBadge = '🥈 Muy bien';
  else if(passed) lastBadge = '🥉 Nivel superado';
  else lastBadge = '🔄 Sigue practicando';

  renderResult(correctCount, stars, passed);
}

function renderResult(correctCount, stars, passed){
  const lv = LEVELS[session.levelId];
  setHeader(lv.title, "Resultados", true);
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="result-wrap">
      <div class="big-stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
      <div class="result-title">${passed ? "¡Nivel superado!" : "Casi lo logras"}</div>
      <div class="result-sub">${studentName} · 3ero ${studentSection}<br>Correctas: ${correctCount}/${QUESTIONS_PER_LEVEL} · Puntos: ${session.levelPoints||0}</div>
      ${!passed ? `<div class="intro-box">Necesitas al menos ${Math.ceil(QUESTIONS_PER_LEVEL*PASS_RATIO)} correctas para desbloquear el siguiente nivel. ¡Inténtalo de nuevo!</div>` : ``}
      <button class="btn btn-primary" id="retryBtn">Repetir este nivel</button>
      ${(passed && session.levelId < LEVELS.length-1) ? `<button class="btn btn-secondary" id="nextLevelBtn">Siguiente nivel ➜</button>` : ``}
      ${(passed && session.levelId === LEVELS.length-1) ? `
        <button class="btn btn-primary" id="dlCert" style="background:#2E9E5B;">📥 Descargar mi logro</button>
        <button class="btn btn-secondary" id="notifyT">📧 Avisar a mi profesor</button>
        <p style="font-size:12px;color:#7a8a99;margin-top:8px;">Puntos totales: ${totalPointsAllLevels} · Nota: ${finalGrade20}/20<br>Se genera una imagen del resultado para compartir o enviar por correo al profesor.</p>
      ` : `<p style="font-size:12px;color:#9AA7B2;margin-top:10px;">🔒 El certificado se desbloquea al completar los 5 niveles.</p>`}
      <button class="btn btn-outline" id="menuBtn">Volver al mapa de niveles</button>
    </div>
  `;
  document.getElementById("retryBtn").addEventListener("click", ()=> startLevel(session.levelId));
  document.getElementById("menuBtn").addEventListener("click", ()=>{ session=null; showTab("levels"); });
  const nb = document.getElementById("nextLevelBtn");
  if(nb) nb.addEventListener("click", ()=> startLevel(session.levelId+1));
  const dl = document.getElementById("dlCert");
  if(dl) dl.addEventListener("click", downloadAchievement);
  const nt = document.getElementById("notifyT");
  if(nt) nt.addEventListener("click", notifyTeacher);
}

let simState = { running:false, x0:0, v:5, t:0, lastTs:null, raf:null, history:[] };

function renderSimulator(){
  setHeader("Simulador MRU","Explora cómo cambia la posición con el tiempo", false);
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="sim-track-wrap">
      <div class="sim-readout">
        <span>t = <span id="simT">0.0</span> s</span>
        <span>x = <span id="simX">0.0</span> m</span>
        <span>v = <span id="simV">${simState.v}</span> m/s</span>
      </div>
      <div class="sim-track" id="simTrack"></div>
      <canvas id="simGraph" width="400" height="160"></canvas>
      <div class="sim-controls">
        <label>Velocidad inicial (v): <span class="valdisp" id="vDisp">${simState.v} m/s</span></label>
        <input type="range" id="vSlider" min="-15" max="15" step="1" value="${simState.v}">
        <label>Posición inicial (x₀): <span class="valdisp" id="x0Disp">${simState.x0} m</span></label>
        <input type="range" id="x0Slider" min="-20" max="20" step="1" value="${simState.x0}">
      </div>
      <div class="sim-btns">
        <button class="btn btn-primary" id="simStart">▶ Iniciar</button>
        <button class="btn btn-outline" id="simReset">⟲ Reiniciar</button>
      </div>
    </div>
  `;
  buildTrackMarkers();
  document.getElementById("vSlider").addEventListener("input", (e)=>{
    simState.v = parseFloat(e.target.value);
    document.getElementById("vDisp").textContent = simState.v + " m/s";
    document.getElementById("simV").textContent = simState.v;
  });
  document.getElementById("x0Slider").addEventListener("input", (e)=>{
    simState.x0 = parseFloat(e.target.value);
    document.getElementById("x0Disp").textContent = simState.x0 + " m";
    if(!simState.running) resetSimVisual();
  });
  document.getElementById("simStart").addEventListener("click", toggleSim);
  document.getElementById("simReset").addEventListener("click", resetSim);
  resetSimVisual();
}

function buildTrackMarkers(){
  const track = document.getElementById("simTrack");
  track.innerHTML = "";
  for(let m=-20;m<=20;m+=5){
    const pct = ((m+20)/40)*100;
    const el = document.createElement("div");
    el.className = "marker";
    el.style.left = pct+"%";
    el.innerHTML = `<span>${m}</span>`;
    track.appendChild(el);
  }
  const car = document.createElement("div");
  car.className = "sim-car";
  car.id = "simCar";
  car.textContent = "🚗";
  track.appendChild(car);
}

function posToPct(x){
  const clamped = Math.max(-20, Math.min(20, x));
  return ((clamped+20)/40)*100;
}

function resetSimVisual(){
  const car = document.getElementById("simCar");
  if(car) car.style.left = posToPct(simState.x0)+"%";
  document.getElementById("simT").textContent = "0.0";
  document.getElementById("simX").textContent = fmt(simState.x0);
  simState.history = [{t:0,x:simState.x0}];
  drawSimGraph();
}

function resetSim(){
  simState.running = false;
  simState.t = 0;
  simState.lastTs = null;
  if(simState.raf) cancelAnimationFrame(simState.raf);
  document.getElementById("simStart").textContent = "▶ Iniciar";
  resetSimVisual();
}

function toggleSim(){
  simState.running = !simState.running;
  document.getElementById("simStart").textContent = simState.running ? "⏸ Pausar" : "▶ Iniciar";
  if(simState.running){
    simState.lastTs = null;
    simState.raf = requestAnimationFrame(simLoop);
  } else if(simState.raf){
    cancelAnimationFrame(simState.raf);
  }
}

function simLoop(ts){
  const car = document.getElementById("simCar");
  const tEl = document.getElementById("simT");
  const xEl = document.getElementById("simX");
  if(!car || !tEl || !xEl){
    // La pantalla del simulador ya no está visible: detener el bucle.
    simState.running = false;
    simState.raf = null;
    return;
  }

  if(!simState.lastTs) simState.lastTs = ts;
  const dt = (ts - simState.lastTs)/1000;
  simState.lastTs = ts;
  simState.t += dt;
  const x = simState.x0 + simState.v*simState.t;

  car.style.left = posToPct(x)+"%";
  tEl.textContent = fmt(simState.t);
  xEl.textContent = fmt(x);

  simState.history.push({t:simState.t, x});
  if(simState.history.length > 400) simState.history.shift();
  drawSimGraph();

  if(x <= -20 || x >= 20){
    simState.running = false;
    document.getElementById("simStart").textContent = "▶ Iniciar";
    return;
  }
  if(simState.running) simState.raf = requestAnimationFrame(simLoop);
}

function drawSimGraph(){
  const canvas = document.getElementById("simGraph");
  if(!canvas) return;
  const ctx = canvas.getContext("2d");
  const W = canvas.width, H = canvas.height;
  const padL = 40, padB = 26, padT = 12, padR = 12;
  ctx.clearRect(0,0,W,H);

  const hist = simState.history;
  const maxT = Math.max(5, hist[hist.length-1].t*1.1);
  const xs = hist.map(h=>h.x);
  let maxX = Math.max(20, ...xs);
  let minX = Math.min(-20, ...xs);

  function px(t){ return padL + (t/maxT)*(W-padL-padR); }
  function py(x){ return H-padB - ((x-minX)/(maxX-minX))*(H-padB-padT); }

  ctx.strokeStyle = "#c9d3db";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padL, padT); ctx.lineTo(padL, H-padB); ctx.lineTo(W-padR, H-padB);
  ctx.stroke();
  ctx.fillStyle = "#7a8a99";
  ctx.font = "10px Segoe UI";
  ctx.fillText("t (s)", W-padR-20, H-padB+18);
  ctx.fillText("x (m)", 4, padT+8);

  if(hist.length > 1){
    ctx.strokeStyle = "#E8763B";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    hist.forEach((h,i)=>{
      const X = px(h.t), Y = py(h.x);
      if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    });
    ctx.stroke();
  }
}

const VERIFY_SECRET = 'LOCAL-VERIFY-KEY';
function simpleHash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36).toUpperCase().padStart(7, '0').slice(0, 7);
}
function makeVerificationCode(gameId, name, section, points, grade) {
  const base = [gameId, (name || '').trim().toUpperCase(), section, String(points), String(grade), VERIFY_SECRET].join('|');
  const h = simpleHash(base);
  const pref = (gameId || 'JUE').replace(/[^A-Z0-9]/gi, '').slice(0, 3).toUpperCase() || 'JUE';
  return pref + '-' + h.slice(0, 3) + '-' + h.slice(3, 6);
}
function buildVerifyPayload(gameTitle, name, section, yearLabel, points, grade, badge, code) {
  return [
    'VERIFICACION DE LOGRO',
    'Colegio: ',
    '',
    'Juego: ' + gameTitle,
    'Estudiante: ' + name,
    'Curso: ' + yearLabel,
    'Seccion: ' + section,
    'Puntos: ' + points,
    'Nota: ' + grade + ' / 20',
    'Insignia: ' + (badge || ''),
    'Codigo: ' + code,
    'Fecha: ' + new Date().toLocaleString('es-VE')
  ].join('\n');
}
function drawCertificateChrome(ctx, w, h) {
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#ffffff';
  ctx.font = '12px Arial';
  for (let y = 40; y < h; y += 28) {
    for (let x = 20; x < w; x += 120) {
      ctx.fillText('', x + ((y / 28) % 2) * 40, y);
    }
  }
  ctx.restore();
}
function loadQrImage(text, size) {
  return new Promise(function(resolve) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = function() { resolve(img); };
    img.onerror = function() { resolve(null); };
    img.src = 'https://api.removed-qr.invalid/v1/create-qr-code/?size=' + size + 'x' + size + '&margin=8&data=' + encodeURIComponent(text);
    setTimeout(function() { if (!img.complete) resolve(null); }, 4000);
  });
}

<script>
(function(){
  var SAAS_API = localStorage.getItem('saas_api_base') || '';
  async function saasCheckAccess(){
    var gate = document.getElementById('licenseGate');
    var st = document.getElementById('licenseStatus');
    var code = localStorage.getItem('saas_classCode') || '';
    if(!code){ if(st) st.innerHTML='<b style="color:#fca5a5">Sin código de clase.</b> Vuelve al catálogo.'; if(gate) gate.className='license-gate blocked'; return false; }
    try{
      var r = await fetch(SAAS_API + '/api/access/check?classCode=' + encodeURIComponent(code));
      var data = await r.json();
      if(!data.allowed){ if(st) st.innerHTML='<b style="color:#fca5a5">Acceso bloqueado.</b>'; if(gate) gate.className='license-gate blocked'; return false; }
      if(st) st.innerHTML='<b style="color:#86efac">Licencia activa.</b> '+(data.teacherName||'');
      if(gate) gate.className='license-gate ok';
      try{ localStorage.setItem('saas_access_ok','1'); }catch(e){}
      var ni=document.getElementById('studentNameInput');
      if(ni && !ni.value && localStorage.getItem('saas_studentName')){ ni.value=localStorage.getItem('saas_studentName'); }
      return true;
    }catch(e){ if(st) st.innerHTML='<b style="color:#fca5a5">Sin servidor.</b> '+e.message; if(gate) gate.className='license-gate blocked'; return false; }
  }
  window.saasCheckAccess = saasCheckAccess;
  function wrapFn(name){
    var orig = window[name];
    if(typeof orig !== 'function' || orig._saasWrapped) return;
    var wrapped = async function(){
      if(!(await saasCheckAccess())){ alert('Sin acceso. Usa el catálogo con el código de clase.'); return; }
      return orig.apply(this, arguments);
    };
    wrapped._saasWrapped = true;
    window[name] = wrapped;
  }
  function install(){
    ['startRetoLevel','startLevel','startChallenge','beginLevel','startGame','startReto'].forEach(wrapFn);
    saasCheckAccess();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', install);
  else setTimeout(install, 0);
})();
</script>
