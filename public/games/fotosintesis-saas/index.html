(async function(){
  const code=(localStorage.getItem('saas_classCode')||'').trim().toUpperCase();
  const name=(localStorage.getItem('saas_studentName')||'').trim();
  const fail=function(){ ['saas_access_ok','saas_classCode','saas_studentName','saas_subjects','saas_student_token'].forEach(k=>localStorage.removeItem(k)); location.replace('/catalogo.html?access=expired'); };
  if(!code||!name) return fail();
  try{
    const r=await fetch('/api/access/check?classCode='+encodeURIComponent(code),{cache:'no-store',headers:{Authorization:'Bearer '+(localStorage.getItem('saas_student_token')||'')}});
    const d=await r.json();
    if(!d.allowed || (Array.isArray(d.subjects)&&d.subjects.length&&!d.subjects.includes('biologia'))) return fail();
    localStorage.setItem('saas_access_ok','1');
    localStorage.setItem('saas_student_token',d.accessToken||localStorage.getItem('saas_student_token')||'');
    localStorage.setItem('saas_subjects',JSON.stringify(d.subjects||[]));
  }catch(e){ return fail(); }
})();

const LEVEL_BANKS=[[["¿Qué proceso permite a las plantas fabricar materia orgánica usando energía de la luz?",["Fotosíntesis","Fermentación","Digestión","Transpiración"],"Fotosíntesis","L1Q01"],["¿Cuál es el principal azúcar que produce la fotosíntesis?",["Glucosa","Lactosa","Sacarosa","Fructosa"],"Glucosa","L1Q02"],["¿De dónde obtiene principalmente el carbono una planta para formar glucosa?",["Del dióxido de carbono del aire","Del oxígeno del suelo","De los minerales de las raíces","Del vapor de agua"],"Del dióxido de carbono del aire","L1Q03"],["¿Qué sustancia absorben las raíces y se utiliza como reactivo en la fotosíntesis?",["Agua","Oxígeno","Glucosa","Nitrógeno"],"Agua","L1Q04"],["¿Qué aporta la luz a la fotosíntesis?",["Energía","Carbono","Nitrógeno","Minerales"],"Energía","L1Q05"],["¿Qué pigmento verde capta gran parte de la energía luminosa en las plantas?",["Clorofila","Hemoglobina","Melanina","Queratina"],"Clorofila","L1Q06"],["¿En qué orgánulo de las células vegetales ocurre la fotosíntesis?",["Cloroplasto","Mitocondria","Núcleo","Vacuola"],"Cloroplasto","L1Q07"],["¿En qué estructura interna del cloroplasto se encuentran las membranas que captan la luz?",["Tilacoides","Estroma","Membrana nuclear","Pared celular"],"Tilacoides","L1Q08"],["¿Cómo se llaman los apilamientos de tilacoides?",["Grana","Crestas","Ribosomas","Vesículas"],"Grana","L1Q09"],["¿Cómo se llama el fluido que rodea los tilacoides dentro del cloroplasto?",["Estroma","Citoplasma","Lumen","Nucleoplasma"],"Estroma","L1Q10"],["¿Qué estructuras de la epidermis de las hojas permiten el intercambio de gases con el aire?",["Estomas","Pelos radicales","Lenticelas de la raíz","Nervaduras"],"Estomas","L1Q11"],["¿Qué células regulan la apertura y el cierre de cada estoma?",["Células oclusivas","Células del xilema","Células del floema","Células de la raíz"],"Células oclusivas","L1Q12"],["Durante la fotosíntesis, ¿qué gas entra principalmente en la hoja desde el aire?",["Dióxido de carbono","Oxígeno","Nitrógeno","Metano"],"Dióxido de carbono","L1Q13"],["¿Qué gas se libera al ambiente como producto de la fotosíntesis?",["Oxígeno","Dióxido de carbono","Amoníaco","Hidrógeno"],"Oxígeno","L1Q14"],["¿Qué función general puede cumplir la glucosa producida por una planta?",["Proporcionar energía mediante su degradación","Absorber luz en los tilacoides","Formar directamente el suelo","Abrir los estomas sin gasto de energía"],"Proporcionar energía mediante su degradación","L1Q15"],["¿En qué forma suelen almacenar las plantas el exceso de glucosa?",["Almidón","Celulosa","Clorofila","Dióxido de carbono"],"Almidón","L1Q16"],["¿Cómo se denomina a los organismos que producen compuestos orgánicos a partir de sustancias inorgánicas?",["Autótrofos","Depredadores","Parásitos","Descomponedores"],"Autótrofos","L1Q17"],["¿Qué colores de luz absorbe con mayor eficacia la clorofila?",["Rojo y azul","Verde y amarillo","Amarillo y naranja","Verde y violeta"],"Rojo y azul","L1Q18"],["¿En qué forma queda almacenada en la glucosa parte de la energía captada durante la fotosíntesis?",["Energía química","Energía sonora","Energía nuclear","Energía magnética"],"Energía química","L1Q19"],["¿En qué órgano de la mayoría de las plantas ocurre la mayor parte de la fotosíntesis?",["En las hojas","En las flores","En las semillas","En los frutos"],"En las hojas","L1Q20"],["¿Qué tejido de la hoja suele contener muchas células fotosintéticas?",["Mesófilo","Epidermis de la raíz","Xilema del tallo","Corteza de la semilla"],"Mesófilo","L1Q21"],["¿Por qué la mayoría de las raíces no realiza fotosíntesis de manera significativa?",["Porque normalmente no recibe luz y tiene pocos cloroplastos","Porque no contiene agua","Porque absorbe dióxido de carbono en exceso","Porque carece de células vivas"],"Porque normalmente no recibe luz y tiene pocos cloroplastos","L1Q22"],["¿Dónde ocurren las reacciones dependientes de la luz?",["En las membranas de los tilacoides","En el estroma","En el núcleo","En la pared celular"],"En las membranas de los tilacoides","L1Q23"],["¿En qué parte del cloroplasto se fija el carbono durante el ciclo de Calvin?",["En el estroma","En el lumen de los tilacoides","En la membrana externa","En el citoplasma de la raíz"],"En el estroma","L1Q24"],["¿De qué reactivo procede el oxígeno molecular que se libera en la fotosíntesis?",["Del agua","Del dióxido de carbono","De la glucosa","De la clorofila"],"Del agua","L1Q25"],["¿Cuál es la ecuación global simplificada y balanceada de la fotosíntesis?",["6 CO₂ + 6 H₂O + luz → C₆H₁₂O₆ + 6 O₂","C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + luz","6 O₂ + 6 H₂O → C₆H₁₂O₆ + 6 CO₂","CO₂ + O₂ + luz → H₂O + glucosa"],"6 CO₂ + 6 H₂O + luz → C₆H₁₂O₆ + 6 O₂","L1Q26"],["¿Qué factor puede limitar la fotosíntesis si está disponible en cantidad insuficiente?",["La intensidad de la luz","La gravedad terrestre","El sonido ambiental","La forma de las raíces"],"La intensidad de la luz","L1Q27"],["Si escasea el dióxido de carbono, ¿qué efecto puede tener sobre la fotosíntesis?",["Puede disminuir su velocidad","Aumenta necesariamente la producción de glucosa","Se convierte en respiración celular","No tiene ningún efecto"],"Puede disminuir su velocidad","L1Q28"],["¿Qué ocurre con las reacciones dependientes de la luz durante una noche sin iluminación?",["Se detienen por falta de luz","Continúan a la misma velocidad","Producen luz propia","Se convierten en fermentación"],"Se detienen por falta de luz","L1Q29"],["¿Cuál es una diferencia entre fotosíntesis y respiración celular?",["La fotosíntesis almacena energía química en compuestos orgánicos; la respiración libera parte de esa energía","Ambos procesos consumen exclusivamente dióxido de carbono","La respiración solo ocurre en plantas y la fotosíntesis solo en animales","La fotosíntesis descompone glucosa y la respiración la fabrica"],"La fotosíntesis almacena energía química en compuestos orgánicos; la respiración libera parte de esa energía","L1Q30"]],[["Una planta recibe luz, pero se coloca en aire sin dióxido de carbono. ¿Qué resultado se espera inicialmente?",["Disminuye la producción de azúcares por falta de carbono","Aumenta la producción de glucosa por exceso de oxígeno","La planta fabrica carbono a partir de la luz","La fotosíntesis continúa sin cambios"],"Disminuye la producción de azúcares por falta de carbono","L2Q01"],["Dos plantas iguales reciben agua y dióxido de carbono suficientes. Una está bajo luz roja y otra bajo luz verde. ¿Cuál suele fotosintetizar más activamente?",["La iluminada con luz roja, que la clorofila absorbe bien","La iluminada con luz verde, que la clorofila refleja bien","Ambas producen igual porque el color no importa","Ninguna, porque la luz coloreada no aporta energía"],"La iluminada con luz roja, que la clorofila absorbe bien","L2Q02"],["En una planta acuática, al aumentar la iluminación aparecen más burbujas de gas por minuto, hasta que la tasa deja de aumentar. ¿Qué indica el patrón?",["La luz elevó la fotosíntesis hasta que otro factor se volvió limitante","Las burbujas demuestran que la respiración se detuvo","La planta dejó de absorber agua al recibir más luz","El gas dejó de producirse porque el oxígeno se convirtió en glucosa"],"La luz elevó la fotosíntesis hasta que otro factor se volvió limitante","L2Q03"],["Una hoja pierde agua y sus células oclusivas hacen que los estomas se cierren. ¿Qué cambio inmediato es más probable?",["Disminuye la entrada de CO₂ y puede bajar la fotosíntesis","Aumenta la entrada de CO₂ y se duplica la fotosíntesis","Se impide que el agua llegue desde las raíces","Se acelera necesariamente la producción de oxígeno"],"Disminuye la entrada de CO₂ y puede bajar la fotosíntesis","L2Q04"],["Se coloca una hoja variegada (con zonas verdes y blancas) a la luz y luego se prueba la presencia de almidón. ¿Qué resultado se espera?",["Más almidón en las zonas verdes que contienen clorofila","Más almidón en las zonas blancas que carecen de clorofila","La misma cantidad en toda la hoja, sin importar el color","Almidón únicamente en las nervaduras"],"Más almidón en las zonas verdes que contienen clorofila","L2Q05"],["Una planta se mantiene a oscuras durante varios días, con agua y aire disponibles. ¿Qué cambio es más probable en sus reservas de almidón?",["Disminuyen porque se utilizan azúcares almacenados y no se reponen por fotosíntesis","Aumentan porque la oscuridad acelera la fotosíntesis","No cambian porque el almidón no puede degradarse","Se transforman directamente en clorofila"],"Disminuyen porque se utilizan azúcares almacenados y no se reponen por fotosíntesis","L2Q06"],["Se encierra una planta iluminada dentro de un recipiente transparente sellado. Si hay suficiente luz, ¿qué cambio puede ocurrir al principio en el aire del recipiente?",["Disminuye el CO₂ y aumenta el O₂","Aumenta el CO₂ y disminuye el O₂","Aumentan a la vez el CO₂ y el O₂ sin límite","Desaparecen todos los gases de inmediato"],"Disminuye el CO₂ y aumenta el O₂","L2Q07"],["En un experimento se añade agua con bicarbonato a una planta acuática. ¿Por qué puede aumentar su producción de oxígeno bajo luz?",["El bicarbonato puede aportar carbono inorgánico disponible para la fotosíntesis","El bicarbonato sustituye a la clorofila","El bicarbonato convierte oxígeno en luz","El bicarbonato hace innecesaria el agua"],"El bicarbonato puede aportar carbono inorgánico disponible para la fotosíntesis","L2Q08"],["Una hoja recibe luz y dióxido de carbono, pero sus vasos conductores están dañados y casi no llega agua. ¿Qué consecuencia se espera?",["La fotosíntesis disminuye porque falta agua y puede alterarse el funcionamiento celular","La producción de glucosa aumenta porque se concentra el CO₂","La hoja libera oxígeno indefinidamente","El daño no afecta porque el agua no participa en la fotosíntesis"],"La fotosíntesis disminuye porque falta agua y puede alterarse el funcionamiento celular","L2Q09"],["En un gráfico, la tasa fotosintética aumenta con la concentración de CO₂ y luego alcanza una meseta. ¿Qué explica mejor la meseta?",["Otro factor, como la luz o la temperatura, limita ahora la tasa","La planta ha dejado de necesitar enzimas","El CO₂ se transforma en clorofila","La concentración medida necesariamente disminuyó"],"Otro factor, como la luz o la temperatura, limita ahora la tasa","L2Q10"],["Una persona cubre con papel opaco parte de una hoja y deja el resto expuesto a la luz. ¿Qué se espera tras una prueba de almidón?",["La parte iluminada dará positivo con más claridad que la cubierta","La parte cubierta producirá más almidón porque conserva humedad","Ambas partes producirán igual almidón aunque una no reciba luz","Solo la parte cubierta liberará oxígeno"],"La parte iluminada dará positivo con más claridad que la cubierta","L2Q11"],["Una planta de sombra se traslada gradualmente a un lugar más luminoso. Al principio aumenta su tasa fotosintética. ¿Qué interpretación es adecuada?",["La luz era un factor limitante en las condiciones iniciales","La cantidad de cloroplastos necesariamente se redujo","El dióxido de carbono dejó de ser necesario","La planta comenzó a producir glucosa sin fijar carbono"],"La luz era un factor limitante en las condiciones iniciales","L2Q12"],["En una habitación iluminada, las hojas de una planta intercambian gases. ¿Qué combinación describe el flujo neto habitual cuando la fotosíntesis supera a la respiración?",["Entra CO₂ y sale O₂","Entra O₂ y sale CO₂","Entran CO₂ y O₂, sin salida de gases","Salen CO₂ y O₂ en la misma cantidad"],"Entra CO₂ y sale O₂","L2Q13"],["Se observa una planta durante la noche. Aunque no haya fotosíntesis, sus células siguen vivas y respirando. ¿Qué intercambio gaseoso neto se espera entonces?",["Entrada de O₂ y salida de CO₂","Entrada de CO₂ y salida de O₂","Entrada y salida exclusivas de glucosa","Ningún intercambio en absoluto"],"Entrada de O₂ y salida de CO₂","L2Q14"],["Una planta recibe mucha luz, pero el aire está muy frío. ¿Por qué la tasa fotosintética puede seguir siendo baja?",["Las reacciones enzimáticas pueden ralentizarse a baja temperatura","El frío convierte los cloroplastos en raíces","La luz deja de transportar energía en aire frío","El dióxido de carbono se vuelve oxígeno automáticamente"],"Las reacciones enzimáticas pueden ralentizarse a baja temperatura","L2Q15"],["¿Qué efecto cabe esperar si una planta recibe luz con una intensidad excesiva que daña sus tejidos fotosintéticos?",["La fotosíntesis puede disminuir por daño fotooxidativo","La producción de glucosa aumenta sin límite","Se elimina la necesidad de agua","Los estomas se convierten en cloroplastos"],"La fotosíntesis puede disminuir por daño fotooxidativo","L2Q16"],["Una plántula crece en un medio sin minerales esenciales, aunque recibe agua y luz. ¿Qué efecto pueden tener esas carencias?",["Pueden limitar el desarrollo de clorofila, enzimas o tejidos y reducir la fotosíntesis","Aseguran una fotosíntesis más rápida porque hay menos sales","Permiten que la planta obtenga carbono de los minerales","No influyen en el crecimiento ni en la fotosíntesis"],"Pueden limitar el desarrollo de clorofila, enzimas o tejidos y reducir la fotosíntesis","L2Q17"],["Se compara una hoja gruesa con una hoja delgada usando el mismo ambiente luminoso. ¿Qué ventaja funcional puede ofrecer el tejido interno con espacios de aire?",["Facilita la difusión de gases dentro de la hoja","Fabrica luz para las células profundas","Impide que el CO₂ alcance las células fotosintéticas","Transporta glucosa directamente desde el aire"],"Facilita la difusión de gases dentro de la hoja","L2Q18"],["Una planta produce glucosa en sus hojas y la transporta hacia raíces que no reciben luz. ¿Para qué pueden usarla las células de la raíz?",["Para obtener energía mediante respiración y fabricar otros compuestos","Para captar luz con clorofila en la oscuridad","Para liberar carbono y formar dióxido de carbono en la fotosíntesis","Para reemplazar toda el agua absorbida"],"Para obtener energía mediante respiración y fabricar otros compuestos","L2Q19"],["Una planta tiene estomas abiertos y está bajo luz intensa, pero el aire contiene poco CO₂. ¿Qué factor limita más directamente la fijación de carbono?",["La baja disponibilidad de CO₂","La salida de oxígeno por los estomas","La entrada de luz a los tilacoides","La presencia de células oclusivas"],"La baja disponibilidad de CO₂","L2Q20"],["Al medir el gas de una planta acuática iluminada, se comprueba que reaviva una astilla incandescente. ¿Qué conclusión es más probable?",["El gas contiene oxígeno","El gas es dióxido de carbono puro","El gas es nitrógeno","El gas es vapor de agua únicamente"],"El gas contiene oxígeno","L2Q21"],["Un estudiante detecta glucosa en una hoja al final del día. ¿Qué explicación relaciona correctamente su producción con el transporte de carbono?",["El carbono del CO₂ se incorpora a moléculas orgánicas durante la fotosíntesis","La hoja convierte directamente oxígeno del aire en glucosa","La glucosa se forma exclusivamente a partir de minerales del suelo","La clorofila se transforma por completo en glucosa"],"El carbono del CO₂ se incorpora a moléculas orgánicas durante la fotosíntesis","L2Q22"],["Una planta crece bajo una lámpara que emite principalmente luz verde. ¿Por qué puede fotosintetizar menos que bajo una lámpara roja de igual intensidad?",["La clorofila refleja gran parte de la luz verde y absorbe mejor la roja","La luz verde no tiene energía y la roja sí","El color verde bloquea físicamente los estomas","La clorofila absorbe solo radiación verde"],"La clorofila refleja gran parte de la luz verde y absorbe mejor la roja","L2Q23"],["Una hoja iluminada produce ATP y NADPH en sus reacciones luminosas. ¿Para qué se emplean principalmente esas moléculas en el ciclo de Calvin?",["Para aportar energía y poder reductor en la síntesis de compuestos orgánicos","Para abrir los estomas de forma mecánica","Para absorber dióxido de carbono directamente del aire","Para convertir glucosa en luz"],"Para aportar energía y poder reductor en la síntesis de compuestos orgánicos","L2Q24"],["Si se inhibe la producción de ATP en los tilacoides, ¿qué consecuencia indirecta es más probable para el ciclo de Calvin?",["Disminuye su actividad porque recibe menos energía química","Aumenta porque acumula más luz en el estroma","Continúa a velocidad normal porque no necesita energía","Se desplaza desde el estroma hacia las raíces"],"Disminuye su actividad porque recibe menos energía química","L2Q25"],["Una planta cultivada con abundante CO₂ presenta una tasa fotosintética mayor que otra, pero ambas alcanzan pronto el mismo máximo al incrementar la luz. ¿Qué factor puede estar limitando entonces?",["La capacidad de procesamiento bioquímico u otro recurso, como la temperatura","La ausencia total de carbono en la planta","La imposibilidad de absorber luz en los cloroplastos","La falta de oxígeno como reactivo fotosintético"],"La capacidad de procesamiento bioquímico u otro recurso, como la temperatura","L2Q26"],["En una hoja iluminada, la velocidad de producción de oxígeno aumenta al abrirse los estomas. ¿Cuál es la explicación más directa?",["Entra más CO₂ para sostener la fotosíntesis","Entra más glucosa desde la atmósfera","Sale menos vapor de agua y eso produce oxígeno","Los estomas fabrican oxígeno en sus células"],"Entra más CO₂ para sostener la fotosíntesis","L2Q27"],["Se compara la cantidad de almidón de una hoja antes y después de varias horas de luz. ¿Qué resultado apoyaría que hubo fotosíntesis neta?",["Un aumento de almidón al final del periodo","Una desaparición completa de los cloroplastos","Una disminución de CO₂ dentro de los granos de almidón","La ausencia de cambios en cualquier componente"],"Un aumento de almidón al final del periodo","L2Q28"],["Una planta se coloca en una campana transparente iluminada junto a una solución que absorbe CO₂. ¿Qué resultado se espera frente a una planta control sin esa solución?",["Menor acumulación de materia orgánica en la planta con menos CO₂ disponible","Mayor fijación de carbono en la planta con menos CO₂","Producción idéntica de glucosa porque el CO₂ no interviene","Más oxígeno consumido como reactivo fotosintético"],"Menor acumulación de materia orgánica en la planta con menos CO₂ disponible","L2Q29"],["En un experimento, una planta iluminada produce O₂, mientras otra idéntica está en oscuridad y no lo produce de forma neta. ¿Qué variable se está evaluando principalmente?",["La dependencia de la producción neta de oxígeno respecto de la luz","La función del suelo en la absorción de nitrógeno","La capacidad de las raíces para fabricar clorofila","La conversión de almidón en dióxido de carbono por animales"],"La dependencia de la producción neta de oxígeno respecto de la luz","L2Q30"]],[["Según la ecuación 6 CO₂ + 6 H₂O → C₆H₁₂O₆ + 6 O₂, ¿cuántas moléculas de CO₂ se requieren para formar una molécula de glucosa?",["6","1","12","18"],"6","L3Q01"],["Si se consumen 18 moléculas de CO₂ y hay agua y luz suficientes, ¿cuántas moléculas de glucosa pueden formarse como máximo según la ecuación global?",["3","6","9","18"],"3","L3Q02"],["Una planta fija 24 moles de CO₂ en condiciones ideales. ¿Cuántos moles de O₂ se liberan según la ecuación balanceada?",["24 mol","4 mol","6 mol","48 mol"],"24 mol","L3Q03"],["Un experimento registra 12 unidades de oxígeno producidas por una planta y 5 unidades consumidas por respiración durante el mismo periodo. ¿Cuál es la producción neta de oxígeno?",["7 unidades","17 unidades","12 unidades","5 unidades"],"7 unidades","L3Q04"],["Una planta incorpora 30 g de CO₂ durante un intervalo y libera 20 g de CO₂ por respiración. ¿Cuál es el cambio neto en el CO₂ del aire debido a la planta?",["Disminuye en 10 g","Aumenta en 10 g","Disminuye en 50 g","No cambia"],"Disminuye en 10 g","L3Q05"],["Un registro muestra tasas de producción de O₂ de 2, 5, 8 y 8 unidades por minuto cuando la luz aumenta progresivamente. ¿Cuál es la mejor interpretación de que las dos últimas tasas sean iguales?",["La respuesta alcanzó una meseta y otro factor puede limitarla","La fotosíntesis desapareció en la última medición","La planta consumió exactamente todo el CO₂","La intensidad luminosa disminuyó necesariamente"],"La respuesta alcanzó una meseta y otro factor puede limitarla","L3Q06"],["Una hoja produce 15 µmol de glucosa por hora en una cámara con CO₂ normal y 9 µmol por hora al reducir el CO₂. ¿En qué porcentaje disminuyó la producción?",["40 %","6 %","60 %","25 %"],"40 %","L3Q07"],["Una planta tiene una tasa fotosintética de 4 unidades en oscuridad y de 13 unidades con luz. Si la tasa oscura representa respiración que consume O₂ y la medición luminosa es producción bruta, ¿cuál es la tasa neta en luz?",["9 unidades","17 unidades","4 unidades","13 unidades"],"9 unidades","L3Q08"],["Una hoja expuesta produce 10 mg de almidón y una zona cubierta produce 2 mg durante el mismo experimento. ¿Qué diferencia de producción se asocia con la exposición a la luz?",["8 mg","12 mg","5 mg","2 mg"],"8 mg","L3Q09"],["En una planta, la iluminación pasa de 100 a 200 unidades y la tasa fotosintética permanece en 6 unidades. El CO₂ es bajo. ¿Cuál es la explicación más probable?",["El CO₂ limita la tasa y aumentar la luz no resuelve esa limitación","La luz ya no participa en la fotosíntesis","La planta ha dejado de respirar","El oxígeno se convirtió en el único reactivo disponible"],"El CO₂ limita la tasa y aumentar la luz no resuelve esa limitación","L3Q10"],["Una planta bajo luz muy intensa presenta hojas blanqueadas y una caída de la fijación de carbono. ¿Qué hipótesis explica mejor el caso?",["El exceso de luz dañó pigmentos o componentes fotosintéticos","La planta agotó el nitrógeno del aire en minutos","La luz intensa convirtió todos los estomas en raíces","El aumento de luz eliminó el carbono de la glucosa"],"El exceso de luz dañó pigmentos o componentes fotosintéticos","L3Q11"],["Un cultivo muestra estomas cerrados durante una sequía, menor entrada de CO₂ y menor producción de biomasa. ¿Qué cadena causal explica mejor los datos?",["Sequía → cierre estomático → menor entrada de CO₂ → menor fotosíntesis","Sequía → apertura estomática → menor entrada de luz → más glucosa","Cierre estomático → mayor entrada de CO₂ → menor crecimiento","Sequía → producción de oxígeno → acumulación de almidón"],"Sequía → cierre estomático → menor entrada de CO₂ → menor fotosíntesis","L3Q12"],["En un ambiente sellado e iluminado, una planta consume CO₂ con rapidez al principio, pero su tasa fotosintética cae conforme pasan las horas. ¿Cuál es la causa más probable?",["Se agota el CO₂ disponible en el recipiente","La planta convierte toda la luz en agua","El oxígeno producido impide por completo la respiración","La glucosa impide que los cloroplastos absorban agua"],"Se agota el CO₂ disponible en el recipiente","L3Q13"],["Un investigador quiere comprobar si el CO₂ es necesario para formar almidón en una hoja. ¿Qué diseño ofrece la comparación más adecuada?",["Mantener hojas equivalentes iluminadas, pero privar de CO₂ solo a una y comparar su almidón","Colocar ambas hojas en oscuridad y medir su color","Dar distinta cantidad de agua y luz a cada hoja","Comparar una hoja verde con una raíz sin controlar otras variables"],"Mantener hojas equivalentes iluminadas, pero privar de CO₂ solo a una y comparar su almidón","L3Q14"],["Para probar que la luz es necesaria para que una hoja acumule almidón, ¿qué control experimental es más apropiado?",["Comparar partes equivalentes de una misma hoja, iluminada y cubierta, manteniendo iguales las demás condiciones","Comparar una hoja húmeda con una raíz seca","Medir solo una hoja sin registrar sus condiciones","Dejar las dos muestras sin agua y con intensidades distintas"],"Comparar partes equivalentes de una misma hoja, iluminada y cubierta, manteniendo iguales las demás condiciones","L3Q15"],["En un experimento, se libera O₂ marcado con isótopo cuando la planta recibe agua marcada, pero no cuando solo se marca el CO₂. ¿Qué conclusión apoya el resultado?",["Los átomos de oxígeno del O₂ liberado proceden del agua","El carbono del O₂ liberado procede de la glucosa","El agua no interviene en la fotosíntesis","El CO₂ es la fuente directa del O₂ liberado"],"Los átomos de oxígeno del O₂ liberado proceden del agua","L3Q16"],["Un cloroplasto aislado puede realizar reacciones luminosas, pero falla en la fijación de CO₂ porque perdió sus enzimas del estroma. ¿Qué producto de las reacciones luminosas podría aún formar?",["ATP y NADPH","Glucosa directamente a partir de CO₂","Almidón sin carbono","Celulosa sin energía"],"ATP y NADPH","L3Q17"],["Una sustancia bloquea el flujo de electrones en los tilacoides. ¿Qué efecto en cadena se espera sobre el ciclo de Calvin?",["Menor producción de ATP y NADPH, por lo que disminuye la fijación de carbono","Mayor suministro de ATP y aceleración del ciclo","Producción directa de glucosa en los tilacoides sin cambios","El ciclo de Calvin se desplaza al núcleo y sigue igual"],"Menor producción de ATP y NADPH, por lo que disminuye la fijación de carbono","L3Q18"],["Una mutación reduce la cantidad de clorofila, pero no afecta la estructura de los estomas. ¿Qué efecto inicial es más probable?",["Se capta menos energía luminosa y puede disminuir la fotosíntesis","Se detiene la entrada de CO₂ porque los estomas desaparecen","Aumenta necesariamente la formación de glucosa","Se impide que las raíces absorban agua"],"Se capta menos energía luminosa y puede disminuir la fotosíntesis","L3Q19"],["Una planta enferma tiene una superficie foliar reducida a la mitad, mientras las hojas restantes funcionan normalmente. ¿Qué efecto puede tener esto en la producción total de azúcares?",["Puede disminuir porque hay menos área disponible para captar luz e intercambiar gases","Se duplica porque cada hoja compensa automáticamente","No cambia nunca, ya que solo las raíces fotosintetizan","Aumenta porque la planta tiene menos hojas que mantener"],"Puede disminuir porque hay menos área disponible para captar luz e intercambiar gases","L3Q20"],["En una cámara, una planta produce 18 µmol de O₂ por hora con luz y consume 3 µmol por hora por respiración. ¿Cuál es su producción neta de O₂?",["15 µmol por hora","21 µmol por hora","18 µmol por hora","6 µmol por hora"],"15 µmol por hora","L3Q21"],["Una planta produce 2 mol de glucosa en condiciones ideales. Según la ecuación global, ¿cuántos moles de agua se consumieron como reactivo?",["12 mol","2 mol","6 mol","24 mol"],"12 mol","L3Q22"],["Una planta forma 3 moles de glucosa según la ecuación global balanceada. ¿Cuántos moles de O₂ se producen?",["18 mol","3 mol","9 mol","6 mol"],"18 mol","L3Q23"],["Una planta fijó 12 mol de CO₂ y sintetizó 2 mol de glucosa; los otros 12 mol de CO₂ quedaron fijados en productos orgánicos distintos. ¿Cuántos moles de carbono quedaron incorporados en total?",["12 mol de átomos de carbono","2 mol de átomos de carbono","6 mol de átomos de carbono","24 mol de átomos de carbono"],"12 mol de átomos de carbono","L3Q24"],["Un cultivo produce 50 kg de biomasa seca en una parcela iluminada y 30 kg en una parcela sombreada, con otras condiciones iguales. ¿Cuál es la diferencia de biomasa entre las parcelas?",["20 kg","80 kg","25 kg","30 kg"],"20 kg","L3Q25"],["La tasa fotosintética medida a 10 °C, 20 °C y 30 °C es de 3, 7 y 10 unidades; a 40 °C cae a 4 unidades. ¿Qué explicación concuerda mejor con estos datos?",["La temperatura favoreció la tasa hasta un intervalo óptimo, pero el calor alto la perjudicó","La fotosíntesis aumenta siempre de forma lineal con la temperatura","A 40 °C la planta dejó de necesitar agua","El descenso demuestra que la luz se volvió insuficiente"],"La temperatura favoreció la tasa hasta un intervalo óptimo, pero el calor alto la perjudicó","L3Q26"],["Una especie de planta de clima seco mantiene tasas fotosintéticas relativamente altas con los estomas abiertos durante periodos breves y los cierra en las horas más calurosas. ¿Qué ventaja obtiene?",["Reduce la pérdida de agua y aprovecha periodos favorables para captar CO₂","Evita toda respiración celular","Produce glucosa sin usar dióxido de carbono","Impide que la luz alcance los cloroplastos"],"Reduce la pérdida de agua y aprovecha periodos favorables para captar CO₂","L3Q27"],["Un análisis muestra que una planta acumula menos almidón por la noche, aunque no hay luz. ¿Qué explicación resuelve mejor esta observación?",["La planta degrada almidón para obtener azúcares que usa en respiración y otros procesos","La fotosíntesis nocturna consume almidón para producir más almidón","El almidón se transforma en dióxido de carbono sin intervención celular","La planta absorbe almidón directamente del aire nocturno"],"La planta degrada almidón para obtener azúcares que usa en respiración y otros procesos","L3Q28"],["Un tratamiento bloquea el ciclo de Calvin, pero deja intacta la captación de luz durante unos minutos. ¿Qué cambio es más probable?",["Se reduce la síntesis de azúcares y el uso de ATP y NADPH para fijar carbono","Aumenta la fijación de CO₂ porque se acumula glucosa","Se detiene de inmediato toda absorción de luz por la clorofila","El oxígeno liberado pasa a ser la fuente de carbono"],"Se reduce la síntesis de azúcares y el uso de ATP y NADPH para fijar carbono","L3Q29"],["Dos plantas idénticas reciben la misma luz y temperatura. Una tiene CO₂ abundante y agua suficiente; la otra tiene CO₂ abundante, pero carece de agua. ¿Cuál es la predicción mejor fundamentada?",["La primera tendrá mayor fotosíntesis porque el agua es un reactivo y su falta afecta el proceso","La segunda tendrá mayor fotosíntesis porque el CO₂ reemplaza al agua","Ambas tendrán tasas iguales porque solo la luz determina la fotosíntesis","La segunda liberará más O₂ porque no utiliza agua"],"La primera tendrá mayor fotosíntesis porque el agua es un reactivo y su falta afecta el proceso","L3Q30"]]];
const KEY='biology_fotosintesis_progress_v5';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
