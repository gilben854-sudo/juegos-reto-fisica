<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Símbolos y nombres — Química</title><style>
:root{--bg:#07111f;--card:#102238;--line:#24425f;--text:#e6f0fa;--muted:#a7bfd4;--accent:#34d399;--gold:#fbbf24;--bad:#f87171}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#123b45,#07111f 55%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}header{padding:24px 16px;text-align:center;border-bottom:1px solid var(--line)}header h1{margin:0;color:#6ee7b7;font-size:1.6rem}header p{color:var(--muted);margin:8px 0 0}main{max-width:760px;margin:0 auto;padding:18px 16px 48px}.card{background:rgba(16,34,56,.95);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 12px 30px #0003}label{display:block;color:#cde1ef;font-weight:700;font-size:.9rem;margin:10px 0 5px}input{width:100%;padding:12px;border:2px solid #42627c;border-radius:10px;background:#f8fafc;color:#0f172a;font-size:1rem}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;font-size:.95rem}.primary{background:#059669;color:white;width:100%;margin-top:14px}.choice{display:block;width:100%;text-align:left;background:#173452;color:var(--text);border:2px solid #315878;margin:9px 0}.choice:hover{border-color:var(--accent)}.choice.correct{background:#14532d;border-color:#4ade80}.choice.wrong{background:#5b1d28;border-color:#f87171}.hidden{display:none}.muted{color:var(--muted);line-height:1.5}.progress{height:10px;background:#183047;border-radius:99px;overflow:hidden;margin:12px 0 18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#fbbf24);width:0;transition:.25s}.score{color:#fbbf24;font-weight:800}.result{text-align:center;font-size:1.2rem}.certificate{border:2px solid var(--gold);padding:18px;border-radius:14px;margin-top:14px;background:#302511}a{color:#6ee7b7}
</style></head><body><header><h1>Símbolos y nombres</h1><p>Juego de Química · Aprende resolviendo retos</p></header><main><section id="setup" class="card"><h2>Identificación</h2><p class="muted">Escribe tu nombre y sección para guardar tu progreso en este juego.</p><label>Tu sección</label><input id="section" placeholder="Ejemplo: A" autocomplete="organization-section"><label>Tu nombre</label><input id="name" placeholder="Nombre y apellido" autocomplete="name"><button class="primary" id="start">Comenzar reto</button></section><section id="game" class="card hidden"><div><span>Pregunta <b id="num">1</b>/5</span> · <span class="score">Puntos: <b id="score">0</b></span></div><div class="progress"><i id="bar"></i></div><h2 id="question"></h2><div id="choices"></div><p id="feedback" class="muted"></p><button class="primary hidden" id="next">Siguiente</button></section><section id="result" class="card hidden"></section></main><script>
const BANK=[["¿Cuál es el nombre de K?",["Potasio","Kriptón","Calcio","Cobalto"],"Potasio"],["¿Cuál es el símbolo de la plata?",["Pt","Ag","Au","Al"],"Ag"],["¿Qué elemento representa Cl?",["Calcio","Cloro","Carbono","Cobalto"],"Cloro"],["¿Cuál es el símbolo del oro?",["Or","Au","Ag","Os"],"Au"],["¿Qué elemento representa Mg?",["Manganeso","Magnesio","Mercurio","Molibdeno"],"Magnesio"],["¿Cuál es el símbolo del nitrógeno?",["N","Ni","Na","Ne"],"N"]];const KEY='chemistry_simbolos-elementos_progress_v1';let name='',section='',score=0,current=0,order=[];
const $=id=>document.getElementById(id);function mix(a){return [...a].sort(()=>Math.random()-.5)}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}localStorage.setItem(KEY,JSON.stringify({name,section,score:0}));$('setup').classList.add('hidden');$('game').classList.remove('hidden');order=mix(BANK).slice(0,5);render()}
function render(){const q=order[current];$('num').textContent=current+1;$('score').textContent=score;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);if(c===correct){score++;btn.classList.add('correct');$('feedback').textContent='¡Correcto!'}else{btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').textContent='La respuesta correcta es: '+correct}$('score').textContent=score;$('next').classList.remove('hidden')}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5)finish();else render()};
function finish(){localStorage.setItem(KEY,JSON.stringify({name,section,score}));$('game').classList.add('hidden');$('result').classList.remove('hidden');const grade=Math.round(score*4);$('result').innerHTML=`<div class="result"><h2>Reto completado</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Resultado: ${score}/5 · Nota: ${grade}/20</p><div class="certificate"><b>Logro de Química</b><br>Símbolos y nombres<br><small>Participante: ${name} · Sección: ${section}</small></div><button class="primary" onclick="location.reload()">Intentar nuevamente</button></div>`}
</script></body></html>
