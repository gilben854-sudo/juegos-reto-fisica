<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Juegos de Reto — Misión MRUV</title>
<style>
  html { color-scheme: light only; }
  button, input, select, textarea {
    -webkit-appearance: none; appearance: none; color-scheme: light only;
  }
  :root{
    --navy:#1F4E79; --blue:#2E75B6; --lightblue:#DEEAF6;

  html,body{

    font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:#f8fafc;
    color:var(--text);

  }
  input,textarea,select{-webkit-user-select:text!important;user-select:text!important;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:#F7F9FC;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,0.35);overflow-anchor:none;}

  header{background:#2d1b4e;color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}

  .icon-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;}

  .btn-primary{background:var(--orange);}

  .btn-outline{background:#fff;color:#2d1b4e;border:2px solid #2d1b4e;}
  .btn-success{background:var(--green);}
  .feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.5;}
  .feedback.ok{background:#E7F6EC;color:#1E7A44;border:1px solid #bfe6cc;}

  .sim-track{position:relative;height:46px;background:var(--gray);border-radius:8px;margin:14px 0 16px;overflow:hidden;border:1px solid #e2e6ea;}
  .sim-track .marker{position:absolute;top:0;bottom:0;width:1px;background:#d3dae1;}
  .sim-track .marker span{position:absolute;bottom:2px;left:2px;font-size:9px;color:#9AA7B2;}
  .sim-car{position:absolute;top:8px;width:30px;height:30px;line-height:30px;text-align:center;font-size:18px;transform:translateX(-15px);z-index:2;}

  .sim-readout .c-t{color:#455364;}

  .sim-readout .c-a{color:#2E9E5B;}

  .ctrl-x input[type=range]::-webkit-slider-thumb{border-color:#C45C1A;}

  .ctrl-a input[type=range]::-moz-range-thumb{border-color:#2E9E5B;}

    background:#fff;border-radius:10px;padding:8px 12px;margin-bottom:10px;border:1px solid #e6ecf2;}

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function choice(arr){return arr[randInt(0,arr.length-1)];}
function fmt(n){const r=Math.round(n*100)/100;return Number.isInteger(r)?String(r):r.toFixed(2).replace(/0+$/,"").replace(/\.$/,"");}
function closeEnough(a,b,tol){return Math.abs(a-b)<=tol;}

/* ---- Generadores MRUV ---- */
function genL0(){
  // a = (v - v0) / t
  const v0=choice([0,2,4,5,8,10]);
  const a=choice([1,2,2.5,3,4,5]);
  const t=choice([2,3,4,5,6]);
  const v=v0+a*t;
  return {
    tag:"¿Cuál es la aceleración?",
    formula:"a = (v − v₀) / t",
    text:`Un móvil parte con velocidad <b>${v0} m/s</b> y al cabo de <b>${t} s</b> alcanza <b>${fmt(v)} m/s</b>. ¿Cuál es su aceleración?`,
    unit:"m/s²", answer:a, tol:0.08,
    steps:`a = (v − v₀) / t = (${fmt(v)} − ${v0}) / ${t} = ${fmt(a)} m/s²`
  };
}
function genL1(){
  // v = v0 + a t
  const v0=choice([0,2,4,5,8,10,12]);
  const a=choice([1,1.5,2,2.5,3,4]);
  const t=choice([2,3,4,5,6,8]);
  const v=v0+a*t;
  return {
    tag:"Velocidad final",
    formula:"v = v₀ + a·t",
    text:`Un auto arranca con <b>v₀ = ${v0} m/s</b> y acelera a <b>${fmt(a)} m/s²</b> durante <b>${t} s</b>. ¿Qué velocidad final alcanza?`,
    unit:"m/s", answer:v, tol:0.1,
    steps:`v = v₀ + a·t = ${v0} + (${fmt(a)})(${t}) = ${fmt(v)} m/s`
  };
}
function genL2(){
  // d = v0 t + 0.5 a t^2
  const v0=choice([0,2,4,5,6,8]);
  const a=choice([1,2,2,3,4]);
  const t=choice([2,3,4,5]);
  const d=v0*t+0.5*a*t*t;
  return {
    tag:"Distancia en MRUV",
    formula:"d = v₀·t + ½·a·t²",
    text:`Un móvil parte con <b>v₀ = ${v0} m/s</b> y acelera a <b>${a} m/s²</b> durante <b>${t} s</b>. ¿Qué distancia recorre?`,
    unit:"m", answer:d, tol:Math.max(0.15, Math.abs(d)*0.02),
    steps:`d = v₀·t + ½·a·t² = (${v0})(${t}) + ½(${a})(${t})² = ${v0*t} + ${0.5*a*t*t} = ${fmt(d)} m`
  };
}
function genL3(){
  // v² = v0² + 2 a d  → find v or a or d
  const kind=choice(["v","a","d"]);
  const v0=choice([0,2,4,5,6]);
  const a=choice([1,2,2.5,3,4]);
  const d=choice([4,8,9,12,16,18,25]);
  const v2=v0*v0+2*a*d;
  const v=Math.sqrt(v2);
  if(kind==="v"){
    return {
      tag:"Velocidad sin tiempo",
      formula:"v² = v₀² + 2·a·d",
      text:`Parte con <b>v₀ = ${v0} m/s</b>, acelera a <b>${fmt(a)} m/s²</b> y recorre <b>${d} m</b>. ¿Qué velocidad final tiene?`,
      unit:"m/s", answer:v, tol:0.15,
      steps:`v² = v₀² + 2·a·d = ${v0}² + 2(${fmt(a)})(${d}) = ${fmt(v2)}\nv = √${fmt(v2)} = ${fmt(v)} m/s`
    };
  }
  if(kind==="a"){
    // choose nice numbers so a is clean
    const v0b=choice([0,2,4]);
    const vb=choice([6,8,10,12]);
    const db=choice([8,9,12,16,18]);
    const ab=(vb*vb-v0b*v0b)/(2*db);
    return {
      tag:"Aceleración sin tiempo",
      formula:"a = (v² − v₀²) / (2·d)",
      text:`Un móvil pasa de <b>${v0b} m/s</b> a <b>${vb} m/s</b> en <b>${db} m</b>. ¿Cuál fue su aceleración?`,
      unit:"m/s²", answer:ab, tol:0.12,
      steps:`a = (v² − v₀²) / (2·d) = (${vb}² − ${v0b}²) / (2·${db}) = ${vb*vb-v0b*v0b} / ${2*db} = ${fmt(ab)} m/s²`
    };
  }
  // find d
  const v0c=choice([0,2,4,5]);
  const vc=choice([8,10,12,14]);
  const ac=choice([1,2,2.5,4]);
  const dc=(vc*vc-v0c*v0c)/(2*ac);
  return {
    tag:"Distancia sin tiempo",
    formula:"d = (v² − v₀²) / (2·a)",
    text:`Pasa de <b>${v0c} m/s</b> a <b>${vc} m/s</b> con a = <b>${fmt(ac)} m/s²</b>. ¿Qué distancia recorre?`,
    unit:"m", answer:dc, tol:Math.max(0.15, Math.abs(dc)*0.02),
    steps:`d = (v² − v₀²) / (2·a) = (${vc}² − ${v0c}²) / (2·${fmt(ac)}) = ${vc*vc-v0c*v0c} / ${2*ac} = ${fmt(dc)} m`
  };
}
function genL4(){
  const pick=randInt(0,3);
  if(pick===0) return genL0();
  if(pick===1) return genL1();
  if(pick===2) return genL2();
  return genL3();
}
const GENERATORS=[genL0,genL1,genL2,genL3,genL4];

function renderQuestion(){
  const lv=LEVELS[session.levelId];
  const p=session.currentProblem;
  setHeader(lv.title,"Pregunta "+(session.qIndex+1)+" / "+QUESTIONS_PER_LEVEL,true);
  document.getElementById("tabbar").classList.add("hidden");
  let dots="";
  for(let i=0;i<QUESTIONS_PER_LEVEL;i++){
    let cls="dot";
    if(i===session.qIndex) cls+=" current";
    else if(session.results[i]===true) cls+=" done-correct";
    else if(session.results[i]===false) cls+=" done-wrong";
    dots+=`<div class="${cls}"></div>`;
  }
  document.getElementById("main").innerHTML=`
    <div class="progress-dots">${dots}</div>
    <span class="score-pill">Puntos del nivel: ${session.levelPoints||0}</span>
    <div class="question-card">
      <div class="question-tag">${p.tag}</div>
      ${p.formula?`<div class="formula-hint">Fórmula guía: <b>${p.formula}</b></div>`:""}
      <div class="question-text">${p.text}</div>
      <div class="lives-bar"><span>Pregunta <b>${session.qIndex+1}</b> / ${QUESTIONS_PER_LEVEL}</span><span id="livesDisplay">${"❤️".repeat(session.lives||3)}</span></div>
      <div class="answer-row">
        <button type="button" class="btn-sign" id="signBtn" aria-label="Signo negativo">−</button>
        <input type="text" id="answerInput" inputmode="decimal" placeholder="Solo números" autocomplete="off" enterkeyhint="done">
        <span class="unit-label">${p.unit}</span>
      </div>
      <button type="button" class="btn-negative" id="negBtn">Tocar aquí si el resultado es NEGATIVO (−)</button>
      <p style="font-size:0.78rem;color:#7a8a99;margin:4px 0 8px;text-align:center;">En iPhone usa el botón <b>−</b> o el de abajo.</p>
      <button class="btn btn-primary" id="checkBtn">Verificar</button>
      <div id="feedbackArea"></div>
    </div>`;
  document.getElementById("checkBtn").onclick=checkAnswer;
  const ansInput=document.getElementById("answerInput");
  const signBtn=document.getElementById("signBtn");
  const negBtn=document.getElementById("negBtn");
  function syncNegUI(){
    const v=(ansInput.value||"").trim();
    const isNeg=v.startsWith("-")||v.startsWith("−");
    ansInput.classList.toggle("is-neg", isNeg);
    if(negBtn){
      negBtn.classList.toggle("is-neg", isNeg);
      negBtn.textContent=isNeg?"Resultado NEGATIVO activado (tocar para quitar)":"Tocar aquí si el resultado es NEGATIVO (−)";
    }
  }
  function toggleNegative(){
    let v=(ansInput.value||"").trim().replace(/−/g,"-").replace(",",".");
    if(!v||v==="-") ansInput.value="-";
    else if(v.startsWith("-")) ansInput.value=v.slice(1);
    else ansInput.value="-"+v.replace(/^\+/,"");
    syncNegUI();
  }
  if(signBtn) signBtn.onclick=function(e){ e.preventDefault(); toggleNegative(); };
  if(negBtn) negBtn.onclick=function(e){ e.preventDefault(); toggleNegative(); };
  ansInput.addEventListener("input",()=>{
    let v=ansInput.value.replace(/−/g,"-").replace(/[^0-9.,\-]/g,"");
    v=v.replace(/(?!^)-/g,"");
    ansInput.value=v;
    syncNegUI();
  });
  ansInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter") checkAnswer(); });
  syncNegUI();
}


function launchConfetti(){
  const layer=document.createElement("div");
  layer.className="confetti-layer";
  document.body.appendChild(layer);
  const colors=["#F5A623","#E8763B","#2ECC71","#6B4C9A","#3498db","#e74c3c","#f1c40f"];
  for(let i=0;i<48;i++){
    const p=document.createElement("div");
    p.className="confetti-piece";
    p.style.left=(Math.random()*100)+"%";
    p.style.background=colors[i%colors.length];
    p.style.animationDuration=(1.4+Math.random()*1.6)+"s";
    p.style.animationDelay=(Math.random()*0.35)+"s";
    p.style.transform="rotate("+Math.random()*360+"deg)";
    if(Math.random()>0.5){ p.style.width="10px"; p.style.height="6px"; p.style.borderRadius="50%"; }
    layer.appendChild(p);
  }
  setTimeout(function(){ try{ layer.remove(); }catch(e){} }, 3200);
}
function praiseMessage(){
  const msgs=["¡Excelente!","¡Muy bien!","¡Genial!","¡Correcto!","¡Sigue así!","¡Qué crack!","¡Lo lograste!"];
  return msgs[Math.floor(Math.random()*msgs.length)];
}

function checkAnswer(){
  const input=document.getElementById("answerInput");
  const raw=(input.value||"").trim().replace(/−/g,"-").replace(",",".");
  const val=parseFloat(raw);
  const p=session.currentProblem;
  const area=document.getElementById("feedbackArea");
  if(raw===""||raw==="-"||isNaN(val)){area.innerHTML=`<div class="feedback bad">Escribe un número. Si es negativo, usa el botón − o el de abajo.</div>`;return;}
  const correct=closeEnough(val,p.answer,p.tol);
  session.results[session.qIndex]=correct;
  if(correct){
    session.levelPoints += 20*(session.levelId+1);
    launchConfetti();
  } else {
    session.lives = Math.max(0, (session.lives||3) - 1);
  }
  const pts = 20*(session.levelId+1);
  const reaction = correct
    ? `<div class="reaction-wrap"><div class="reaction-avatar">🎉</div><div class="reaction-msg ok">${praiseMessage()}</div></div>`
    : `<div class="reaction-wrap"><div class="reaction-avatar sad">😢</div><div class="reaction-msg bad">¡Ánimo! La próxima sale</div></div>`;
  const livesEl=document.getElementById("livesDisplay");
  if(livesEl) livesEl.textContent = "❤️".repeat(Math.max(session.lives||0,0)) || "💀";
  area.innerHTML=`${reaction}<div class="feedback ${correct?'ok':'bad'}">
    ${correct?`✅ ¡Correcto! +${pts} pts`:`❌ Incorrecto. Respuesta: ${fmt(p.answer)} ${p.unit}.`}
    ${!correct?`<div style="margin-top:6px;font-weight:700;">Vidas: ${"❤️".repeat(Math.max(session.lives||0,0))||"💀"} (${session.lives||0})</div>`:""}
    <div class="steps"><b>Procedimiento:</b><br>${p.steps.replace(/\n/g,"<br>")}</div>
  </div>
  <button class="btn btn-secondary" id="nextBtn">${(session.lives<=0||session.qIndex>=QUESTIONS_PER_LEVEL-1)?"Ver resultados ➜":"Siguiente pregunta ➜"}</button>`;
  document.getElementById("checkBtn").remove();
  input.disabled=true;
  const signB=document.getElementById("signBtn"); if(signB) signB.disabled=true;
  const negB=document.getElementById("negBtn"); if(negB) negB.disabled=true;
  document.getElementById("nextBtn").onclick=()=>{
    if((session.lives||0)<=0){ finishLevel(); return; }
    session.qIndex++;
    if(session.qIndex>=QUESTIONS_PER_LEVEL) finishLevel();
    else { nextQuestion(); renderQuestion(); }
  };
}

function finishLevel(){
  const correctCount=session.results.filter(Boolean).length;
  const ratio=correctCount/QUESTIONS_PER_LEVEL;
  let stars=0;
  if(ratio>=0.99) stars=3; else if(ratio>=0.8) stars=2; else if(ratio>=PASS_RATIO) stars=1;
  const passed=ratio>=PASS_RATIO;
  lastScore=session.levelPoints;
  if(passed){
    progress.stars[session.levelId]=Math.max(progress.stars[session.levelId]||0,stars);
    levelScores[session.levelId]=Math.max(levelScores[session.levelId]||0,session.levelPoints);
    saveLevelScores(); computeGrade20();
    if(session.levelId===progress.unlocked && progress.unlocked<LEVELS.length-1) progress.unlocked++;
    if(session.levelId===LEVELS.length-1) progress.completedAllLevels=true;
    saveProgress(progress);
  }
  if(stars>=3) lastBadge="🏆 Excelente";
  else if(stars>=2) lastBadge="🥈 Muy bien";
  else if(passed) lastBadge="🥉 Nivel superado";
  else lastBadge="🔄 Sigue practicando";
  renderResult(correctCount,stars,passed);
}

function renderResult(correctCount,stars,passed){
  const lv=LEVELS[session.levelId];
  setHeader(lv.title,"Resultados",true);
  const allDone=passed && session.levelId===LEVELS.length-1;
  if(allDone) computeGrade20();
  document.getElementById("main").innerHTML=`
    <div class="result-wrap">
      <div class="big-stars">${"★".repeat(stars)}${"☆".repeat(3-stars)}</div>
      <div class="result-title">${passed?"¡Nivel superado!":"Casi lo logras"}</div>
      <div class="result-sub">${studentName} · 3ero ${studentSection}<br>
        Correctas: ${correctCount}/${QUESTIONS_PER_LEVEL} · Puntos: ${session.levelPoints}
        ${allDone?`<br><b>Puntos totales: ${totalPointsAllLevels} · Nota: ${finalGrade20}/20</b>`:""}
      </div>
      ${!passed?`<div class="intro-box" style="text-align:left;">Necesitas al menos ${Math.ceil(QUESTIONS_PER_LEVEL*PASS_RATIO)} correctas para avanzar.</div>`:""}
      ${allDone?`
        <button class="btn btn-success" id="dlCert">📥 Descargar mi logro</button>
        <button class="btn btn-secondary" id="notifyT">📧 Avisar a mi profesor</button>

/* ---- Verificación anti-plagio ---- */
const VERIFY_SECRET="-GILBERTO-FISICA-2026";
function simpleHash(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return (h>>>0).toString(36).toUpperCase().padStart(7,"0").slice(0,7);
}
function makeVerificationCode(gameId,name,section,points,grade){
  const base=[gameId,(name||"").trim().toUpperCase(),section,String(points),String(grade),VERIFY_SECRET].join("|");
  const h=simpleHash(base);
  return "MRV-"+h.slice(0,3)+"-"+h.slice(3,6);
}
function buildVerifyPayload(gameTitle,name,section,yearLabel,points,grade,badge,code){
  return [
    "VERIFICACION DE LOGRO",
    "Colegio: ",
    " ",
    "Juego: "+gameTitle,
    "Estudiante: "+name,
    "Curso: "+yearLabel,
    "Seccion: "+section,
    "Puntos: "+points,
    "Nota: "+grade+" / 20",
    "Insignia: "+(badge||""),
    "Codigo: "+code,
    "Fecha: "+new Date().toLocaleString("es-VE")
  ].join("\n");
}
function drawCertificateChrome(ctx,w,h){
  ctx.save(); ctx.globalAlpha=0.06; ctx.fillStyle="#ffffff"; ctx.font="12px Arial";
  for(let y=40;y<h;y+=28) for(let x=20;x<w;x+=120) ctx.fillText("",x+((y/28)%2)*40,y);
  ctx.restore();
}

/* ---- Simulador MRUV ---- */
let simState={running:false,x0:0,v0:0,a:2,t:0,lastTs:null,raf:null,history:[]};

function renderSimulator(){
  setHeader("Simulador MRUV","Explora posición y velocidad con aceleración",false);
  document.getElementById("main").innerHTML=`
    <div class="sim-track-wrap">
      <div class="sim-readout">
        <span class="c-t">t = <span id="simT">0.0</span> s</span>
        <span class="c-v">v actual = <span id="simV">0.0</span> m/s</span>
        <span class="c-x">x = <span id="simX">0.0</span> m</span>
        <span class="c-a">a = <span id="simA">${simState.a}</span> m/s²</span>
      </div>
      <div class="sim-track" id="simTrack"></div>
      <div class="graph-legend">
        <span><i style="background:#C45C1A;"></i> Posición x(t)</span>
        <span><i style="background:#1D6FBF;"></i> Velocidad v(t)</span>
      </div>
      <canvas id="simGraph" width="400" height="180"></canvas>
      <div class="sim-controls">
        <div class="ctrl-box ctrl-v">
          <label>Velocidad inicial (v₀) <span class="valdisp" id="v0Disp">${simState.v0} m/s</span></label>
          <input type="range" id="v0Slider" min="-10" max="15" step="1" value="${simState.v0}">
        </div>
        <div class="ctrl-box ctrl-a">
          <label>Aceleración (a) <span class="valdisp" id="aDisp">${simState.a} m/s²</span></label>
          <input type="range" id="aSlider" min="-5" max="8" step="0.5" value="${simState.a}">
        </div>
        <div class="ctrl-box ctrl-x">
          <label>Posición inicial (x₀) <span class="valdisp" id="x0Disp">${simState.x0} m</span></label>
          <input type="range" id="x0Slider" min="-20" max="20" step="1" value="${simState.x0}">
        </div>
      </div>
      <div class="sim-final-box" id="simFinalBox">
        <div class="muted" id="simFinalWhy">Listo para iniciar</div>
        <div>Velocidad: <span class="vf" id="simFinalV">0</span> m/s</div>
        <div>Posición: <span class="xf" id="simFinalX">0</span> m</div>
      </div>
      <div class="sim-btns">
        <button class="btn btn-primary" id="simStart">▶ Iniciar</button>
        <button class="btn btn-outline" id="simReset">⟲ Reiniciar</button>
      </div>
      <p style="font-size:12px;color:#7a8a99;margin-top:10px;text-align:center;">v = v₀ + a·t &nbsp;·&nbsp; x = x₀ + v₀·t + ½·a·t²</p>
    </div>`;
  buildTrackMarkers();
  document.getElementById("v0Slider").oninput=e=>{
    simState.v0=parseFloat(e.target.value);
    document.getElementById("v0Disp").textContent=simState.v0+" m/s";
    if(!simState.running){
      resetSimVisual();
      document.getElementById("simV").textContent=fmt(simState.v0);
    }
  };
  document.getElementById("aSlider").oninput=e=>{
    simState.a=parseFloat(e.target.value);
    document.getElementById("aDisp").textContent=simState.a+" m/s²";
    document.getElementById("simA").textContent=simState.a;
  };
  document.getElementById("x0Slider").oninput=e=>{
    simState.x0=parseFloat(e.target.value);
    document.getElementById("x0Disp").textContent=simState.x0+" m";
    if(!simState.running) resetSimVisual();
  };
  document.getElementById("simStart").onclick=toggleSim;
  document.getElementById("simReset").onclick=resetSim;
  resetSimVisual();
}

function buildTrackMarkers(){
  const track=document.getElementById("simTrack");
  track.innerHTML="";
  for(let m=-20;m<=20;m+=5){
    const pct=((m+20)/40)*100;
    const el=document.createElement("div");
    el.className="marker"; el.style.left=pct+"%";
    el.innerHTML=`<span>${m}</span>`;
    track.appendChild(el);
  }
  const car=document.createElement("div");
  car.className="sim-car"; car.id="simCar"; car.textContent="🚗";
  track.appendChild(car);
}
function posToPct(x){const c=Math.max(-20,Math.min(20,x));return ((c+20)/40)*100;}
function resetSimVisual(){
  const car=document.getElementById("simCar");
  if(car) car.style.left=posToPct(simState.x0)+"%";
  document.getElementById("simT").textContent="0.0";
  document.getElementById("simV").textContent=fmt(simState.v0);
  document.getElementById("simX").textContent=fmt(simState.x0);
  simState.history=[{t:0,x:simState.x0,v:simState.v0}];
  const why=document.getElementById("simFinalWhy");
  const fv=document.getElementById("simFinalV");
  const fx=document.getElementById("simFinalX");
  if(why) why.textContent="Listo para iniciar";
  if(fv) fv.textContent=fmt(simState.v0);
  if(fx) fx.textContent=fmt(simState.x0);
  drawSimGraph();
}
function resetSim(){
  simState.running=false; simState.t=0; simState.lastTs=null;
  if(simState.raf) cancelAnimationFrame(simState.raf);
  document.getElementById("simStart").textContent="▶ Iniciar";
  resetSimVisual();
}
function toggleSim(){
  simState.running=!simState.running;
  document.getElementById("simStart").textContent=simState.running?"⏸ Pausar":"▶ Iniciar";
  if(simState.running){
    simState.lastTs=null;
    const why=document.getElementById("simFinalWhy");
    if(why) why.textContent="En movimiento…";
    simState.raf=requestAnimationFrame(simLoop);
  } else {
    if(simState.raf) cancelAnimationFrame(simState.raf);
    const v=simState.v0+simState.a*simState.t;
    const x=simState.x0+simState.v0*simState.t+0.5*simState.a*simState.t*simState.t;
    showFinalVelocity(v,x,"Simulación en pausa");
  }
}
function updateSimReadout(v,x){
  const elV=document.getElementById("simV");
  const elX=document.getElementById("simX");
  const elT=document.getElementById("simT");
  if(elT) elT.textContent=fmt(simState.t);
  if(elV) elV.textContent=fmt(v);
  if(elX) elX.textContent=fmt(x);
  const fv=document.getElementById("simFinalV");
  const fx=document.getElementById("simFinalX");
  const why=document.getElementById("simFinalWhy");
  if(fv) fv.textContent=fmt(v);
  if(fx) fx.textContent=fmt(x);
  if(why && simState.running) why.textContent="En movimiento…";
}
function showFinalVelocity(v,x,reason){
  const fv=document.getElementById("simFinalV");
  const fx=document.getElementById("simFinalX");
  const why=document.getElementById("simFinalWhy");
  const elV=document.getElementById("simV");
  const elX=document.getElementById("simX");
  if(elV) elV.textContent=fmt(v);
  if(elX) elX.textContent=fmt(x);
  if(fv) fv.textContent=fmt(v);
  if(fx) fx.textContent=fmt(x);
  if(why){
    why.textContent=(reason||"Simulación detenida")
      +" · v = v₀ + a·t = "+fmt(simState.v0)+" + ("+fmt(simState.a)+")("+fmt(simState.t)+")";
  }
}
function simLoop(ts){
  const car=document.getElementById("simCar");
  if(!car){simState.running=false;simState.raf=null;return;}
  if(!simState.lastTs) simState.lastTs=ts;
  const dt=(ts-simState.lastTs)/1000;
  simState.lastTs=ts;
  simState.t+=dt;
  const v=simState.v0+simState.a*simState.t;
  const x=simState.x0+simState.v0*simState.t+0.5*simState.a*simState.t*simState.t;
  car.style.left=posToPct(x)+"%";
  updateSimReadout(v,x);
  simState.history.push({t:simState.t,x,v});
  if(simState.history.length>400) simState.history.shift();
  drawSimGraph();
  if(x<=-20||x>=20){
    simState.running=false;
    const btn=document.getElementById("simStart");
    if(btn) btn.textContent="▶ Iniciar";
    showFinalVelocity(v,x, x>=20 ? "Llegó al extremo derecho de la pista" : "Llegó al extremo izquierdo de la pista");
    return;
  }
  if(simState.running) simState.raf=requestAnimationFrame(simLoop);
}
function drawSimGraph(){
  const canvas=document.getElementById("simGraph");
  if(!canvas) return;
  const ctx=canvas.getContext("2d");
  const W=canvas.width, H=canvas.height;
  const padL=44, padR=44, padT=14, padB=28;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  ctx.clearRect(0,0,W,H);

  // fondo del área de gráfica
  ctx.fillStyle="#FAFBFC";
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#FFFFFF";
  ctx.fillRect(padL, padT, plotW, plotH);

  const hist=simState.history || [{t:0,x:simState.x0,v:simState.v0}];
  const maxT=Math.max(4, (hist[hist.length-1]&&hist[hist.length-1].t||0)*1.15, 0.5);

  // rangos acotados para que la curva no “explote” fuera de escala
  const xs=hist.map(h=>h.x), vs=hist.map(h=>h.v);
  let minX=Math.min(-5, ...xs), maxX=Math.max(5, ...xs);
  let minV=Math.min(-5, ...vs), maxV=Math.max(5, ...vs);
  // margen 10%
  const spanX=Math.max(maxX-minX, 1), spanV=Math.max(maxV-minV, 1);
  minX-=spanX*0.1; maxX+=spanX*0.1;
  minV-=spanV*0.1; maxV+=spanV*0.1;

  function px(t){ return padL + (t/maxT)*plotW; }
  function pyX(x){ return padT + plotH - ((x-minX)/(maxX-minX||1))*plotH; }
  function pyV(v){ return padT + plotH - ((v-minV)/(maxV-minV||1))*plotH; }

  // rejilla horizontal
  ctx.strokeStyle="#E8EDF2"; ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=padT+(plotH*i)/4;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(padL+plotW,y); ctx.stroke();
  }
  // rejilla vertical
  for(let i=0;i<=4;i++){
    const x=padL+(plotW*i)/4;
    ctx.beginPath(); ctx.moveTo(x,padT); ctx.lineTo(x,padT+plotH); ctx.stroke();
  }

  // ejes
  ctx.strokeStyle="#9AA7B2"; ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(padL, padT);
  ctx.lineTo(padL, padT+plotH);
  ctx.lineTo(padL+plotW, padT+plotH);
  ctx.stroke();

  // etiquetas
  ctx.font="10px Segoe UI, Arial";
  ctx.fillStyle="#7a8a99";
  ctx.textAlign="center";
  ctx.fillText("t (s)", padL+plotW/2, H-6);
  ctx.textAlign="left";
  ctx.fillStyle="#C45C1A";
  ctx.fillText("x", 6, padT+10);
  ctx.fillStyle="#1D6FBF";
  ctx.textAlign="right";
  ctx.fillText("v", W-6, padT+10);

  // valores de escala
  ctx.textAlign="right";
  ctx.fillStyle="#C45C1A";
  ctx.fillText(fmt(maxX), padL-4, padT+10);
  ctx.fillText(fmt(minX), padL-4, padT+plotH);
  ctx.textAlign="left";
  ctx.fillStyle="#1D6FBF";
  ctx.fillText(fmt(maxV), padL+plotW+4, padT+10);
  ctx.fillText(fmt(minV), padL+plotW+4, padT+plotH);

  // recortar curvas al área de la gráfica
  ctx.save();
  ctx.beginPath();
  ctx.rect(padL, padT, plotW, plotH);
  ctx.clip();

  if(hist.length>1){
    // posición x(t) — naranja
    ctx.strokeStyle="#C45C1A";
    ctx.lineWidth=2.5;
    ctx.lineJoin="round";
    ctx.beginPath();
    hist.forEach((h,i)=>{
      const X=px(h.t), Y=pyX(h.x);
      if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    });
    ctx.stroke();

    // velocidad v(t) — azul
    ctx.strokeStyle="#1D6FBF";
    ctx.lineWidth=2.5;
    ctx.beginPath();
    hist.forEach((h,i)=>{
      const X=px(h.t), Y=pyV(h.v);
      if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
    });
    ctx.stroke();
  }
  ctx.restore();

  // borde del área de gráfica
  ctx.strokeStyle="#D5DCE3";
  ctx.lineWidth=1;
  ctx.strokeRect(padL, padT, plotW, plotH);
}

      var r = await fetch(url, { cache:'no-store', signal:controller.signal, headers:{Authorization:'Bearer ' + studentToken} });
      clearTimeout(timeout);
      var data = await r.json();
      if(!data.allowed){ if(st) st.innerHTML='<b style="color:#fca5a5">Acceso bloqueado.</b>'; if(gate) gate.className='license-gate blocked'; return false; }
      if(st) st.innerHTML='<b style="color:#86efac">Licencia activa.</b> '+(data.teacherName||'');
      if(gate) gate.className='license-gate ok';
      try{
        localStorage.setItem('saas_access_ok','1');
        if(data.accessToken) localStorage.setItem('saas_student_token',data.accessToken);
        localStorage.setItem('saas_subjects',JSON.stringify(data.subjects||[]));
      }catch(e){}
      var ni=document.getElementById('studentNameInput');
      if(ni && !ni.value && localStorage.getItem('saas_studentName')){ ni.value=localStorage.getItem('saas_studentName'); }
      return true;
    }catch(e){ if(st) st.innerHTML='<b style="color:#fca5a5">Sin servidor.</b> '+e.message; if(gate) gate.className='license-gate blocked'; return false; }
  }
  window.saasCheckAccess = saasCheckAccess;
  function wrapFn(name){
    var orig = window[name];
    if(typeof orig !== 'function' || orig._saasWrapped) return;
    var wrapped = async function(){
      if(!(await saasCheckAccess())){ alert('Sin acceso. Usa el catálogo con el código de clase.'); return; }
      return orig.apply(this, arguments);
    };
    wrapped._saasWrapped = true;
    window[name] = wrapped;
  }
  function install(){
    ['startRetoLevel','startLevel','startChallenge','beginLevel','startGame','startReto'].forEach(wrapFn);
    saasCheckAccess();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', install);
  else setTimeout(install, 0);
})();
</script>
</body>
</html>
