<script id="SAAS_ACCESS_GUARD_V1">
/* El código del profesor es obligatorio y se revalida contra la licencia en cada apertura. */
(async function(){
  const code=(localStorage.getItem('saas_classCode')||'').trim().toUpperCase();
  const name=(localStorage.getItem('saas_studentName')||'').trim();
  const fail=function(){ ['saas_access_ok','saas_classCode','saas_studentName','saas_subjects','saas_student_token'].forEach(k=>localStorage.removeItem(k)); location.replace('/catalogo.html?access=expired'); };
  if(!code||!name) return fail();
  try{
    const r=await fetch('/api/access/check?classCode='+encodeURIComponent(code),{cache:'no-store',headers:{Authorization:'Bearer '+(localStorage.getItem('saas_student_token')||'')}});
    const d=await r.json();
    if(!d.allowed || (Array.isArray(d.subjects)&&d.subjects.length&&!d.subjects.includes('matematicas'))) return fail();
    localStorage.setItem('saas_access_ok','1');
    localStorage.setItem('saas_student_token',d.accessToken||localStorage.getItem('saas_student_token')||'');
    localStorage.setItem('saas_subjects',JSON.stringify(d.subjects||[]));
  }catch(e){ return fail(); }
})();
window.saasSubmitResult=async function(result){ const t=localStorage.getItem('saas_student_token')||''; if(!t) return {ok:false}; const r=await fetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(result||{})}); return r.json(); };
</script>

 3 cm y 4 cm. Si el prisma tiene 10 cm de longitud, ¿cuál es su volumen?",["60 cm³","70 cm³","120 cm³","240 cm³"],"60 cm³","L3Q13"],["Un plano a escala 1:50 muestra una habitación con área de 12 cm². ¿Cuál es el área real de la habitación?",["0,3 m²","3 m²","30 m²","300 m²"],"3 m²","L3Q14"],["Dos rectas se cruzan. Un par de ángulos opuestos por el vértice mide (3x + 10)° y (5x − 30)°. ¿Cuánto mide cada uno de esos ángulos?",["60°","70°","80°","100°"],"70°","L3Q15"],["Cada ángulo exterior de un polígono regular mide 24°. ¿Cuántos lados tiene el polígono?",["12","15","18","24"],"15","L3Q16"],["A un prisma rectangular de 10 cm por 6 cm por 4 cm se le quita un cubo de arista 2 cm. ¿Cuál es el volumen restante?",["208 cm³","232 cm³","240 cm³","248 cm³"],"232 cm³","L3Q17"],["Una caja rectangular mide 2 cm, 3 cm y 6 cm de arista. ¿Cuál es la suma de las áreas de sus seis caras?",["60 cm²","66 cm²","72 cm²","88 cm²"],"72 cm²","L3Q18"],["Una figura se compone de un rectángulo de 10 cm por 4 cm y un triángulo adosado de base 10 cm y altura 3 cm, sin superposición. ¿Cuál es el área total?",["40 cm²","50 cm²","55 cm²","70 cm²"],"55 cm²","L3Q19"],["Un triángulo tiene área de 84 cm² y base de 14 cm. ¿Cuánto mide la altura correspondiente a esa base?",["6 cm","10 cm","12 cm","24 cm"],"12 cm","L3Q20"],["Un trapecio isósceles tiene bases de 20 cm y 8 cm, y lados no paralelos de 10 cm cada uno. ¿Cuál es su área?",["80 cm²","96 cm²","112 cm²","140 cm²"],"112 cm²","L3Q21"],["Una circunferencia mide 31,4 cm. Usando π = 3,14, ¿cuál es el área del círculo que delimita?",["31,4 cm²","78,5 cm²","157 cm²","314 cm²"],"78,5 cm²","L3Q22"],["Dos figuras semejantes tienen perímetros de 18 cm y 30 cm. Si el área de la menor es 45 cm², ¿cuál es el área de la mayor?",["75 cm²","100 cm²","125 cm²","150 cm²"],"125 cm²","L3Q23"],["Un camino de 1 m de ancho rodea por fuera un terreno rectangular de 20 m por 12 m. ¿Cuál es el área del camino?",["32 m²","64 m²","68 m²","308 m²"],"68 m²","L3Q24"],["Entre todos los rectángulos con perímetro de 32 cm, ¿cuál es el área máxima posible?",["56 cm²","60 cm²","64 cm²","128 cm²"],"64 cm²","L3Q25"],["Un prisma tiene volumen de 360 cm³ y longitud de 6 cm. Su sección transversal es un trapecio de bases 8 cm y 4 cm. ¿Cuál es la altura del trapecio?",["6 cm","8 cm","10 cm","12 cm"],"10 cm","L3Q26"],["Un círculo está inscrito en un cuadrado de lado 10 cm. ¿Cuál es el área del cuadrado que queda fuera del círculo?",["100 − 10π cm²","100 − 25π cm²","100 − 50π cm²","100 − 100π cm²"],"100 − 25π cm²","L3Q27"],["¿Cuál es el área exacta de un hexágono regular de lado 4 cm?",["24√3 cm²","48√3 cm²","16√3 cm²","96 cm²"],"24√3 cm²","L3Q28"],["Un rectángulo tiene diagonal de 13 cm y uno de sus lados mide 5 cm. ¿Cuál es su área?",["30 cm²","60 cm²","65 cm²","120 cm²"],"60 cm²","L3Q29"],["Las diagonales de un cuadrilátero se bisecan mutuamente. ¿Qué propiedad se puede asegurar que tiene el cuadrilátero?",["Es un paralelogramo","Es un trapecio con exactamente un par de lados paralelos","Es un rombo necesariamente","Tiene cuatro ángulos rectos"],"Es un paralelogramo","L3Q30"]]];
const KEY='math_geometria_progress_v1';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
