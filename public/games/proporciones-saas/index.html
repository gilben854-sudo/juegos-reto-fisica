<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proporciones y porcentajes — Matemáticas</title><style>
:root{--bg:#07111f;--card:#102238;--line:#24425f;--text:#e6f0fa;--muted:#a7bfd4;--accent:#34d399;--gold:#fbbf24;--bad:#f87171}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#123b45,#07111f 55%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}header{padding:24px 16px;text-align:center;border-bottom:1px solid var(--line)}header h1{margin:0;color:#6ee7b7;font-size:1.6rem}header p{color:var(--muted);margin:8px 0 0}main{max-width:760px;margin:0 auto;padding:18px 16px 48px}.card{background:rgba(16,34,56,.95);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 12px 30px #0003}label{display:block;color:#cde1ef;font-weight:700;font-size:.9rem;margin:10px 0 5px}input{width:100%;padding:12px;border:2px solid #42627c;border-radius:10px;background:#f8fafc;color:#0f172a;font-size:1rem}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;font-size:.95rem}.primary{background:#059669;color:white;width:100%;margin-top:14px}.choice{display:block;width:100%;text-align:left;background:#173452;color:var(--text);border:2px solid #315878;margin:9px 0}.choice:hover{border-color:var(--accent)}.choice.correct{background:#14532d;border-color:#4ade80}.choice.wrong{background:#5b1d28;border-color:#f87171}.hidden{display:none}.muted{color:var(--muted);line-height:1.5}.progress{height:10px;background:#183047;border-radius:99px;overflow:hidden;margin:12px 0 18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#fbbf24);width:0;transition:.25s}.score{color:#fbbf24;font-weight:800}.feedback-good{color:#86efac;font-weight:800;font-size:1.05rem;line-height:1.6}.feedback-encourage{color:#fcd34d;font-weight:700;font-size:1.02rem;line-height:1.6}.result{text-align:center;font-size:1.2rem}.certificate{border:2px solid var(--gold);padding:18px;border-radius:14px;margin-top:14px;background:#302511}a{color:#6ee7b7}
</style></head><body><header><h1>Proporciones y porcentajes</h1><p>Juego de Química · Aprende resolviendo retos</p></header><main><section id="setup" class="card"><h2>Identificación</h2><p class="muted">Escribe tu nombre y sección para guardar tu progreso en este juego.</p><label>Tu sección</label><input id="section" placeholder="Ejemplo: A" autocomplete="organization-section"><label>Tu nombre</label><input id="name" placeholder="Nombre y apellido" autocomplete="name"><button class="primary" id="start">Comenzar reto</button></section><section id="game" class="card hidden"><div><span>Nivel <b id="level">1</b> · Pregunta <b id="num">1</b>/5</span> · <span class="score">Aciertos: <b id="score">0</b> · Puntos: <b id="points">0</b> · Vidas: <b id="lives">3</b></span></div><div class="progress"><i id="bar"></i></div><h2 id="question"></h2><div id="choices"></div><p id="feedback" class="muted"></p><button class="primary hidden" id="next">Siguiente</button></section><section id="result" class="card hidden"></section></main><script>
const LEVEL_BANKS=[[["Simplifica la razón 12:18.",["2:3","3:2","4:9","6:9"],"2:3","L1Q01"],["¿Qué porcentaje representa 5/8?",["58%","62,5%","65%","80%"],"62,5%","L1Q02"],["Si 3:4 = x:20, ¿cuánto vale x?",["12","15","16","18"],"15","L1Q03"],["Expresa 7/10 como porcentaje.",["7%","17%","70%","700%"],"70%","L1Q04"],["¿Cuánto es el 25% de 84?",["18","20","21","24"],"21","L1Q05"],["Simplifica la razón 15:10.",["2:3","3:2","5:2","15:2"],"3:2","L1Q06"],["Si 4 kg cuestan $12, ¿cuánto cuesta 1 kg al mismo precio por kilo?",["$2","$3","$4","$6"],"$3","L1Q07"],["Aumenta 40 en un 10%.",["42","44","48","50"],"44","L1Q08"],["Expresa 3/5 como porcentaje.",["30%","50%","60%","75%"],"60%","L1Q09"],["Resuelve 6/9 = x/12.",["6","8","9","10"],"8","L1Q10"],["¿Cuál razón es equivalente a 2:5?",["10:20","12:30","14:30","18:40"],"12:30","L1Q11"],["Se reparten 120 unidades en razón 2:3. ¿Cuántas corresponden a la parte menor?",["24","36","48","72"],"48","L1Q12"],["¿Cuánto es el 30% de 150?",["30","40","45","50"],"45","L1Q13"],["Un artículo de $80 tiene una rebaja del 25%. ¿Cuál es su precio rebajado?",["$55","$60","$65","$75"],"$60","L1Q14"],["¿Qué porcentaje de 36 es 9?",["20%","25%","30%","40%"],"25%","L1Q15"],["Ocho lápices cuestan $24. ¿Cuánto cuestan cinco al mismo precio unitario?",["$12","$15","$18","$20"],"$15","L1Q16"],["Expresa la razón entre 2 horas y 30 minutos en su forma simplificada.",["2:1","3:1","4:1","5:2"],"4:1","L1Q17"],["Expresa 1,5 como porcentaje.",["15%","50%","150%","1.500%"],"150%","L1Q18"],["Resuelve x/15 = 4/5.",["10","12","13","14"],"12","L1Q19"],["Aumenta $200 en un 15%.",["$215","$220","$230","$250"],"$230","L1Q20"],["Una cantidad de 50 se divide en razón 3:7. ¿Cuál es la parte menor?",["12","15","20","35"],"15","L1Q21"],["Expresa 45% como número decimal.",["0,045","0,45","4,5","45"],"0,45","L1Q22"],["¿Cuánto es el 12% de 250?",["25","30","35","40"],"30","L1Q23"],["Un producto de $60 tiene un descuento del 10%. ¿Cuál es su precio final?",["$50","$54","$56","$58"],"$54","L1Q24"],["Simplifica la razón 2,4:6.",["2:5","3:5","4:5","5:12"],"2:5","L1Q25"],["Cinco trabajadores hacen una tarea en 8 días. Si trabajan 10 al mismo ritmo, ¿cuántos días tardarán?",["2","4","5","16"],"4","L1Q26"],["Expresa 3/20 como porcentaje.",["3%","12%","15%","20%"],"15%","L1Q27"],["18 representa el 60% de qué número?",["28","30","32","36"],"30","L1Q28"],["Un artículo cuesta $90 después de aplicarle un descuento del 20%. ¿Cuál era su precio original?",["$108","$110","$112,50","$120"],"$112,50","L1Q29"],["En una razón 4:9, la primera cantidad es 28. ¿Cuál es la segunda?",["49","56","63","72"],"63","L1Q30"]],[["En un mapa, 1 cm representa 5 km. ¿Qué distancia real representan 7 cm?",["12 km","30 km","35 km","40 km"],"35 km","L2Q01"],["Una receta para 4 personas usa 300 g de arroz. ¿Cuánto se necesita para 10 personas?",["600 g","700 g","750 g","900 g"],"750 g","L2Q02"],["Una bebida contiene 2 partes de concentrado por cada 7 partes de agua. Si se usan 21 tazas de agua, ¿cuántas de concentrado se necesitan?",["3","6","9","14"],"6","L2Q03"],["Una población pasó de 800 a 920 habitantes. ¿Cuál fue el porcentaje de aumento?",["12%","15%","18%","20%"],"15%","L2Q04"],["Una chaqueta de $100 tiene un descuento del 20% y luego otro del 10% sobre el precio rebajado. ¿Cuál es el precio final?",["$70","$72","$75","$80"],"$72","L2Q05"],["Un automóvil recorre 150 km en 2,5 horas a velocidad constante. ¿Cuánto tardará en recorrer 240 km?",["3 h","3,5 h","4 h","4,5 h"],"4 h","L2Q06"],["¿Cuál de estas razones es equivalente a 18:30?",["3:5","5:3","6:8","9:20"],"3:5","L2Q07"],["Para preparar pintura, la proporción de azul a blanco es 3:8. Si se usan 24 litros de blanco, ¿cuántos litros de azul se requieren?",["6","8","9","12"],"9","L2Q08"],["En una prueba de 40 preguntas, Marta respondió correctamente 34. ¿Qué porcentaje acertó?",["80%","82,5%","85%","87,5%"],"85%","L2Q09"],["Una compra de $250 paga un impuesto del 8%. ¿Cuál es el total con impuesto?",["$258","$265","$270","$280"],"$270","L2Q10"],["Después de aumentar un precio en 25%, queda en $75. ¿Cuál era el precio original?",["$55","$60","$65","$70"],"$60","L2Q11"],["Una ciudad de 12.000 habitantes disminuye su población un 5%. ¿Cuántos habitantes quedan?",["11.200","11.400","11.500","11.600"],"11.400","L2Q12"],["Seis máquinas iguales producen un pedido en 10 horas. ¿Cuánto tardarían 15 máquinas al mismo ritmo?",["3 h","4 h","5 h","6 h"],"4 h","L2Q13"],["Se distribuyen $840 entre dos equipos en razón 3:4. ¿Cuánto recibe el equipo con la parte menor?",["$300","$360","$420","$480"],"$360","L2Q14"],["En un plano a escala 1:200, una pared mide 4,5 cm. ¿Cuánto mide en la realidad?",["4,5 m","8 m","9 m","90 m"],"9 m","L2Q15"],["Una impresora produce 450 páginas en 6 minutos. ¿Cuántas páginas imprime por minuto?",["65","70","75","80"],"75","L2Q16"],["La proporción de estudiantes que prefieren fútbol aumentó del 40% al 55%. ¿En cuántos puntos porcentuales aumentó?",["15","25","37,5","40"],"15","L2Q17"],["Un producto de $200 recibe un descuento del 15% y después se le aplica un impuesto del 10% al precio rebajado. ¿Cuál es el total?",["$187","$187,50","$190","$195"],"$187","L2Q18"],["En una clase, la razón entre estudiantes que usan autobús y bicicleta es 5:3. Si 15 usan bicicleta, ¿cuántos usan autobús?",["20","25","30","35"],"25","L2Q19"],["Se mezclan ingredientes A, B y C en razón 2:3:5. Si la mezcla total es de 40 kg, ¿cuántos kg corresponden a B?",["8","10","12","15"],"12","L2Q20"],["¿Qué tabla representa una relación proporcional entre x e y?",["x: 2, 4; y: 6, 12","x: 2, 4; y: 6, 10","x: 3, 6; y: 9, 21","x: 5, 10; y: 15, 25"],"x: 2, 4; y: 6, 12","L2Q21"],["Un vehículo consume 8 litros de combustible cada 100 km. ¿Cuántos litros consumirá en 350 km, manteniendo el mismo rendimiento?",["24","26","28","30"],"28","L2Q22"],["Una caja debería contener 500 g, pero contiene 475 g. ¿Qué porcentaje menos de lo indicado contiene?",["4%","5%","5,5%","25%"],"5%","L2Q23"],["Una tienda compra un artículo por $80 y lo vende por $100. ¿Qué porcentaje de aumento aplicó sobre el costo?",["20%","25%","30%","80%"],"25%","L2Q24"],["Un comerciante compra un producto por $60 y lo vende por $75. ¿Qué porcentaje del precio de venta es su ganancia?",["15%","20%","25%","30%"],"20%","L2Q25"],["Una tienda ofrece 30% de descuento en un producto de $200. Otra ofrece $55 de descuento sobre el mismo precio. ¿Cuál oferta deja el precio más bajo y por cuánto?",["La primera, por $5","La segunda, por $5","La primera, por $10","Las dos dejan el mismo precio"],"La primera, por $5","L2Q26"],["Una solución de 20 litros contiene 25% de sal. ¿Cuántos litros de agua hay en ella?",["5","10","15","18"],"15","L2Q27"],["Una fábrica produce 1.200 piezas en 8 horas. Si mantiene el ritmo, ¿cuántas producirá en 11 horas?",["1.500","1.600","1.650","1.800"],"1.650","L2Q28"],["Se cambian 3 dólares por cada 5 euros. ¿Cuántos dólares se reciben por 40 euros, usando la misma tasa?",["20","24","27","30"],"24","L2Q29"],["En una encuesta, 72 de 120 personas prefieren el transporte público. ¿Qué porcentaje no lo prefiere?",["30%","35%","40%","60%"],"40%","L2Q30"]],[["Un depósito está lleno hasta 3/5 de su capacidad. Tras añadir 24 litros, queda lleno hasta 9/10. ¿Cuál es su capacidad total?",["60 L","70 L","80 L","90 L"],"80 L","L3Q01"],["Para alimentar a 12 excursionistas durante 5 días se necesitan 30 kg de comida. ¿Cuántos kg se requieren para 20 excursionistas durante 8 días, manteniendo la misma ración por persona?",["60 kg","72 kg","80 kg","96 kg"],"80 kg","L3Q02"],["Un artículo cuesta $160. Primero se descuenta 25% y luego se aplica un impuesto del 12% sobre el precio rebajado. ¿Cuál es el total a pagar?",["$128,00","$132,00","$134,40","$140,80"],"$134,40","L3Q03"],["Dos cantidades están en razón 4:7 y su diferencia es 45. ¿Cuál es la cantidad mayor?",["60","75","105","135"],"105","L3Q04"],["Una tienda descuenta 20% un artículo y luego aplica un descuento adicional del 15% al precio rebajado. Si el precio final es $136, ¿cuál era el precio original?",["$180","$190","$200","$210"],"$200","L3Q05"],["Un mapa usa escala 1:50.000. Dos pueblos están separados por 7,2 cm en el mapa. Un ciclista recorre la distancia real a 12 km/h. ¿Cuánto tarda?",["15 min","18 min","21 min","30 min"],"18 min","L3Q06"],["Tres bombas iguales vacían un tanque en 8 horas. Tras trabajar juntas 2 horas, se apagan una bomba. ¿Cuánto tiempo adicional necesitarán las dos restantes para vaciarlo?",["6 h","8 h","9 h","12 h"],"9 h","L3Q07"],["Una mezcla de 30 litros contiene 40% de jugo. ¿Cuántos litros de agua hay que agregar para que el jugo represente el 25% de la mezcla final?",["12 L","15 L","18 L","24 L"],"18 L","L3Q08"],["El precio de un artículo aumentó 20% y luego disminuyó 20% respecto del nuevo precio. Si originalmente costaba $250, ¿cuál es su precio final y el cambio respecto al original?",["$240; disminuyó 4%","$250; no cambió","$260; aumentó 4%","$200; disminuyó 20%"],"$240; disminuyó 4%","L3Q09"],["Una máquina produce 480 piezas en 6 horas y otra produce 420 piezas en 7 horas. Si trabajan juntas durante 5 horas, ¿cuántas piezas producen?",["650","700","750","800"],"750","L3Q10"],["Una camisa tiene 35% de descuento y luego cuesta $78. ¿Cuál era su precio antes del descuento?",["$110","$115","$120","$125"],"$120","L3Q11"],["En un grupo, la razón entre adultos y niños es 3:5. Se incorporan 6 adultos y la razón pasa a ser 9:10. ¿Cuántos niños hay?",["20","24","30","40"],"30","L3Q12"],["Un comerciante marca un producto 40% por encima de su costo y luego ofrece 15% de descuento sobre el precio marcado. Si el costo fue $100, ¿cuál es su ganancia porcentual sobre el costo?",["15%","19%","25%","40%"],"19%","L3Q13"],["Una mezcla de 50 litros tiene una razón de concentrado a agua de 2:3. ¿Cuántos litros de agua deben evaporarse para que la razón pase a ser 1:1, sin perder concentrado?",["5 L","10 L","15 L","20 L"],"10 L","L3Q14"],["Un depósito tiene 240 litros y pierde agua a razón de 8 litros cada 3 minutos. ¿Qué porcentaje de su contenido inicial quedará tras 30 minutos?",["60%","65%","66⅔%","70%"],"60%","L3Q15"],["Una cantidad se divide entre Ana, Bruno y Carla en razón 2:3:5. Carla recibe $90 más que Ana. ¿Cuánto dinero se repartió en total?",["$270","$300","$330","$360"],"$300","L3Q16"],["En una votación, 60% de los 250 participantes apoyó una propuesta. Luego se sumaron 50 personas, de las cuales 40 la apoyaban. ¿Qué porcentaje del total final la apoya?",["62%","63⅓%","64%","66%"],"63⅓%","L3Q17"],["Una bicicleta se vende por $360 después de aplicar un descuento del 10% sobre el precio marcado. El comerciante había marcado el precio 20% por encima de un costo de $333⅓. ¿Cuánto gana respecto al costo?",["$20","$25","$30","$40"],"$30","L3Q18"],["Un automóvil usa 6 litros cada 100 km. Tras recorrer 250 km, se agregan 12 litros al tanque. ¿Cuántos litros se han consumido en total después de recorrer otros 150 km?",["18 L","21 L","24 L","27 L"],"24 L","L3Q19"],["Un plano se dibuja a escala 1:250. Un terreno rectangular mide 8 cm por 5 cm en el plano. ¿Cuál es su área real?",["125 m²","200 m²","250 m²","500 m²"],"250 m²","L3Q20"],["Un precio de $500 se rebaja un 20%. ¿Qué porcentaje de aumento sobre el precio rebajado se necesita para volver exactamente a $500?",["20%","25%","30%","40%"],"25%","L3Q21"],["Un grifo llena 3/8 de un tanque en 15 minutos. A ese ritmo, ¿cuántos minutos necesita para llenar 70% del tanque?",["24","26","28","30"],"28","L3Q22"],["En un mapa, 4 cm representan 18 km. Dos localidades están a 7,5 cm. Un autobús recorre esa distancia a 45 km/h. ¿Cuánto tarda?",["35 min","40 min","45 min","50 min"],"40 min","L3Q23"],["En una clase, el 40% son niñas. Se incorporan 6 niños y entonces las niñas representan un tercio de la clase. ¿Cuántos estudiantes había al principio?",["20","24","30","36"],"30","L3Q24"],["Un artículo cuesta $240. Se aplican dos descuentos sucesivos, de 15% y 10%. ¿Cuánto dinero se ahorra respecto al precio original?",["$54,00","$60,00","$66,00","$75,60"],"$66,00","L3Q25"],["Una cuadrilla de 8 personas trabajando 6 horas al día termina una obra en 15 días. ¿Cuántos días tardarán 10 personas trabajando 9 horas al día, con el mismo rendimiento por persona?",["6","8","10","12"],"8","L3Q26"],["Un producto de 80 kg contiene 30% de material reciclado. ¿Cuántos kg de material reciclado hay que añadir para que represente 50% de la mezcla final?",["24 kg","28 kg","32 kg","40 kg"],"32 kg","L3Q27"],["Una tienda vende dos artículos al mismo precio. En uno gana 20% sobre su costo y en el otro pierde 20% sobre su costo. ¿Cuál es el resultado total respecto a los costos combinados?",["Ganancia del 4%","Pérdida del 4%","Ni ganancia ni pérdida","Pérdida del 2%"],"Pérdida del 4%","L3Q28"],["Se mezclan dos soluciones: 12 litros al 25% de sal y 8 litros al 40%. ¿Qué porcentaje de sal tendrá la mezcla?",["29%","30%","31%","32,5%"],"31%","L3Q29"],["Un vendedor recibe una comisión del 8% sobre sus ventas. Si aumenta sus ventas un 25% y su comisión aumenta $150, ¿cuál era el valor inicial de sus ventas?",["$5.000","$6.000","$7.500","$8.000"],"$7.500","L3Q30"]]];
const KEY='math_proporciones_progress_v1';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
