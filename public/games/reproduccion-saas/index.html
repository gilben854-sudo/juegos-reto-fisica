  }catch(e){ return fail(); }
})();

cos?",["Cada mellizo procede de una combinación de gametos diferente","Ambos proceden necesariamente de un único cigoto dividido","No tienen información genética heredada","Se originan por reproducción asexual"],"Cada mellizo procede de una combinación de gametos diferente","L2Q18"],["Un renacuajo desarrolla patas, pierde la cola y se convierte en rana. ¿Qué fenómeno explica estos cambios?",["Metamorfosis","Fisión binaria","Polinización","Gemación"],"Metamorfosis","L2Q19"],["Una semilla viable permanece sin brotar durante un periodo frío y germina cuando las condiciones mejoran. ¿Cómo se llama ese estado temporal?",["Latencia o dormancia","Fecundación","Gestación","Gemación"],"Latencia o dormancia","L2Q20"],["Durante el desarrollo de un mamífero, ¿qué función cumple principalmente la placenta?",["Permite el intercambio de sustancias entre la madre y el embrión o feto","Produce los gametos del embrión","Realiza la fecundación dentro del útero","Convierte al feto en una célula haploide"],"Permite el intercambio de sustancias entre la madre y el embrión o feto","L2Q21"],["El cordón umbilical conecta al feto con la placenta. ¿Qué papel cumple en ese sistema?",["Transporta sangre entre el feto y la placenta","Une directamente el óvulo con el espermatozoide","Produce el líquido seminal","Forma la cubierta externa del huevo"],"Transporta sangre entre el feto y la placenta","L2Q22"],["Una cría de saltamontes se parece al adulto, pero es más pequeña y aún no tiene alas funcionales. ¿Cómo se llama esta etapa juvenil?",["Ninfa","Renacuajo","Cigoto","Pupa"],"Ninfa","L2Q23"],["Un mamífero produce pocas crías y dedica mucho tiempo a cuidarlas. ¿Qué consecuencia es razonable esperar frente a una especie que produce muchísimas crías con poco cuidado?",["Una mayor inversión de cuidado por cría","Que todas las crías nazcan por reproducción asexual","Que no haya desarrollo embrionario","Que cada cría tenga necesariamente el mismo genoma"],"Una mayor inversión de cuidado por cría","L2Q24"],["En un experimento, se cubren las flores de una planta para impedir que llegue polen. ¿Qué resultado se puede poner a prueba con mayor claridad?",["Si la transferencia de polen es necesaria para formar semillas en esa planta","Si las raíces pueden realizar la fecundación","Si las hojas contienen gametos masculinos","Si el fruto puede producir polen"],"Si la transferencia de polen es necesaria para formar semillas en esa planta","L2Q25"],["En un insecto, los espermatozoides se transfieren al aparato reproductor de la hembra antes de que se formen los huevos fecundados. ¿Cómo se clasifica la fecundación?",["Interna","Externa","Asexual","Vegetativa"],"Interna","L2Q26"],["Un estudiante observa que un espermatozoide se desplaza hacia un óvulo. ¿Qué característica ayuda directamente a ese desplazamiento en muchos animales?",["El movimiento de su flagelo","La cubierta de la semilla","La producción de polen","La formación de una placenta"],"El movimiento de su flagelo","L2Q27"],["Una rama de geranio se coloca en agua y después forma raíces y hojas. ¿Qué explica que la nueva planta sea muy parecida a la planta de origen?",["Se originó por reproducción vegetativa a partir de tejido del progenitor","Se formó por la unión de óvulo y espermatozoide","El ambiente convirtió sus células en gametos","La planta recibió dos genomas distintos por polinización"],"Se originó por reproducción vegetativa a partir de tejido del progenitor","L2Q28"],["Las tortugas marinas ponen muchos huevos, pero solo una fracción de las crías llega a la adultez. ¿Qué interpretación es coherente con este patrón?",["La alta cantidad de huevos compensa una supervivencia temprana baja","Cada huevo se convierte necesariamente en una tortuga adulta","La especie se reproduce exclusivamente por gemación","La fecundación ocurre después de que las crías nacen"],"La alta cantidad de huevos compensa una supervivencia temprana baja","L2Q29"],["Una planta produce flores, pero sus semillas no se forman tras una temporada sin insectos polinizadores. ¿Cuál es una explicación probable?",["Disminuyó el transporte de polen entre flores","La mitosis de las raíces se detuvo por completo","Los óvulos se transformaron en gametos masculinos","Las semillas se formaron antes de la polinización"],"Disminuyó el transporte de polen entre flores","L2Q30"]],[["Una especie tiene 2n = 24 cromosomas en sus células corporales. ¿Cuántos cromosomas tendrá normalmente cada gameto?",["12","24","36","48"],"12","L3Q01"],["En una especie con n = 8, un óvulo y un espermatozoide se fecundan normalmente. ¿Cuántos cromosomas tendrá el cigoto?",["16","8","4","32"],"16","L3Q02"],["Una célula de un embrión se divide por mitosis cinco veces, y todas las células resultantes sobreviven sin nuevas divisiones. ¿Cuántas células se forman a partir de la inicial?",["32","10","16","25"],"32","L3Q03"],["En un cultivo de bacterias, una célula se divide en dos cada 30 minutos. Si todas las células se dividen de manera sincronizada y no muere ninguna, ¿cuántas habrá después de 2 horas?",["16","8","12","32"],"16","L3Q04"],["De 200 óvulos liberados en una temporada, 150 llegan a ser fecundados. ¿Qué porcentaje de los óvulos fue fecundado?",["75 %","50 %","25 %","150 %"],"75 %","L3Q05"],["En un ensayo con polinización controlada, 40 de 50 flores polinizadas forman fruto; en un grupo sin polinización, ninguna forma fruto. ¿Qué conclusión está mejor respaldada para las condiciones del ensayo?",["La polinización favoreció la formación de frutos","Todas las flores polinizadas forman siempre frutos en cualquier ambiente","La formación de frutos no depende de la reproducción","Las flores sin polen produjeron más frutos que las polinizadas"],"La polinización favoreció la formación de frutos","L3Q06"],["Una colonia de levaduras se reproduce por gemación. Una mutación aparece en una célula y pasa a sus yemas descendientes. ¿Qué patrón cabe esperar en esas descendientes?",["La mutación puede heredarse en el linaje celular que la recibió","La mutación se transmite necesariamente a todas las levaduras de la colonia","La reproducción asexual impide que se hereden mutaciones","La mutación solo puede aparecer tras la fecundación"],"La mutación puede heredarse en el linaje celular que la recibió","L3Q07"],["En una población vegetal, la reproducción sexual genera descendientes con mayor diversidad que la propagación por esquejes. Si aparece una enfermedad nueva, ¿qué grupo podría tener más probabilidad de incluir individuos resistentes?",["El grupo con mayor diversidad genética","El grupo formado solo por copias genéticas idénticas","El grupo que no produce células reproductoras","Ambos grupos necesariamente tienen la misma diversidad"],"El grupo con mayor diversidad genética","L3Q08"],["Un planario se divide en dos partes y cada una reconstruye las estructuras faltantes, formando dos organismos. ¿Qué tipo de reproducción describe el caso?",["Fragmentación seguida de regeneración","Fecundación cruzada","Formación de semillas","Gemación de una célula"],"Fragmentación seguida de regeneración","L3Q09"],["En una colonia de coral, fragmentos separados se fijan a superficies y crecen como nuevas colonias. ¿Qué inferencia es más adecuada?",["La fragmentación puede permitir reproducción asexual","Cada fragmento debió originarse por fecundación interna","El proceso requiere necesariamente polinización","Los fragmentos son gametos haploides"],"La fragmentación puede permitir reproducción asexual","L3Q10"],["Un investigador quiere comprobar si el polen de una variedad concreta puede fecundar una planta receptora. ¿Qué diseño permite atribuir mejor el resultado a ese polen?",["Aplicar el polen elegido a flores protegidas y compararlas con flores control sin ese polen","Dejar todas las flores expuestas a cualquier insecto y observar una sola","Retirar las raíces de la planta y contar las hojas","Comparar frutos de especies distintas sin registrar su polen"],"Aplicar el polen elegido a flores protegidas y compararlas con flores control sin ese polen","L3Q11"],["Una planta recibe polen viable, pero una alteración impide que el tubo polínico llegue al óvulo. ¿Qué etapa se ve afectada directamente?",["La llegada de los gametos masculinos al sitio de fecundación","La liberación de semillas ya maduras","La germinación del embrión después de dispersarse","La formación de polen en la antera"],"La llegada de los gametos masculinos al sitio de fecundación","L3Q12"],["Una semilla germina con normalidad en un ambiente húmedo, pero no en uno seco. ¿Qué conclusión es más razonable?",["La disponibilidad de agua puede ser un factor ambiental necesario para la germinación","La humedad cambia necesariamente los genes de la semilla","La semilla seca carece siempre de embrión","La germinación es un tipo de fecundación"],"La disponibilidad de agua puede ser un factor ambiental necesario para la germinación","L3Q13"],["Un embrión tiene 32 células y todas proceden de una única célula inicial mediante divisiones mitóticas completas. ¿Cuántas rondas de división han ocurrido?",["5","4","6","8"],"5","L3Q14"],["En una especie, un embrión temprano se divide y origina dos crías con genomas muy parecidos. ¿Qué dato apoyaría mejor que son gemelos idénticos?",["Ambos comenzaron a desarrollarse a partir del mismo cigoto","Se formaron a partir de dos óvulos distintos","Cada cría recibió un espermatozoide diferente","Tienen sexos diferentes"],"Ambos comenzaron a desarrollarse a partir del mismo cigoto","L3Q15"],["Una pareja tiene dos hijos concebidos en ocasiones distintas. ¿Por qué no se espera que sus genomas sean idénticos, aunque tengan los mismos padres?",["Cada fecundación combina gametos con distintas variantes genéticas","Los padres transmiten siempre exactamente las mismas células","Los hijos no heredan cromosomas de sus padres","La mitosis cambia de especie a cada descendiente"],"Cada fecundación combina gametos con distintas variantes genéticas","L3Q16"],["Dos huevos de ave se incuban durante el mismo tiempo, pero uno se mantiene a una temperatura muy inferior a la adecuada. ¿Qué efecto es más probable?",["El desarrollo embrionario puede retrasarse o detenerse","El embrión del huevo frío se vuelve haploide","El huevo frío se fecunda después de la incubación","La temperatura elimina de inmediato toda variación genética"],"El desarrollo embrionario puede retrasarse o detenerse","L3Q17"],["Una alteración reduce mucho el intercambio de oxígeno a través de la placenta. ¿Qué consecuencia directa puede tener para el feto?",["Recibir menos oxígeno para sus tejidos","Producir polen en los pulmones","Formar gametos antes de la fecundación","Convertir sus células diploides en esporas"],"Recibir menos oxígeno para sus tejidos","L3Q18"],["Una población de insectos tiene individuos con ciclos reproductivos en estaciones distintas. ¿Qué ventaja potencial puede aportar esta diferencia?",["Puede reducir la coincidencia de toda la reproducción con un único periodo ambiental desfavorable","Garantiza que cada individuo tenga descendencia idéntica","Evita que se formen gametos","Hace que todos los huevos sean fecundados externamente"],"Puede reducir la coincidencia de toda la reproducción con un único periodo ambiental desfavorable","L3Q19"],["En una mariposa, la larva deja de alimentarse, forma una pupa y luego emerge como adulto. ¿Qué tipo de desarrollo presenta?",["Metamorfosis completa","Desarrollo directo sin cambios de forma","Fisión binaria","Gemación"],"Metamorfosis completa","L3Q20"],["Una especie de anfibio deposita huevos en un estanque que se seca pronto. ¿Qué aspecto de su reproducción queda más expuesto al riesgo ambiental?",["Los huevos y embriones dependen de un medio externo adecuado para desarrollarse","La fecundación ocurre necesariamente dentro de la madre","Las crías se forman a partir de tubérculos","La polinización se interrumpe antes de producirse"],"Los huevos y embriones dependen de un medio externo adecuado para desarrollarse","L3Q21"],["Una planta de cultivo se propaga durante muchas generaciones mediante clones y muestra poca variación genética. ¿Qué problema puede surgir ante un patógeno nuevo?",["El patógeno podría afectar a gran parte del cultivo si todos comparten susceptibilidad","La reproducción sexual aparecerá automáticamente en cada clon","Cada clon tendrá necesariamente resistencia diferente","El patógeno no podrá infectar organismos vegetales"],"El patógeno podría afectar a gran parte del cultivo si todos comparten susceptibilidad","L3Q22"],["Un criador cruza repetidamente animales emparentados y observa con mayor frecuencia ciertas enfermedades hereditarias. ¿Qué explicación es consistente con el resultado?",["El parentesco puede aumentar la probabilidad de que se expresen variantes recesivas compartidas","La fecundación elimina todas las variantes heredadas","La reproducción sexual impide transmitir enfermedades genéticas","Los animales emparentados producen gametos sin cromosomas"],"El parentesco puede aumentar la probabilidad de que se expresen variantes recesivas compartidas","L3Q23"],["De 80 semillas sembradas, 60 germinan. ¿Cuál es la tasa de germinación observada?",["75 %","60 %","20 %","80 %"],"75 %","L3Q24"],["Una especie de pez produce 1 000 huevos, de los cuales 20 llegan a adultos. ¿Qué porcentaje alcanzó la adultez?",["2 %","20 %","0,2 %","50 %"],"2 %","L3Q25"],["Un embrión vegetal se encuentra dentro de una semilla y utiliza reservas almacenadas durante la germinación inicial. ¿Qué función cumplen esas reservas?",["Aportan materia y energía antes de que la plántula pueda sostenerse por sí misma","Realizan la fecundación después de dispersarse","Sustituyen el material genético del embrión","Producen gametos masculinos durante la polinización"],"Aportan materia y energía antes de que la plántula pueda sostenerse por sí misma","L3Q26"],["En una población de plantas, una variedad florece antes que otra y sus periodos de floración casi no se superponen. ¿Qué efecto reproductivo puede resultar?",["Disminuir el intercambio de polen entre las variedades","Aumentar necesariamente la fecundación entre variedades","Convertir las flores en organismos asexuales","Evitar la formación de gametos en ambas variedades"],"Disminuir el intercambio de polen entre las variedades","L3Q27"],["En un experimento, 30 de 40 óvulos de un grupo se fecundan, mientras que en otro grupo lo hacen 18 de 30. ¿Qué grupo tuvo mayor proporción de fecundación?",["El primero, con 75 %","El segundo, con 60 %","Ambos, con 50 %","El primero, con 30 %"],"El primero, con 75 %","L3Q28"],["Una especie de planta produce semillas por fecundación y también puede extenderse mediante rizomas. ¿Cómo se interpreta esta capacidad?",["Puede reproducirse tanto sexual como asexualmente","Los rizomas son gametos masculinos","Las semillas se forman sin que exista un embrión","La fecundación ocurre durante la división del rizoma"],"Puede reproducirse tanto sexual como asexualmente","L3Q29"],["En un experimento, un compuesto impide que los gametos se fusionen, aunque ambos se producen con normalidad. ¿Qué resultado se espera directamente?",["No se formará el cigoto por fecundación","Se formarán más cigotos por mitosis","Los gametos se convertirán en frutos","El embrión completará su desarrollo antes de iniciar"],"No se formará el cigoto por fecundación","L3Q30"]]];
const KEY='biology_reproduccion_progress_v5';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
