<script id="SAAS_ACCESS_GUARD_V1">
/* El código del profesor es obligatorio y se revalida contra la licencia en cada apertura. */
(async function(){
  const code=(localStorage.getItem('saas_classCode')||'').trim().toUpperCase();
  const name=(localStorage.getItem('saas_studentName')||'').trim();
  const fail=function(){ ['saas_access_ok','saas_classCode','saas_studentName','saas_subjects','saas_student_token'].forEach(k=>localStorage.removeItem(k)); location.replace('/catalogo.html?access=expired'); };
  if(!code||!name) return fail();
  try{
    const r=await fetch('/api/access/check?classCode='+encodeURIComponent(code),{cache:'no-store',headers:{Authorization:'Bearer '+(localStorage.getItem('saas_student_token')||'')}});
    const d=await r.json();
    if(!d.allowed || (Array.isArray(d.subjects)&&d.subjects.length&&!d.subjects.includes('fisica'))) return fail();
    localStorage.setItem('saas_access_ok','1');
    localStorage.setItem('saas_student_token',d.accessToken||localStorage.getItem('saas_student_token')||'');
    localStorage.setItem('saas_subjects',JSON.stringify(d.subjects||[]));
  }catch(e){ return fail(); }
})();
window.saasSubmitResult=async function(result){ const t=localStorage.getItem('saas_student_token')||''; if(!t) return {ok:false}; const r=await fetch('/api/results',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(result||{})}); return r.json(); };
</script>

spués de añadir la muestra marca 4,82 g. ¿Qué masa se reporta para la muestra?",["4,82 g","0,00 g","No se puede determinar sin pesar el recipiente vacío","4,82 mL"],"4,82 g","L3Q08"],["Se quiere preparar 100 mL de una disolución 0,20 mol/L a partir de una solución madre 1,0 mol/L. ¿Qué volumen de solución madre se necesita?",["20 mL","5,0 mL","50 mL","200 mL"],"20 mL","L3Q09"],["Un sólido no volátil se disuelve en agua. Después de evaporar completamente 40,0 g de disolución quedan 8,0 g de sólido. ¿Cuál era el porcentaje en masa del soluto?",["20 %","5,0 %","32 %","80 %"],"20 %","L3Q10"],["En una titulación, se obtienen volúmenes de 24,8 mL, 25,1 mL y 24,9 mL. ¿Cuál es el promedio?",["24,9 mL","25,1 mL","24,8 mL","74,8 mL"],"24,9 mL","L3Q11"],["Una lectura se repite varias veces y los valores quedan muy agrupados, pero todos se apartan del valor aceptado en la misma dirección. ¿Qué describe mejor los resultados?",["Buena precisión, pero posible error sistemático que afecta la exactitud","Buena exactitud demostrada y precisión baja","Ausencia total de error","Solo un error aleatorio sin sesgo"],"Buena precisión, pero posible error sistemático que afecta la exactitud","L3Q12"],["Un líquido desconocido podría reaccionar peligrosamente con agua. Se derraman unos mililitros en la mesa. ¿Qué respuesta es la más segura?",["Alejarse, advertir a quienes estén cerca y notificar al responsable para aplicar el protocolo específico","Cubrirlo inmediatamente con agua","Limpiarlo con papel sin identificarlo","Añadir una base fuerte para neutralizarlo"],"Alejarse, advertir a quienes estén cerca y notificar al responsable para aplicar el protocolo específico","L3Q13"],["Al destapar una botella de ácido concentrado fuera de la campana, se percibe un vapor irritante. ¿Qué acción es más apropiada?",["Cerrar el recipiente si puede hacerse sin exponerse, retirarse y trasladar la operación a la campana según indicaciones","Acercarse para confirmar el olor","Ventilar soplando sobre la boca ecipiente hasta el borde","Tapar herméticamente el recipiente durante el calentamiento"],"Calentar de forma moderada y controlada, evitando la ebullición violenta","L3Q18"],["Una pieza de vidrio caliente se coloca sobre una superficie fría y se agrieta. ¿Qué explica mejor el daño?",["El cambio brusco de temperatura produce tensiones térmicas en el vidrio","El vidrio aumentó su masa al enfriarse","El contacto con una superficie fría eleva la presión atmosférica","La superficie fría disolvió el vidrio"],"El cambio brusco de temperatura produce tensiones térmicas en el vidrio","L3Q19"],["Se mezclan 50,0 mL de una disolución 0,20 mol/L con 50,0 mL de agua, suponiendo volúmenes aditivos. ¿Cuál es la nueva concentración?",["0,10 mol/L","0,20 mol/L","0,40 mol/L","0,05 mol/L"],"0,10 mol/L","L3Q20"],["Un estudiante obtiene un valor muy distinto del esperado al medir la masa. La muestra pudo haberse pesado en un recipiente húmedo. ¿Qué problema podría causar la humedad?",["Aumentar la masa medida y hacer que se atribuya al sólido una masa excesiva","Disminuir siempre la masa del recipiente a cero","Cambiar la unidad de la balanza","Hacer que la balanza mida directamente el volumen"],"Aumentar la masa medida y hacer que se atribuya al sólido una masa excesiva","L3Q21"],["Se necesita calentar una disolución inflamable. ¿Cuál es la mejor elección general para evitar una llama abierta?",["Usar un método de calentamiento sin llama, como una placa adecuada, siguiendo el protocolo","Calentarla con un mechero en una campana sin verificar el procedimiento","Acercar una cerilla solo por unos segundos","Calentar el recipiente con papel encendido"],"Usar un método de calentamiento sin llama, como una placa adecuada, siguiendo el protocolo","L3Q22"],["La concentración de una solución es 0,80 mol/L. ¿Cuántos moles de soluto hay en 0,250 L?",["0,20 mol","3,2 mol","0,032 mol","2,0 mol"],"0,20 mol","L3Q23"],["En una reacción, 4,0 g de reactivo producen 3,2 g de producto aislado. ¿Cuál es el rendimiento porcentual si el rendimiento teórico era 4,0 g?",["80 %","125 %","0,80 %","7,2 %"],"80 %","L3Q24"],["Un sólido tiene una masa de 20,0 g y desplaza el nivel de agua de 35,0 mL a 42,5 mL. ¿Cuál es su densidad?",["2,7 g/mL","0,38 g/mL","57,5 g/mL","150 g/mL"],"2,7 g/mL","L3Q25"],["Una sustancia desconocida se etiqueta erróneamente como residuo acuoso, pero contiene un solvente orgánico inflamable. ¿Qué decisión es correcta?",["No verterla en el recipiente acuoso; consultar la clasificación y usar el contenedor indicado para ese residuo","Diluirla con agua y desecharla por el desagüe","Añadir un sólido absorbente y mezclarla con residuos comunes","Dejarla destapada para que el solvente se evapore"],"No verterla en el recipiente acuoso; consultar la clasificación y usar el contenedor indicado para ese residuo","L3Q26"],["Una pipeta graduada se usa para entregar un volumen y queda una pequeña cantidad de líquido en su punta. Si está calibrada para entregar y no para contener, ¿qué se debe hacer?",["Dejar que drene según el procedimiento, sin soplar la última gota salvo que el diseño lo indique","Soplar siempre con la boca","Enjuagar la pipeta dentro del recipiente receptor","Golpearla para expulsar todo el líquido"],"Dejar que drene según el procedimiento, sin soplar la última gota salvo que el diseño lo indique","L3Q27"],["Una muestra debe secarse hasta masa constante. Tras dos ciclos de secado y enfriamiento, las masas son 2,413 g y 2,412 g. ¿Qué interpretación es más razonable?",["La masa parece estable dentro de la resolución de la balanza","La muestra necesariamente perdió todo su contenido","La masa debe promediarse con el volumen de la muestra","La diferencia demuestra que se añadió 1 g de agua"],"La masa parece estable dentro de la resolución de la balanza","L3Q28"],["Durante una titulación, se añade demasiado titulante y se supera el punto final. ¿Qué efecto tendrá generalmente sobre el volumen registrado para alcanzar el punto final?",["Quedará sobreestimado respecto del volumen que habría sido necesario","Quedará subestimado","No podrá cambiar, porque el punto final es irreversible","Se convertirá directamente en la concentración del analito"],"Quedará sobreestimado respecto del volumen que habría sido necesario","L3Q29"],["Una muestra se transfiere desde un vaso a un matraz aforado, pero queda parte adherida a las paredes del vaso. ¿Qué medida mejora la exactitud de la preparación?",["Enjuagar el vaso varias veces con pequeñas porciones del disolvente y transferir los lavados al matraz","Añadir una cantidad adicional de soluto sin medir","Completar el matraz por encima de la marca","Secar el vaso con una toalla y descartar los restos"],"Enjuagar el vaso varias veces con pequeñas porciones del disolvente y transferir los lavados al matraz","L3Q30"]]];
const KEY='chemistry_simulador_laboratorio_progress_v5';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Tabla periódica<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
