<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balanceo de ecuaciones — Química</title><style>
:root{--bg:#07111f;--card:#102238;--line:#24425f;--text:#e6f0fa;--muted:#a7bfd4;--accent:#34d399;--gold:#fbbf24;--bad:#f87171}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#123b45,#07111f 55%);color:var(--text);font-family:system-ui,sans-serif;min-height:100vh}header{padding:24px 16px;text-align:center;border-bottom:1px solid var(--line)}header h1{margin:0;color:#6ee7b7;font-size:1.6rem}header p{color:var(--muted);margin:8px 0 0}main{max-width:760px;margin:0 auto;padding:18px 16px 48px}.card{background:rgba(16,34,56,.95);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 12px 30px #0003}label{display:block;color:#cde1ef;font-weight:700;font-size:.9rem;margin:10px 0 5px}input{width:100%;padding:12px;border:2px solid #42627c;border-radius:10px;background:#f8fafc;color:#0f172a;font-size:1rem}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;font-size:.95rem}.primary{background:#059669;color:white;width:100%;margin-top:14px}.choice{display:block;width:100%;text-align:left;background:#173452;color:var(--text);border:2px solid #315878;margin:9px 0}.choice:hover{border-color:var(--accent)}.choice.correct{background:#14532d;border-color:#4ade80}.choice.wrong{background:#5b1d28;border-color:#f87171}.hidden{display:none}.muted{color:var(--muted);line-height:1.5}.progress{height:10px;background:#183047;border-radius:99px;overflow:hidden;margin:12px 0 18px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#fbbf24);width:0;transition:.25s}.score{color:#fbbf24;font-weight:800}.feedback-good{color:#86efac;font-weight:800;font-size:1.05rem;line-height:1.6}.feedback-encourage{color:#fcd34d;font-weight:700;font-size:1.02rem;line-height:1.6}.result{text-align:center;font-size:1.2rem}.certificate{border:2px solid var(--gold);padding:18px;border-radius:14px;margin-top:14px;background:#302511}a{color:#6ee7b7}
</style></head><body><header><h1>Balanceo de ecuaciones</h1><p>Juego de Química · Aprende resolviendo retos</p></header><main><section id="setup" class="card"><h2>Identificación</h2><p class="muted">Escribe tu nombre y sección para guardar tu progreso en este juego.</p><label>Tu sección</label><input id="section" placeholder="Ejemplo: A" autocomplete="organization-section"><label>Tu nombre</label><input id="name" placeholder="Nombre y apellido" autocomplete="name"><button class="primary" id="start">Comenzar reto</button></section><section id="game" class="card hidden"><div><span>Nivel <b id="level">1</b> · Pregunta <b id="num">1</b>/5</span> · <span class="score">Aciertos: <b id="score">0</b> · Puntos: <b id="points">0</b> · Vidas: <b id="lives">3</b></span></div><div class="progress"><i id="bar"></i></div><h2 id="question"></h2><div id="choices"></div><p id="feedback" class="muted"></p><button class="primary hidden" id="next">Siguiente</button></section><section id="result" class="card hidden"></section></main><script>
const LEVEL_BANKS=[[["Nivel básico: Coeficiente de O2 en: 2H2 + ___O2 → 2H2O",["1","2","3","4"],"1","L1V0Q0"],["Nivel básico: Coeficiente de H2 en: ___H2 + O2 → 2H2O",["1","2","3","4"],"2","L1V0Q1"],["Nivel básico: Coeficiente de O2 en: C3H8 + ___O2 → 3CO2 + 4H2O",["3","4","5","6"],"5","L1V0Q2"],["Nivel básico: Coeficiente de HCl en: Zn + 2HCl → ZnCl2 + ___H2",["1","2","3","4"],"2","L1V0Q3"],["Nivel básico: Coeficiente de NaCl en: 2Na + Cl2 → ___NaCl",["1","2","3","4"],"2","L1V0Q4"],["Nivel básico: Coeficiente de CO2 en: CH4 + 2O2 → ___CO2 + 2H2O",["1","2","3","4"],"1","L1V0Q5"],["Practica: Coeficiente de O2 en: 2H2 + ___O2 → 2H2O",["1","2","3","4"],"1","L1V1Q0"],["Practica: Coeficiente de H2 en: ___H2 + O2 → 2H2O",["1","2","3","4"],"2","L1V1Q1"],["Practica: Coeficiente de O2 en: C3H8 + ___O2 → 3CO2 + 4H2O",["3","4","5","6"],"5","L1V1Q2"],["Practica: Coeficiente de HCl en: Zn + 2HCl → ZnCl2 + ___H2",["1","2","3","4"],"2","L1V1Q3"],["Practica: Coeficiente de NaCl en: 2Na + Cl2 → ___NaCl",["1","2","3","4"],"2","L1V1Q4"],["Practica: Coeficiente de CO2 en: CH4 + 2O2 → ___CO2 + 2H2O",["1","2","3","4"],"1","L1V1Q5"],["Repaso: Coeficiente de O2 en: 2H2 + ___O2 → 2H2O",["1","2","3","4"],"1","L1V2Q0"],["Repaso: Coeficiente de H2 en: ___H2 + O2 → 2H2O",["1","2","3","4"],"2","L1V2Q1"],["Repaso: Coeficiente de O2 en: C3H8 + ___O2 → 3CO2 + 4H2O",["3","4","5","6"],"5","L1V2Q2"],["Repaso: Coeficiente de HCl en: Zn + 2HCl → ZnCl2 + ___H2",["1","2","3","4"],"2","L1V2Q3"],["Repaso: Coeficiente de NaCl en: 2Na + Cl2 → ___NaCl",["1","2","3","4"],"2","L1V2Q4"],["Repaso: Coeficiente de CO2 en: CH4 + 2O2 → ___CO2 + 2H2O",["1","2","3","4"],"1","L1V2Q5"]],[["Nivel intermedio: Coeficiente de O2 en: 2H2 + ___O2 → 2H2O",["1","2","3","4"],"1","L2V0Q0"],["Nivel intermedio: Coeficiente de H2 en: ___H2 + O2 → 2H2O",["1","2","3","4"],"2","L2V0Q1"],["Nivel intermedio: Coeficiente de O2 en: C3H8 + ___O2 → 3CO2 + 4H2O",["3","4","5","6"],"5","L2V0Q2"],["Nivel intermedio: Coeficiente de HCl en: Zn + 2HCl → ZnCl2 + ___H2",["1","2","3","4"],"2","L2V0Q3"],["Nivel intermedio: Coeficiente de NaCl en: 2Na + Cl2 → ___NaCl",["1","2","3","4"],"2","L2V0Q4"],["Nivel intermedio: Coeficiente de CO2 en: CH4 + 2O2 → ___CO2 + 2H2O",["1","2","3","4"],"1","L2V0Q5"],["Aplica la regla: Coeficiente de O2 en: 2H2 + ___O2 → 2H2O",["1","2","3","4"],"1","L2V1Q0"],["Aplica la regla: Coeficiente de H2 en: ___H2 + O2 → 2H2O",["1","2","3","4"],"2","L2V1Q1"],["Aplica la regla: Coeficiente de O2 en: C3H8 + ___O2 → 3CO2 + 4H2O",["3","4","5","6"],"5","L2V1Q2"],["Aplica la regla: Coeficiente de HCl en: Zn + 2HCl → ZnCl2 + ___H2",["1","2","3","4"],"2","L2V1Q3"],["Aplica la regla: Coeficiente de NaCl en: 2Na + Cl2 → ___NaCl",["1","2","3","4"],"2","L2V1Q4"],["Aplica la regla: Coeficiente de CO2 en: CH4 + 2O2 → ___CO2 + 2H2O",["1","2","3","4"],"1","L2V1Q5"],["Reto intermedio: Coeficiente de O2 en: 2H2 + ___O2 → 2H2O",["1","2","3","4"],"1","L2V2Q0"],["Reto intermedio: Coeficiente de H2 en: ___H2 + O2 → 2H2O",["1","2","3","4"],"2","L2V2Q1"],["Reto intermedio: Coeficiente de O2 en: C3H8 + ___O2 → 3CO2 + 4H2O",["3","4","5","6"],"5","L2V2Q2"],["Reto intermedio: Coeficiente de HCl en: Zn + 2HCl → ZnCl2 + ___H2",["1","2","3","4"],"2","L2V2Q3"],["Reto intermedio: Coeficiente de NaCl en: 2Na + Cl2 → ___NaCl",["1","2","3","4"],"2","L2V2Q4"],["Reto intermedio: Coeficiente de CO2 en: CH4 + 2O2 → ___CO2 + 2H2O",["1","2","3","4"],"1","L2V2Q5"]],[["Nivel avanzado: Coeficiente de O2 en: 2H2 + ___O2 → 2H2O",["1","2","3","4"],"1","L3V0Q0"],["Nivel avanzado: Coeficiente de H2 en: ___H2 + O2 → 2H2O",["1","2","3","4"],"2","L3V0Q1"],["Nivel avanzado: Coeficiente de O2 en: C3H8 + ___O2 → 3CO2 + 4H2O",["3","4","5","6"],"5","L3V0Q2"],["Nivel avanzado: Coeficiente de HCl en: Zn + 2HCl → ZnCl2 + ___H2",["1","2","3","4"],"2","L3V0Q3"],["Nivel avanzado: Coeficiente de NaCl en: 2Na + Cl2 → ___NaCl",["1","2","3","4"],"2","L3V0Q4"],["Nivel avanzado: Coeficiente de CO2 en: CH4 + 2O2 → ___CO2 + 2H2O",["1","2","3","4"],"1","L3V0Q5"],["Analiza y resuelve: Coeficiente de O2 en: 2H2 + ___O2 → 2H2O",["1","2","3","4"],"1","L3V1Q0"],["Analiza y resuelve: Coeficiente de H2 en: ___H2 + O2 → 2H2O",["1","2","3","4"],"2","L3V1Q1"],["Analiza y resuelve: Coeficiente de O2 en: C3H8 + ___O2 → 3CO2 + 4H2O",["3","4","5","6"],"5","L3V1Q2"],["Analiza y resuelve: Coeficiente de HCl en: Zn + 2HCl → ZnCl2 + ___H2",["1","2","3","4"],"2","L3V1Q3"],["Analiza y resuelve: Coeficiente de NaCl en: 2Na + Cl2 → ___NaCl",["1","2","3","4"],"2","L3V1Q4"],["Analiza y resuelve: Coeficiente de CO2 en: CH4 + 2O2 → ___CO2 + 2H2O",["1","2","3","4"],"1","L3V1Q5"],["Reto avanzado: Coeficiente de O2 en: 2H2 + ___O2 → 2H2O",["1","2","3","4"],"1","L3V2Q0"],["Reto avanzado: Coeficiente de H2 en: ___H2 + O2 → 2H2O",["1","2","3","4"],"2","L3V2Q1"],["Reto avanzado: Coeficiente de O2 en: C3H8 + ___O2 → 3CO2 + 4H2O",["3","4","5","6"],"5","L3V2Q2"],["Reto avanzado: Coeficiente de HCl en: Zn + 2HCl → ZnCl2 + ___H2",["1","2","3","4"],"2","L3V2Q3"],["Reto avanzado: Coeficiente de NaCl en: 2Na + Cl2 → ___NaCl",["1","2","3","4"],"2","L3V2Q4"],["Reto avanzado: Coeficiente de CO2 en: CH4 + 2O2 → ___CO2 + 2H2O",["1","2","3","4"],"1","L3V2Q5"]]];
const KEY='chemistry_balanceo_ecuaciones_progress_v3';
const MAX_POINTS=300;
let name='',section='',level=1,score=0,points=0,lives=3,current=0,round=[],used={1:[],2:[],3:[]};
const $=id=>document.getElementById(id);
function mix(a){return [...a].sort(()=>Math.random()-.5)}
function loadProgress(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.name){name=x.name;section=x.section;level=x.level||1;points=x.points||0;used=x.used||used}}catch(e){}}
function saveProgress(){localStorage.setItem(KEY,JSON.stringify({name,section,level,points,used}))}
function start(){name=$('name').value.trim();section=$('section').value.trim();if(!name||!section){alert('Escribe tu nombre y sección.');return}level=1;points=0;score=0;current=0;used={1:[],2:[],3:[]};saveProgress();$('setup').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
function startRound(){score=0;current=0;lives=3;$('lives').textContent=lives;$('points').textContent=points;const pool=LEVEL_BANKS[level-1];let available=pool.filter(q=>!used[level].includes(q[3]));if(available.length<5){used[level]=[];available=pool}round=mix(available).slice(0,5);saveProgress();render()}
function render(){const q=round[current];$('level').textContent=level;$('num').textContent=current+1;$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('bar').style.width=((current)/5*100)+'%';$('question').textContent=q[0];$('feedback').className='muted';$('feedback').textContent='';$('next').classList.add('hidden');const box=$('choices');box.innerHTML='';mix(q[1]).forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c,q[2]);box.appendChild(b)})}
function answer(btn,c,correct){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);used[level].push(round[current][3]);if(c===correct){score++;points+=level*10;btn.classList.add('correct');$('feedback').className='feedback-good';$('feedback').innerHTML='✨ ¡Excelente! Respuesta correcta. +'+(level*10)+' puntos';}else{lives--;btn.classList.add('wrong');document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct')});$('feedback').className='feedback-encourage';$('feedback').innerHTML='😔 No te rindas. La respuesta era: <b>'+correct+'</b><br>¡Sigue intentando, todavía puedes avanzar!';}$('score').textContent=score;$('points').textContent=points;$('lives').textContent=lives;$('next').textContent=lives===0?'Terminar nivel':'Siguiente';$('next').classList.remove('hidden');saveProgress()}
$('start').onclick=start;$('next').onclick=()=>{current++;if(current>=5||lives<=0)finishRound();else render()};
function finishRound(){$('game').classList.add('hidden');$('result').classList.remove('hidden');const passed=score>=4&&lives>0;if(passed&&level<3){$('result').innerHTML=`<div class="result"><h2>✨ ¡Nivel ${level} aprobado!</h2><p>Resultado: <b>${score}/5</b> · Vidas restantes: ${lives}</p><p class="score">Puntos acumulados: ${points}</p><p class="muted">La dificultad aumentará en el siguiente nivel.</p><button class="primary" onclick="nextLevel()">Pasar al nivel ${level+1}</button></div>`}else if(passed){const grade=Math.round(points/MAX_POINTS*20);$('result').innerHTML=`<div class="result"><h2>✨ ¡Reto completado!</h2><p><b>${name}</b> · Sección ${section}</p><p class="score">Puntos: ${points}/${MAX_POINTS} · Nota: <b>${grade}/20</b></p><div class="certificate"><b>Certificado de logro en Química</b><br>Balanceo de ecuaciones<br><small>Participante: ${name} · Sección: ${section}<br>Puntaje: ${points}/${MAX_POINTS} · Nota final: <b>${grade}/20</b></small></div><button class="primary" onclick="location.reload()">Jugar nuevamente</button></div>`}else{$('result').innerHTML=`<div class="result"><h2>😔 Nivel ${level} no aprobado</h2><p>Obtuviste <b>${score}/5</b> y te quedaste con <b>${lives} vidas</b>.</p><p class="muted">Al repetir recibirás preguntas diferentes. ¡No te rindas: cada intento te ayuda a aprender!</p><p class="score">Puntos acumulados: ${points}</p><button class="primary" onclick="retryLevel()">Reintentar nivel ${level}</button></div>`}saveProgress()}
function nextLevel(){level++;$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}function retryLevel(){$('result').classList.add('hidden');$('game').classList.remove('hidden');startRound()}
loadProgress();
</script></body></html>
